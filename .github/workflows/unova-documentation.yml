name: Unova E - documentos e ferramentas (sem Game.exe)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/regions/audit_unova_*.py'
      - 'scripts/regions/unova_*.py'
      - 'tests/test_unova_*.py'
      - 'data/regions/unova-*.json'
      - 'docs/UNOVA_*.md'
      - 'UNOVA_*AUDITAR*.bat'
      - 'UNOVA_VALIDAR_DOCUMENTACAO.bat'
      - 'UNOVA_E04_ESCOLHER_FONTE.bat'
      - 'UNOVA_CATALOGAR_NPCS.bat'
      - 'UNOVA_CHEREN_SP05_QA.bat'
      - 'UNOVA_VALIDAR_EVENTOS_NUVEMA.bat'
      - 'UNOVA_A04_AUDITAR_MAPIDS.bat'
      - 'UNOVA_A05_PLANEJAR_MAPIDS.bat'
      - 'RUN_UNOVA_MAPIDS.bat'
      - '.github/workflows/unova-documentation.yml'
  pull_request:
    paths:
      - 'RUN_UNOVA_MAPIDS.bat'
      - 'scripts/regions/audit_unova_*.py'
      - 'tests/test_unova_*.py'
      - 'data/regions/unova-*.json'
      - 'docs/UNOVA_*.md'
      - '.github/workflows/unova-documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unova-docs-only:
    name: Auditoria segura E - sem mapas instalados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir que Unova permanece planned
        run: |
          python scripts/regions/audit_unova_u03_catalog.py
          python scripts/regions/audit_unova_e06_e07.py
          python scripts/regions/audit_unova_e08_readiness.py
          python scripts/regions/audit_unova_sp04_npcs.py
          python scripts/regions/unova_sp05_cheren_pilot.py
          python scripts/regions/audit_unova_u07_events.py --simulate-demo
          python scripts/regions/audit_unova_g01_state_schema.py --check
          python scripts/regions/audit_unova_g01_chapter_machine.py --check
          python scripts/regions/audit_unova_g01_chapter_machine.py --simulate-demo
          python scripts/regions/audit_unova_g01_reentry_ledger.py --check
          python scripts/regions/audit_unova_g01_reentry_ledger.py --simulate-demo
          python scripts/regions/audit_unova_g01_serialization.py --check
          python scripts/regions/audit_unova_g01_serialization.py --simulate-demo
          python scripts/regions/audit_unova_g02_gym_story.py --check
          python scripts/regions/audit_unova_g02_gym_story.py --simulate-demo
          python scripts/regions/audit_unova_g02_elite_finale.py --check
          python scripts/regions/audit_unova_g02_elite_finale.py --simulate-demo
          # A04 native baseline is private and absent in CI; negative tests cover this gate.
          python scripts/regions/audit_unova_a05_candidates.py
      - name: Testes negativos de ZIP RXDATA, direitos, equipes e barras E
        run: python -m unittest discover -s tests -p 'test_unova_*.py' -v
      - name: Compilar sintaxe Python sem executar mapas nem modificar saves
        run: |
          python -m py_compile scripts/regions/audit_unova_u02.py
          python -m py_compile scripts/regions/audit_unova_u03_catalog.py
          python -m py_compile scripts/regions/audit_unova_source_detail.py
          python -m py_compile scripts/regions/audit_unova_e06_e07.py
          python -m py_compile scripts/regions/audit_unova_e08_readiness.py
          python -m py_compile scripts/regions/audit_unova_e05_crosswalk.py
          python -m py_compile scripts/regions/audit_unova_e06_rights_inventory.py
          python -m py_compile scripts/regions/unova_e04_intake.py
          python -m py_compile scripts/regions/audit_unova_e04_e06_evidence.py
          python -m py_compile scripts/regions/audit_unova_sprite_pack.py
          python -m py_compile scripts/regions/audit_unova_sp04_npcs.py
          python -m py_compile scripts/regions/unova_sp05_cheren_pilot.py
          python -m py_compile scripts/regions/audit_unova_u07_events.py
          python -m py_compile scripts/regions/audit_unova_g01_state_schema.py
          python -m py_compile scripts/regions/audit_unova_g01_chapter_machine.py
          python -m py_compile scripts/regions/audit_unova_g01_reentry_ledger.py
          python -m py_compile scripts/regions/audit_unova_g01_serialization.py
          python -m py_compile scripts/regions/audit_unova_g02_gym_story.py
          python -m py_compile scripts/regions/audit_unova_g02_elite_finale.py
          python -m py_compile scripts/regions/audit_unova_a04_mapids.py
          python -m py_compile scripts/regions/audit_unova_a05_candidates.py
          python -m py_compile scripts/regions/audit_unova_a06_references.py
          python -m py_compile scripts/regions/audit_unova_a07_reference_provenance.py
          python -m py_compile scripts/regions/audit_unova_a08_readiness.py
          python -m py_compile scripts/regions/audit_unova_a09_intro_and_claims.py
          python -m py_compile scripts/regions/audit_unova_a10_dynamic_matrix.py
          python -m py_compile scripts/regions/audit_unova_a11_intro_preflight.py
          python -m py_compile scripts/regions/audit_unova_a12_ownership.py
          python -m py_compile scripts/regions/audit_unova_a13_private_qa.py
          python -m py_compile scripts/regions/audit_unova_a14_sandbox.py
          python -m py_compile scripts/regions/unova_auto_mapids.py

      - name: Empacotar RUN_UNOVA_MAPIDS.bat para download como ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RUN_UNOVA_MAPIDS
          path: RUN_UNOVA_MAPIDS.bat
          if-no-files-found: error
          retention-days: 7

  unova-windows-qa:
    name: A04 A05 BAT portatil - regressao nativa Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar caminhos JSON e A05 no Windows
        shell: cmd
        run: |
          python -m unittest discover -s tests -p test_unova_a05_candidates.py -v
          python -m unittest discover -s tests -p test_unova_a06_references.py -v
          python -m unittest discover -s tests -p test_unova_a07_reference_provenance.py -v
          python -m unittest discover -s tests -p test_unova_a08_readiness.py -v
          python -m unittest discover -s tests -p test_unova_a09_intro_and_claims.py -v
          python -m unittest discover -s tests -p test_unova_a10_dynamic_matrix.py -v
          python -m unittest discover -s tests -p test_unova_a11_intro_preflight.py -v
          python -m unittest discover -s tests -p test_unova_a12_ownership.py -v
          python -m unittest discover -s tests -p test_unova_a13_private_qa.py -v
          python -m unittest discover -s tests -p test_unova_a14_sandbox.py -v
          python -m unittest discover -s tests -p test_unova_g01_state_schema.py -v
          python -m unittest discover -s tests -p test_unova_g01_chapter_machine.py -v
          python -m unittest discover -s tests -p test_unova_g01_reentry_ledger.py -v
          python -m unittest discover -s tests -p test_unova_g01_serialization.py -v
          python -m unittest discover -s tests -p test_unova_g02_gym_story.py -v
          python -m unittest discover -s tests -p test_unova_g02_elite_finale.py -v
          python -m unittest discover -s tests -p test_unova_auto_mapids.py -v
          python -m unittest discover -s tests -p test_unova_standalone_bat.py -v
      - name: Empacotar BAT validado no Windows como ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RUN_UNOVA_MAPIDS_CORRIGIDO_WINDOWS
          path: RUN_UNOVA_MAPIDS.bat
          if-no-files-found: error
          retention-days: 7
