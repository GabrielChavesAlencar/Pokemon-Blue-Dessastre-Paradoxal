name: Kalos KA02 - protecao de MapIDs
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kalos-ka02-mapids.yml'
      - 'docs/kalos/KA02_AUDITORIA_MAPIDS.md'
      - 'qa/kalos_mapids/**'
      - 'tests/test_kalos_ka02_candidates.py'
permissions:
  contents: read
concurrency:
  group: kalos-ka02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  historic-census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Confirmar que este PR não toca outros fluxos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          MERGED_BASE="$(git rev-parse HEAD^1)"
          git merge-base --is-ancestor "$BASE" "$MERGED_BASE"
          export MERGED_BASE
          git diff --check "$MERGED_BASE" HEAD
          python - <<'PY'
          import os, subprocess
          files = set(subprocess.check_output(["git","diff","--name-only",os.environ["MERGED_BASE"],"HEAD"],text=True).splitlines())
          assert files == {
              ".github/workflows/kalos-ka02-mapids.yml",
              "docs/kalos/KA02_AUDITORIA_MAPIDS.md",
              "qa/kalos_mapids/ka02_candidates.py",
              "tests/test_kalos_ka02_candidates.py",
          }, files
          print("Kalos KA02 exact PR", os.environ["PR_HEAD"])
          PY
          python -m unittest discover -s tests -p test_kalos_ka02_candidates.py -v
      - name: Inventariar referências reais na instalação histórica, sem instalar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kalos-ka02" .blue-work/kalos-ka02
          gh release download android-multiregion-247-02732ea -R "$GITHUB_REPOSITORY" \
            --pattern 'Blue-Android-Decades-Kanto-Hoenn.zip' --dir "$RUNNER_TEMP/kalos-ka02"
          python qa/kalos_mapids/ka02_candidates.py \
            --archive "$RUNNER_TEMP/kalos-ka02/Blue-Android-Decades-Kanto-Hoenn.zip" \
            > .blue-work/kalos-ka02/historical.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path(".blue-work/kalos-ka02/historical.json").read_text())
          assert report["maps_inertly_parsed"] == report["observed_physical_count"] > 0
          assert report["may_allocate"] is report["current_sources_and_claims_verified"] is False
          assert report["mapids_allocated"] == 0
          print(f"{report['maps_inertly_parsed']} mapas, {report['pbs_connection_lines_seen']} conexões PBS; {report['transfer_201_dynamic_count_not_resolved']} transferências variáveis exigem revisão.")
          h = report["historical_script_heuristics"]
          print(f"{h.get('script_sections_examined',0)} seções Ruby examinadas sem execução, {h.get('common_events_examined',0)} eventos comuns, {h.get('compiled_script_entries_examined',0)} entradas de Scripts, {h.get('script_transfer_unresolved',0)} destinos em scripts continuam sem resolução.")
          locators = report["historical_unresolved_script_locations"]
          assert len(locators) + h.get("script_locators_truncated",0) == h.get("script_transfer_unresolved",0)
          print(f"{len(locators)} localizadores numéricos sanitizados; nenhum trecho de código exportado.")
          print("KALOS_KA02_HISTORICAL_MAPID_GUARD_OK")
          print("KALOS_KA02_CURRENT_NATIVE_APPROVAL_PENDING")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kalos-ka02-historical-census-metadata-only
          path: .blue-work/kalos-ka02/historical.json
          if-no-files-found: error
