name: Sinnoh L16 - public exit criteria and human gates (no native QA)
on:
  pull_request:
    paths:
      - '.github/workflows/sinnoh-l16-public-exit-gates.yml'
      - 'data/regions/sinnoh-l16-public-exit-gates.json'
      - 'site/public/data/sinnoh-l16-public-exit-gates.json'
      - 'site/public/sinnoh-l16-criterios-saida.html'
      - 'site/public/assets/sinnoh-l16-public-exit-gates.js'
      - 'site/tests/sinnoh-l16-public-exit-gates.test.mjs'
      - 'site/src/index.html'
      - 'scripts/regions/audit_sinnoh_l16_exit_gates.py'
      - 'tests/test_sinnoh_l16_exit_gates.py'
      - 'docs/SINNOH_L16_CRITERIOS_SAIDA_PUBLICOS.md'
      - 'data/regions/sinnoh-l15-public-consistency-diff.json'
      - 'site/public/data/sinnoh-l15-public-consistency-diff.json'
      - 'data/regions/sinnoh-l14-public-readiness-matrix.json'
      - 'site/public/data/sinnoh-l14-public-readiness-matrix.json'
      - 'data/regions/sinnoh-l13-public-evidence-queue.json'
      - 'site/public/data/sinnoh-l13-public-evidence-queue.json'
      - 'data/regions/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/data/sinnoh-l12-public-coverage-gaps.json'
      - 'data/regions/sinnoh-l11-public-traceability.json'
      - 'site/public/data/sinnoh-l11-public-traceability.json'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sinnoh-l16-public-exit-gates.yml'
      - 'data/regions/sinnoh-l16-public-exit-gates.json'
      - 'site/public/data/sinnoh-l16-public-exit-gates.json'
      - 'site/public/sinnoh-l16-criterios-saida.html'
      - 'site/public/assets/sinnoh-l16-public-exit-gates.js'
      - 'site/tests/sinnoh-l16-public-exit-gates.test.mjs'
      - 'site/src/index.html'
      - 'scripts/regions/audit_sinnoh_l16_exit_gates.py'
      - 'tests/test_sinnoh_l16_exit_gates.py'
      - 'docs/SINNOH_L16_CRITERIOS_SAIDA_PUBLICOS.md'
      - 'data/regions/sinnoh-l15-public-consistency-diff.json'
      - 'site/public/data/sinnoh-l15-public-consistency-diff.json'
      - 'data/regions/sinnoh-l14-public-readiness-matrix.json'
      - 'site/public/data/sinnoh-l14-public-readiness-matrix.json'
      - 'data/regions/sinnoh-l13-public-evidence-queue.json'
      - 'site/public/data/sinnoh-l13-public-evidence-queue.json'
      - 'data/regions/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/data/sinnoh-l12-public-coverage-gaps.json'
      - 'data/regions/sinnoh-l11-public-traceability.json'
      - 'site/public/data/sinnoh-l11-public-traceability.json'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l16-public-gates:
    name: L16 / 88 pending criteria, no native authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L16 synthetic negatives and invariants
        run: python -m unittest discover -s tests -p 'test_sinnoh_l16_exit_gates.py' -v
      - name: Audit L16 source blobs, criteria and 0 approvals
        run: |
          python scripts/regions/audit_sinnoh_l16_exit_gates.py > /tmp/sinnoh-l16-public.json
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('/tmp/sinnoh-l16-public.json').read_text('utf8')
          report=json.loads(output)
          assert report['stage']=='L16'
          assert report['status']=='PUBLIC_EXIT_GATES_VALID_ALL_UNMET'
          assert report['baseline_commits']=={
           'L07':'d98033b362dac82347e0d97cb5606870eaa70b22',
           'L08':'8617ef47ea6745920cb6fe4be251982380d7628d',
           'L09':'39e51de92aafdab3f5aea3f929f57f5c0bb72b2d',
           'L10':'7fd821007e63fe9cf0d0c4bf14d153a23cda2b6a',
           'L11':'9d901a0cf21aa2742f731ee387a51f945bac8a5d',
           'L12':'58b7f2fec9f66dee06d95676eec66fb2ded6a1de',
           'L13':'1f12bcc86c10dcc934b024a0562cdadb65d5e2c2',
           'L14':'11eda18f7225e16b13007c1eb955ccc3d7667b66',
           'L15':'0192075fb02587c9f3d9db6b170500cba365251c'}
          assert report['public_sources']==[
           {'stage':'L13','path':'data/regions/sinnoh-l13-public-evidence-queue.json','git_blob_sha1':'357215cdfd96b37eaac291e1c0ab3873069a12fe'},
           {'stage':'L14','path':'data/regions/sinnoh-l14-public-readiness-matrix.json','git_blob_sha1':'d882d6a20b1c01be33744f14ab7826af2fb6ef41'},
           {'stage':'L15','path':'data/regions/sinnoh-l15-public-consistency-diff.json','git_blob_sha1':'1a19883a3f0523add6aeaa4f78262b922a041e95'}]
          assert (report['requests_total'],report['requests_blocked'],report['exit_criteria_met'])==(88,88,0)
          assert (report['public_documentary_links'],report['anonymous_slots'])==(1084,18)
          assert (report['human_criteria_pending'],report['native_cases_pending'])==(20,44)
          assert (report['windows_native_pending'],report['android_native_pending'])==(43,1)
          assert (report['local_reports_received'],report['human_approved'],report['native_executed'],
                  report['native_approved'],report['phase_bcd_approved'])==(0,0,0,0,0)
          assert report['phase_bcd_total']==13
          assert report['r07_pending'] and report['r08_pending'] and report['r09_pending']
          assert report['r09_global_only'] and report['no_private_uploads'] and report['no_native_authorization']
          assert report['sinnoh_playable'] is False
          for secret in ('Save01.rxdata','private-baseline.json','hmac_key','watch_id'):
           assert secret not in output
          print('SINNOH_L16_88_PENDING_1084_PUBLIC_EDGES_0_REAL_QA')
          PY
      - name: Do not intake private reports, saves or host sources
        run: |
          test ! -e .blue-work/sinnoh-l00-input/public-reports.json
          test ! -e .blue-work/sinnoh-l01-source
          echo 'SINNOH_L16_PUBLIC_ONLY_NO_NATIVE_ACCESS'

  l16-regressions:
    name: L16 / L15 to L00 and G12 strict regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L15 public consistency
        run: python -m unittest discover -s tests -p 'test_sinnoh_l15_consistency_diff.py' -v
      - name: L14 public dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l14_readiness.py' -v
      - name: L13 public request queue
        run: python -m unittest discover -s tests -p 'test_sinnoh_l13_public_queue.py' -v
      - name: L12 coverage gaps
        run: python -m unittest discover -s tests -p 'test_sinnoh_l12_coverage_gaps.py' -v
      - name: L11 traceability
        run: python -m unittest discover -s tests -p 'test_sinnoh_l11_traceability.py' -v
      - name: L10 blocker index
        run: python -m unittest discover -s tests -p 'test_sinnoh_l10_public_index.py' -v
      - name: L09 handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_l09_public_handoff.py' -v
      - name: L08 source snapshot
        run: python -m unittest discover -s tests -p 'test_sinnoh_l08_pinned_snapshot.py' -v
      - name: L07 public triage
        run: python -m unittest discover -s tests -p 'test_sinnoh_l07_public_triage.py' -v
      - name: L06 human evidence
        run: python -m unittest discover -s tests -p 'test_sinnoh_l06_human_evidence.py' -v
      - name: L05 dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l05_native_dependencies.py' -v
      - name: L04 human review
        run: python -m unittest discover -s tests -p 'test_sinnoh_l04_human_review.py' -v
      - name: L03 matrix
        run: python -m unittest discover -s tests -p 'test_sinnoh_l03_matrix.py' -v
      - name: L02 sanitizer
        run: python -m unittest discover -s tests -p 'test_sinnoh_l02_evidence.py' -v
      - name: L01 exporter
        run: python -m unittest discover -s tests -p 'test_sinnoh_l01_exporter.py' -v
      - name: L00 readiness
        run: python -m unittest discover -s tests -p 'test_sinnoh_l00_readiness.py' -v
      - name: G12 fixture handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_g12_handoff.py' -v

  l16-portal:
    name: L16 / read-only page, Node checks and full build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check read-only JS
        run: node --check site/public/assets/sinnoh-l16-public-exit-gates.js
      - name: Portal tests L16 L15 L14 L13 L12 L11 L10 L07
        working-directory: site
        run: node --test tests/sinnoh-l16-public-exit-gates.test.mjs tests/sinnoh-l15-public-diff.test.mjs tests/sinnoh-l14-public-readiness.test.mjs tests/sinnoh-l13-public-queue.test.mjs tests/sinnoh-l12-coverage-gaps.test.mjs tests/sinnoh-l11-traceability.test.mjs tests/sinnoh-l10-blocker-index.test.mjs tests/sinnoh-l07-triage.test.mjs
      - name: Full portal build
        working-directory: site
        run: npm run build
      - name: Ensure L16 outputs and portal index
        run: |
          test -s site/dist/sinnoh-l16-criterios-saida.html
          test -s site/dist/data/sinnoh-l16-public-exit-gates.json
          test -s site/dist/assets/sinnoh-l16-public-exit-gates.js
          grep -q 'sinnoh-l16-criterios-saida.html' site/dist/index.html
          echo 'SINNOH_L16_STATIC_PENDING_GATES_NO_PHYSICAL_APPROVAL'
