name: Portal Blue - validar site
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/export_site_data.py', '.github/workflows/site-checks.yml']
  pull_request:
    paths: ['site/**', 'scripts/export_site_data.py', '.github/workflows/site-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm test --prefix site
      - run: npm run build --prefix site
