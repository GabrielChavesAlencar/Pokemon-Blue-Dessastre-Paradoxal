name: "Kanto K05: inventário da fonte Lavender"
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/regions/audit_k05_lavender.py'
      - 'scripts/regions/build_k05_city.py'
      - 'scripts/regions/build_k05_tower.py'
      - 'scripts/regions/k05_tower_actors.py'
      - 'scripts/regions/KantoK05Tower.rb'
      - 'scripts/regions/k05_lavender_services.py'
      - 'scripts/regions/KantoK05City.rb'
      - 'tests/test_kanto_k05_tower.py'
      - 'scripts/regions/KantoK05CityNativeCheck.rb'
      - 'scripts/regions/KantoK05TowerNativeCheck.rb'
      - 'scripts/regions/native_check.py'
      - 'tests/test_kanto_k05_city.py'
      - 'tests/test_kanto_k05_source.py'
      - '.github/workflows/kanto-k05-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kanto-k05-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar contrato do inventário
        shell: powershell
        run: |
          python -m unittest discover -s tests -p 'test_kanto_k05*.py'
          if($LASTEXITCODE -ne 0){throw 'K05 source contract tests failed'}
      - name: Auditar cidade, serviços e torre na fonte fixada
        shell: powershell
        run: |
          python scripts/install_game.py --apply --skip-kanto
          if($LASTEXITCODE -ne 0){throw 'Disposable Decades base unavailable'}
          python scripts/regions/ensure_source.py
          if($LASTEXITCODE -ne 0){throw 'Pinned Kanto source unavailable'}
          python scripts/regions/audit_k05_lavender.py
          if($LASTEXITCODE -ne 0){throw 'K05 source audit failed'}
      - name: Preparar terreno e serviços de Lavender em cópia isolada
        shell: powershell
        run: |
          python scripts/regions/pilot.py --output .blue-work/kanto-k05-baseline
          if($LASTEXITCODE -ne 0){throw 'Cannot build published 165-map K04 baseline'}
          python scripts/regions/build_k05_city.py
          if($LASTEXITCODE -ne 0){throw 'K05 city adapter failed'}
      - name: Preparar sete andares e manter o topo da Torre bloqueado
        shell: powershell
        run: |
          python scripts/regions/build_k05_tower.py
          if($LASTEXITCODE -ne 0){throw 'K05 Tower terrain and guard adapter failed'}
      - name: Provar fronteira, portas e serviços na engine Windows
        shell: powershell
        run: |
          $root=(Resolve-Path .blue-work/kanto-k05-city).Path
          python scripts/regions/native_check.py $root --k05-city
          if($LASTEXITCODE -ne 0){throw 'K05 native injection failed'}
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'k05-mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          if((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa checksum failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'k05-mesa'
          & "$env:ProgramFiles/7-Zip/7z.exe" x $mesa "-o$mesaFolder" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Mesa extraction failed'}
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $root }
          $proof="$root/Data/blue-kanto-k05-city-proof.txt"
          $errorFile="$root/Data/blue-kanto-error.txt"
          for($attempt=1;$attempt -le 2;$attempt++){
            $stdout=".blue-work/kanto-k05-city-out-$attempt.txt"
            $stderr=".blue-work/kanto-k05-city-err-$attempt.txt"
            $proc=Start-Process -FilePath "$root/Game.exe" -WorkingDirectory $root -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $handle=$proc.Handle
            if(-not $proc.WaitForExit(180000)){
              Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
              break
            }
            if((Test-Path $proof) -or (Test-Path $errorFile)){break}
            if($attempt -ne 1 -or -not ((Get-Content $stdout,$stderr -Raw -ErrorAction SilentlyContinue) -match '(?i)compil')){break}
            Write-Host 'KANTO_K05_FIRST_COMPILE_BOOT_RESTART'
          }
          if(!(Test-Path $proof -PathType Leaf) -or (Test-Path $errorFile -PathType Leaf)){
            Get-Content $stdout,$stderr,"$root/Data/blue-kanto-k05-city-stage.txt","$root/Data/blue-kanto-k01b-route-trace.txt",$errorFile,"$root/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 140
            throw 'K05 native Lavender proof missing'
          }
          Write-Host ("KANTO_K05_CITY_NATIVE_REPORT:"+(Get-Content $proof -Raw).Trim())
          Write-Host 'KANTO_K05_CITY_NATIVE_OK'
      - name: Subir e descer a Torre na engine sem abrir o topo
        shell: powershell
        run: |
          $root=(Resolve-Path .blue-work/kanto-k05-tower).Path
          python scripts/regions/native_check.py $root --k05-tower
          if($LASTEXITCODE -ne 0){throw 'K05 Tower native fixture injection failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'k05-mesa'
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $root }
          $proof="$root/Data/blue-kanto-k05-tower-native-proof.txt"
          $errorFile="$root/Data/blue-kanto-error.txt"
          for($attempt=1;$attempt -le 2;$attempt++){
            $stdout=".blue-work/kanto-k05-tower-out-$attempt.txt"
            $stderr=".blue-work/kanto-k05-tower-err-$attempt.txt"
            $proc=Start-Process -FilePath "$root/Game.exe" -WorkingDirectory $root -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $handle=$proc.Handle
            if(-not $proc.WaitForExit(180000)){
              Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue
              break
            }
            if((Test-Path $proof) -or (Test-Path $errorFile)){break}
            if($attempt -ne 1 -or -not ((Get-Content $stdout,$stderr -Raw -ErrorAction SilentlyContinue) -match '(?i)compil')){break}
            Write-Host 'KANTO_K05_TOWER_FIRST_COMPILE_BOOT_RESTART'
          }
          if(!(Test-Path $proof -PathType Leaf) -or (Test-Path $errorFile -PathType Leaf)){
            Get-Content $stdout,$stderr,"$root/Data/blue-kanto-k05-tower-native-stage.txt",$errorFile,"$root/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 140
            throw 'K05 native Tower proof missing'
          }
          Write-Host ("KANTO_K05_TOWER_NATIVE_REPORT:"+(Get-Content $proof -Raw).Trim())
          Write-Host 'KANTO_K05_TOWER_NATIVE_STAIRS_OK'
      - name: Reunir apenas recibos e diagnósticos em diretório visível
        if: always() && hashFiles('.blue-work/kanto-k05-source.json') != ''
        shell: powershell
        run: |
          $dest=New-Item -ItemType Directory -Force -Path 'k05-receipts'
          @(
            '.blue-work/kanto-k05-source.json',
            '.blue-work/kanto-k05-city-stage.json',
            '.blue-work/kanto-k05-tower-stage.json',
            '.blue-work/kanto-k05-city/Data/blue-kanto-k05-city-proof.txt',
            '.blue-work/kanto-k05-city/Data/blue-kanto-k05-city-stage.txt',
            '.blue-work/kanto-k05-city/Data/blue-kanto-error.txt',
            '.blue-work/kanto-k05-city-out-1.txt',
            '.blue-work/kanto-k05-city-err-1.txt',
            '.blue-work/kanto-k05-city-out-2.txt',
            '.blue-work/kanto-k05-city-err-2.txt',
            '.blue-work/kanto-k05-tower/Data/blue-kanto-k05-tower-native-proof.txt',
            '.blue-work/kanto-k05-tower/Data/blue-kanto-k05-tower-native-stage.txt',
            '.blue-work/kanto-k05-tower-out-1.txt',
            '.blue-work/kanto-k05-tower-err-1.txt',
            '.blue-work/kanto-k05-tower-out-2.txt',
            '.blue-work/kanto-k05-tower-err-2.txt'
          ) | ForEach-Object {
            if(Test-Path -LiteralPath $_ -PathType Leaf){ Copy-Item -LiteralPath $_ -Destination $dest.FullName }
          }
          $towerError='.blue-work/kanto-k05-tower/Data/blue-kanto-error.txt'
          if(Test-Path -LiteralPath $towerError -PathType Leaf){
            Copy-Item -LiteralPath $towerError -Destination (Join-Path $dest.FullName 'k05-tower-native-error.txt')
          }
      - name: Guardar recibo sem jogo, scripts de origem ou saves
        if: always() && hashFiles('k05-receipts/kanto-k05-source.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kanto-k05-source-inventory
          path: k05-receipts/
          if-no-files-found: error
