      - scripts/battle_polish/TitleKanto.rb
      - scripts/battle_polish/RegionStart.rb
      - .github/workflows/blue-story-windows.yml
  pull_request:
    paths:
      - scripts/windows/**
      - scripts/install_game.py
      - scripts/regions/sinnoh_shared.py
      - scripts/regions/prepare_sinnoh_shared.py
      - scripts/regions/stage_sinnoh_shared_qa.py
      - scripts/regions/SinnohSharedEvents.rb
      - tests/test_sinnoh_shared_install.py
      - scripts/regions/install_sinnoh_experimental_windows.py
      - scripts/regions/sinnoh_source_download.py
      - scripts/regions/sinnoh_f12d3_secretpotion_audit.py
      - scripts/regions/sinnoh_f12d3_expanded_evidence.py
      - scripts/regions/sinnoh_f12d3_route210_recovery.py
      - scripts/regions/sinnoh_f12d3_authored_offset.py
      - scripts/regions/sinnoh_f12d3_alternate_route212.py
      - scripts/regions/sinnoh_f12d3_celestic_cut.py
      - scripts/regions/sinnoh_f12d3_dry_recovery.py
      - scripts/regions/sinnoh_f12d3_dry_network.py
      - scripts/regions/sinnoh_f12d3_gated_alignment.py
      - scripts/regions/sinnoh_f12d3_psyduck_barrier.py
      - scripts/regions/sinnoh_f12d3_secretpotion_catalogue.py
      - scripts/regions/SinnohF12D3Transaction.rb
      - tests/test_sinnoh_j12e_experimental_installer.py
      - scripts/regions/sinnoh_private_visual.py
      - scripts/regions/sinnoh_qa_teleport.py
      - scripts/regions/SinnohQATeleport.rb
      - scripts/regions/sinnoh_forest_edge.py
      - scripts/regions/sinnoh_city_expansion.py
      - scripts/regions/sinnoh_route_expansion.py
      - data/regions/sinnoh-f05-route-sources.json
      - data/regions/sinnoh-f04-city-sources.json
      - scripts/regions/audit_sinnoh_expansion_f03.py
      - tests/test_sinnoh_expansion_f03.py
      - scripts/regions/SinnohForestEdge.rb
      - data/regions/sinnoh-expansion-destinations.json
      - scripts/regions/generate_sinnoh_four_exteriors_j11b.py
      - tests/test_blue_story_sinnoh_menu.py
      - tests/test_blue_story_sinnoh_compile_guard.py
      - .github/workflows/blue-story-windows.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: blue-story-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  standalone-installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar o empacotador privado de Johto sem arquivos protegidos
        run: python -m unittest discover -s tests -p test_embed_johto_private.py -v
      - name: Verificar download, atalhos e atualizacoes do Johto Map Studio
        run: python -m unittest discover -s tests -p test_blue_story_johto_editor_installer.py -v
      - name: Testar publicação segura do Johto e integração automática com GitHub
        run: python -m unittest discover -s tests -p test_johto_map_editor.py -v
      - name: Testar GitHub CLI automática e JavaScript do editor
        run: python -m unittest discover -s tests -p test_blue_story_github_cli.py -v
      - name: Testar escolha do piloto Sinnoh no Blue-Story e isolamento de saves
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_menu.py -v
      - name: Testar Sinnoh no instalador compartilhado sem tocar nos saves
        run: python -m unittest discover -s tests -p test_sinnoh_shared_install.py -v
      - name: Validar inventario F03 e bloqueios de MapIDs
        run: python -m unittest discover -s tests -p test_sinnoh_expansion_f03.py -v
      - name: Revalidar preparador J12-E em fixtures Windows
        run: python -m unittest discover -s tests -p test_sinnoh_j12e_experimental_installer.py -v
      - name: Validar reinicio automatico e integridade da copia QA Sinnoh
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_supervisor.py -v
      - name: Preservar mapas autorais durante compilacao nativa de eventos
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_compile_guard.py -v
      - name: Compilar e executar self-test do Blue-Story
        run: python scripts/windows/build.py
      - name: Verificar o executável Windows
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Blue-Story.exe)) {throw "Blue-Story.exe nao foi compilado"}
          Get-FileHash dist/Blue-Story.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Blue-Story-Windows
          path: dist/Blue-Story.exe
          compression-level: 0
      - name: Atualizar link estável de download do instalador geral
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view blue-story-windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create blue-story-windows --target "$env:GITHUB_SHA" --title "Blue-Story - instalador geral Windows" --notes "Instalador geral autoatualizável do Decades, Kanto, Hoenn e Johto (prévia privada). Os assets Johto não estão distribuídos publicamente." --latest=false
            if ($LASTEXITCODE -ne 0) {throw "Nao foi possivel criar a release Blue-Story"}
          }
          gh release upload blue-story-windows dist/Blue-Story.exe --clobber
          if ($LASTEXITCODE -ne 0) {throw "Falha ao atualizar o Blue-Story.exe"}

  sinnoh-shared-world-candidate:
    # No release/upload: this job uses the actual managed base and local source
    # archives only to generate the private shared-world candidate.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'sinnoh-shared-blue-story'
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      PYTHONUTF8: '1'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar jogo principal em runner descartavel
        run: python scripts/install_game.py --apply
      - name: Gerar 144 mapas contra o jogo principal (sem ativar)
        run: python -u scripts/regions/prepare_sinnoh_shared.py
      - name: Confirmar candidato e ausência de ativação
        shell: pwsh
        run: |
          $p = Get-Content .blue-work/sinnoh-shared-candidate/candidate.json -Raw | ConvertFrom-Json
          if ($p.map_ids.Count -ne 144 -or $p.runtime_install_enabled -or $p.native_verified) { throw 'Invalid shared candidate' }
          if (Test-Path game/Data/blue-sinnoh-shared.txt) { throw 'Unreviewed candidate activated' }
          if (Test-Path .blue-work/sinnoh-shared/manifest.json) { throw 'Unreviewed candidate promoted' }
          Write-Host 'SINNOH_SHARED_144_MAP_CANDIDATE_PREPARED_NOT_NATIVE_APPROVED'
      - name: Preparar driver gráfico Windows descartável
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $mesa = Join-Path $env:RUNNER_TEMP 'blue-shared-mesa'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388') { throw 'Mesa checksum failed' }
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          Get-ChildItem -LiteralPath $mesa -Recurse -File -Filter '*.dll' |
            Where-Object { $_.DirectoryName -match '[\\/]x64$' } |
            Copy-Item -Destination game -Force
          if (-not (Test-Path 'game/opengl32.dll')) { throw 'CI Mesa x64 OpenGL runtime missing' }
      - name: Instalar e compilar Sinnoh em cópia QA compartilhada
        run: python -u scripts/regions/stage_sinnoh_shared_qa.py --compile
      - name: Verificar o recibo de compilação e o isolamento
        shell: pwsh
        run: |
          $stage = Get-Content .blue-work/sinnoh-shared-qa/stage.json -Raw | ConvertFrom-Json
          if ($stage.maps -ne 144 -or -not $stage.plugin_cache_sha256 -or $stage.windows_travel -or $stage.joiplay_travel) { throw 'Invalid shared QA receipt' }
          if (Test-Path game/Data/blue-sinnoh-shared.txt) { throw 'Shared QA activated the main game' }
          Write-Host 'SINNOH_SHARED_WINDOWS_144_MAPS_COMPILED_QA'

  sinnoh-original-source-live:
    # Explicit acceptance checks for the download and continuity PRs only.
    # Never run external downloads on untrusted forks or publish their bytes.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'sinnoh-auto-download-original-sources' || github.head_ref == 'sinnoh-connected-maps-and-audio' || github.head_ref == 'sinnoh-lakefront-profile-story' || github.head_ref == 'sinnoh-profile-native-error-recovery' || github.head_ref == 'sinnoh-fresh-regional-state-bootstrap' || github.head_ref == 'sinnoh-lake-safe-movement' || github.head_ref == 'sinnoh-save-encounters-lab-progression' || github.head_ref == 'sinnoh-pilot-encounters-trainers-coverage' || github.head_ref == 'sinnoh-full-expansion-f01-teleport' || github.head_ref == 'sinnoh-full-expansion-f02-forest-edges' || github.head_ref == 'sinnoh-full-expansion-f03-inventory' || github.head_ref == 'sinnoh-full-expansion-f04-cities' || github.head_ref == 'sinnoh-full-expansion-f05-routes' || github.head_ref == 'sinnoh-full-expansion-f06-natural-areas' || github.head_ref == 'sinnoh-full-expansion-f07-interiors' || github.head_ref == 'sinnoh-full-expansion-f08-connections' || github.head_ref == 'sinnoh-full-expansion-f08b-portals' || github.head_ref == 'sinnoh-full-expansion-f08c-exteriors' || github.head_ref == 'sinnoh-full-expansion-f09-encounters' || github.head_ref == 'sinnoh-full-expansion-f09b-original-encounters' || github.head_ref == 'sinnoh-full-expansion-f09c-relative-weights' || github.head_ref == 'sinnoh-full-expansion-f09d-relative-tables' || github.head_ref == 'sinnoh-full-expansion-f10a-trainer-npc-audit' || github.head_ref == 'sinnoh-full-expansion-f10b-trainers' || github.head_ref == 'sinnoh-full-expansion-f10b2-trainer-assets' || github.head_ref == 'sinnoh-full-expansion-f10b3-trainer-variants' || github.head_ref == 'sinnoh-full-expansion-f10b4-double-battles' || github.head_ref == 'sinnoh-full-expansion-f10b5-access-witnesses' || github.head_ref == 'sinnoh-full-expansion-f10b6-kath-authored-sprite' || github.head_ref == 'sinnoh-full-expansion-f10b7-field-gate-audit' || github.head_ref == 'sinnoh-full-expansion-f10b8-origin-access' || github.head_ref == 'sinnoh-full-expansion-f10c-npc-dialogue' || github.head_ref == 'sinnoh-full-expansion-f11a-roark-gym' || github.head_ref == 'sinnoh-full-expansion-f11b-gardenia' || github.head_ref == 'sinnoh-full-expansion-f11c-fantina' || github.head_ref == 'sinnoh-full-expansion-f11d-maylene' || github.head_ref == 'sinnoh-full-expansion-f11e-crasher-wake' || github.head_ref == 'sinnoh-full-expansion-f11f-byron' || github.head_ref == 'sinnoh-full-expansion-f11g-candice' || github.head_ref == 'sinnoh-full-expansion-f11h-volkner' || github.head_ref == 'sinnoh-full-expansion-f12a-story-source-audit' || github.head_ref == 'sinnoh-full-expansion-f12b-windworks' || github.head_ref == 'sinnoh-full-expansion-f12b2-windworks-evidence' || github.head_ref == 'sinnoh-full-expansion-f12b3-windworks-preflight' || github.head_ref == 'sinnoh-full-expansion-f12b4-windworks-access' || github.head_ref == 'sinnoh-full-expansion-f12b5-windworks-playable' || github.head_ref == 'sinnoh-full-expansion-f12b5b-authored-galactic' || github.head_ref == 'sinnoh-full-expansion-f12c-eterna-source-audit' || github.head_ref == 'sinnoh-full-expansion-f12c2-eterna-authored-preview' || github.head_ref == 'sinnoh-full-expansion-f12c3-jupiter-quest-candidate' || github.head_ref == 'sinnoh-full-expansion-f12c4-144-map-installer' || github.head_ref == 'sinnoh-full-expansion-f12d1-d2-pastoria-pursuit' || github.head_ref == 'sinnoh-full-expansion-f12d2-pastoria-runtime' || github.head_ref == 'sinnoh-full-expansion-f12d3-secretpotion-psyduck' || github.head_ref == 'sinnoh-full-expansion-f12d3-quest-candidate' || github.head_ref == 'sinnoh-full-expansion-f12d3-route210-recovery' || github.head_ref == 'sinnoh-full-expansion-f12d3-gated-route210' || github.head_ref == 'sinnoh-full-expansion-f12d3-future-topology' || github.head_ref == 'sinnoh-full-expansion-f12d3-celestic-cut' || github.head_ref == 'sinnoh-full-expansion-f12d3-dry-network' || github.head_ref == 'sinnoh-full-expansion-f12d3-directional-network' || github.head_ref == 'sinnoh-full-expansion-f12d3-original-offsets' || github.head_ref == 'sinnoh-full-expansion-f12d3-canonical-frontier' || github.head_ref == 'sinnoh-full-expansion-f12d3-special-terrain' || github.head_ref == 'sinnoh-full-expansion-f12d3-rock-frontier' || github.head_ref == 'sinnoh-full-expansion-f12d3-rock-cost' || github.head_ref == 'sinnoh-f12d-integrated-gameplay')
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar os dois ZIPs das fontes originais e validar cache (sem publicar)
        shell: pwsh
        run: |
          @'
          import sys
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts" / "regions"))
          import sinnoh_source_download as src
          with tempfile.TemporaryDirectory(prefix="sinnoh-source-live-") as folder:
              project = Path(folder)
              paths = src.ensure_sources(project)
              assert set(paths) == set(src.PACKS)
              for kind, path in paths.items():
                  assert path.parent == project / ".blue-work" / "sinnoh-private-input"
                  assert path.stat().st_size == src.SIZES[kind]
                  with src.verified_archive(path, kind):
                      pass
                  print("SOURCE_VERIFIED", kind, flush=True)
              def reject_network(*args):
                  raise AssertionError("unexpected repeated download")
              assert src.ensure_sources(project, fetch=reject_network) == paths
              print("SINNOH_LIVE_DOWNLOADS_2_OF_2_AND_CACHE_OK", flush=True)
              if os.environ.get("GITHUB_HEAD_REF") in ("sinnoh-connected-maps-and-audio","sinnoh-lakefront-profile-story","sinnoh-profile-native-error-recovery","sinnoh-fresh-regional-state-bootstrap","sinnoh-lake-safe-movement","sinnoh-save-encounters-lab-progression","sinnoh-pilot-encounters-trainers-coverage","sinnoh-full-expansion-f01-teleport","sinnoh-full-expansion-f02-forest-edges","sinnoh-full-expansion-f03-inventory","sinnoh-full-expansion-f04-cities","sinnoh-full-expansion-f05-routes","sinnoh-full-expansion-f06-natural-areas","sinnoh-full-expansion-f07-interiors","sinnoh-full-expansion-f08-connections","sinnoh-full-expansion-f08b-portals","sinnoh-full-expansion-f08c-exteriors","sinnoh-full-expansion-f09-encounters","sinnoh-full-expansion-f09b-original-encounters","sinnoh-full-expansion-f09c-relative-weights","sinnoh-full-expansion-f09d-relative-tables","sinnoh-full-expansion-f10a-trainer-npc-audit","sinnoh-full-expansion-f10b-trainers","sinnoh-full-expansion-f10b2-trainer-assets","sinnoh-full-expansion-f10b3-trainer-variants","sinnoh-full-expansion-f10b4-double-battles","sinnoh-full-expansion-f10b5-access-witnesses","sinnoh-full-expansion-f10b6-kath-authored-sprite","sinnoh-full-expansion-f10b7-field-gate-audit","sinnoh-full-expansion-f10b8-origin-access","sinnoh-full-expansion-f10c-npc-dialogue","sinnoh-full-expansion-f11a-roark-gym","sinnoh-full-expansion-f11b-gardenia","sinnoh-full-expansion-f11c-fantina","sinnoh-full-expansion-f11d-maylene","sinnoh-full-expansion-f11e-crasher-wake","sinnoh-full-expansion-f11f-byron","sinnoh-full-expansion-f11g-candice","sinnoh-full-expansion-f11h-volkner","sinnoh-full-expansion-f12a-story-source-audit","sinnoh-full-expansion-f12b-windworks","sinnoh-full-expansion-f12b2-windworks-evidence","sinnoh-full-expansion-f12b3-windworks-preflight","sinnoh-full-expansion-f12b4-windworks-access","sinnoh-full-expansion-f12b5-windworks-playable","sinnoh-full-expansion-f12b5b-authored-galactic","sinnoh-full-expansion-f12c-eterna-source-audit","sinnoh-full-expansion-f12c2-eterna-authored-preview","sinnoh-full-expansion-f12c3-jupiter-quest-candidate","sinnoh-full-expansion-f12c4-144-map-installer","sinnoh-full-expansion-f12d1-d2-pastoria-pursuit","sinnoh-full-expansion-f12d2-pastoria-runtime","sinnoh-full-expansion-f12d3-secretpotion-psyduck","sinnoh-full-expansion-f12d3-quest-candidate","sinnoh-full-expansion-f12d3-route210-recovery","sinnoh-full-expansion-f12d3-gated-route210","sinnoh-full-expansion-f12d3-future-topology","sinnoh-full-expansion-f12d3-celestic-cut","sinnoh-full-expansion-f12d3-dry-network","sinnoh-full-expansion-f12d3-directional-network","sinnoh-full-expansion-f12d3-original-offsets","sinnoh-full-expansion-f12d3-canonical-frontier","sinnoh-full-expansion-f12d3-special-terrain","sinnoh-full-expansion-f12d3-rock-frontier","sinnoh-full-expansion-f12d3-rock-cost","sinnoh-f12d-integrated-gameplay"):
                  env={**os.environ,"BLUE_SINNOH_PRIVATE_SOURCE":str(paths["maps"]),"BLUE_SINNOH_PRIVATE_OVERWORLDS":str(paths["overworlds"])}
                  cmd=[sys.executable,"-m","unittest","discover","-s","tests","-p","test_sinnoh_j12e_experimental_installer.py","-k","test_live_private_continuity_and_audio","-v"]
                  if os.environ.get("GITHUB_HEAD_REF") in ("sinnoh-full-expansion-f12d3-secretpotion-psyduck","sinnoh-full-expansion-f12d3-quest-candidate","sinnoh-full-expansion-f12d3-route210-recovery","sinnoh-full-expansion-f12d3-gated-route210","sinnoh-full-expansion-f12d3-future-topology","sinnoh-full-expansion-f12d3-celestic-cut","sinnoh-full-expansion-f12d3-dry-network","sinnoh-full-expansion-f12d3-directional-network","sinnoh-full-expansion-f12d3-original-offsets","sinnoh-full-expansion-f12d3-canonical-frontier","sinnoh-full-expansion-f12d3-special-terrain","sinnoh-full-expansion-f12d3-rock-frontier","sinnoh-full-expansion-f12d3-rock-cost","sinnoh-f12d-integrated-gameplay"):
                      result=subprocess.run(cmd,env={**env,"PYTHONIOENCODING":"utf-8"},stdout=subprocess.PIPE,stderr=subprocess.STDOUT,encoding="utf-8",errors="replace",check=False)
                      print(result.stdout,flush=True)
                      result.check_returncode()
                      markers=set(line.strip() for line in result.stdout.splitlines())
