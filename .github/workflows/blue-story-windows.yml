      - tests/test_blue_story_sinnoh_compile_guard.py
      - scripts/regions/auto_integrate_johto.py
      - scripts/regions/johto_main_preview.py
      - scripts/install_game.py
      - web/johto-map-editor.html
      - EDITAR_MAPAS_JOHTO.bat
      - CONECTAR_GITHUB_EDITOR_JOHTO.bat
      - docs/JOHTO_MAP_STUDIO.md
      - tests/test_blue_story_johto_editor_installer.py
      - scripts/regions/johto_map_editor.py
      - tests/test_johto_map_editor.py
