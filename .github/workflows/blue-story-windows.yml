name: Blue-Story - instalador Windows independente
on:
  push:
    branches: [main]
    paths:
      - scripts/windows/**
      - scripts/regions/install_sinnoh_experimental_windows.py
      - scripts/regions/sinnoh_source_download.py
      - scripts/regions/sinnoh_private_visual.py
      - scripts/regions/sinnoh_qa_teleport.py
      - scripts/regions/SinnohQATeleport.rb
      - scripts/regions/sinnoh_forest_edge.py
      - scripts/regions/sinnoh_city_expansion.py
      - scripts/regions/sinnoh_route_expansion.py
      - data/regions/sinnoh-f05-route-sources.json
      - data/regions/sinnoh-f04-city-sources.json
      - scripts/regions/audit_sinnoh_expansion_f03.py
      - tests/test_sinnoh_expansion_f03.py
      - scripts/regions/SinnohForestEdge.rb
      - data/regions/sinnoh-expansion-destinations.json
      - tests/test_blue_story_sinnoh_compile_guard.py
      - scripts/regions/auto_integrate_johto.py
      - scripts/regions/johto_main_preview.py
      - scripts/install_game.py
      - web/johto-map-editor.html
      - EDITAR_MAPAS_JOHTO.bat
      - CONECTAR_GITHUB_EDITOR_JOHTO.bat
      - docs/JOHTO_MAP_STUDIO.md
      - tests/test_blue_story_johto_editor_installer.py
      - scripts/regions/johto_map_editor.py
      - tests/test_johto_map_editor.py
      - tests/test_blue_story_github_cli.py
      - scripts/battle_polish/TitleKanto.rb
      - scripts/battle_polish/RegionStart.rb
      - .github/workflows/blue-story-windows.yml
  pull_request:
    paths:
      - scripts/windows/**
      - scripts/regions/install_sinnoh_experimental_windows.py
      - scripts/regions/sinnoh_source_download.py
      - scripts/regions/sinnoh_private_visual.py
      - scripts/regions/sinnoh_qa_teleport.py
      - scripts/regions/SinnohQATeleport.rb
      - scripts/regions/sinnoh_forest_edge.py
      - scripts/regions/sinnoh_city_expansion.py
      - scripts/regions/sinnoh_route_expansion.py
      - data/regions/sinnoh-f05-route-sources.json
      - data/regions/sinnoh-f04-city-sources.json
      - scripts/regions/audit_sinnoh_expansion_f03.py
      - tests/test_sinnoh_expansion_f03.py
      - scripts/regions/SinnohForestEdge.rb
      - data/regions/sinnoh-expansion-destinations.json
      - scripts/regions/generate_sinnoh_four_exteriors_j11b.py
      - tests/test_blue_story_sinnoh_menu.py
      - tests/test_blue_story_sinnoh_compile_guard.py
      - .github/workflows/blue-story-windows.yml
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: blue-story-windows
  cancel-in-progress: false

jobs:
  standalone-installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar o empacotador privado de Johto sem arquivos protegidos
        run: python -m unittest discover -s tests -p test_embed_johto_private.py -v
      - name: Verificar download, atalhos e atualizacoes do Johto Map Studio
        run: python -m unittest discover -s tests -p test_blue_story_johto_editor_installer.py -v
      - name: Testar publicação segura do Johto e integração automática com GitHub
        run: python -m unittest discover -s tests -p test_johto_map_editor.py -v
      - name: Testar GitHub CLI automática e JavaScript do editor
        run: python -m unittest discover -s tests -p test_blue_story_github_cli.py -v
      - name: Testar escolha do piloto Sinnoh no Blue-Story e isolamento de saves
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_menu.py -v
      - name: Validar inventario F03 e bloqueios de MapIDs
        run: python -m unittest discover -s tests -p test_sinnoh_expansion_f03.py -v
      - name: Revalidar preparador J12-E em fixtures Windows
        run: python -m unittest discover -s tests -p test_sinnoh_j12e_experimental_installer.py -v
      - name: Validar reinicio automatico e integridade da copia QA Sinnoh
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_supervisor.py -v
      - name: Preservar mapas autorais durante compilacao nativa de eventos
        run: python -m unittest discover -s tests -p test_blue_story_sinnoh_compile_guard.py -v
      - name: Compilar e executar self-test do Blue-Story
        run: python scripts/windows/build.py
      - name: Verificar o executável Windows
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Blue-Story.exe)) {throw "Blue-Story.exe nao foi compilado"}
          Get-FileHash dist/Blue-Story.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: Blue-Story-Windows
          path: dist/Blue-Story.exe
          compression-level: 0
      - name: Atualizar link estável de download do instalador geral
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view blue-story-windows *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create blue-story-windows --target "$env:GITHUB_SHA" --title "Blue-Story - instalador geral Windows" --notes "Instalador geral autoatualizável do Decades, Kanto, Hoenn e Johto (prévia privada). Os assets Johto não estão distribuídos publicamente." --latest=false
            if ($LASTEXITCODE -ne 0) {throw "Nao foi possivel criar a release Blue-Story"}
          }
          gh release upload blue-story-windows dist/Blue-Story.exe --clobber
          if ($LASTEXITCODE -ne 0) {throw "Falha ao atualizar o Blue-Story.exe"}

  sinnoh-original-source-live:
    # Explicit acceptance checks for the download and continuity PRs only.
    # Never run external downloads on untrusted forks or publish their bytes.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'sinnoh-auto-download-original-sources' || github.head_ref == 'sinnoh-connected-maps-and-audio' || github.head_ref == 'sinnoh-lakefront-profile-story' || github.head_ref == 'sinnoh-profile-native-error-recovery' || github.head_ref == 'sinnoh-fresh-regional-state-bootstrap' || github.head_ref == 'sinnoh-lake-safe-movement' || github.head_ref == 'sinnoh-save-encounters-lab-progression' || github.head_ref == 'sinnoh-pilot-encounters-trainers-coverage' || github.head_ref == 'sinnoh-full-expansion-f01-teleport' || github.head_ref == 'sinnoh-full-expansion-f02-forest-edges' || github.head_ref == 'sinnoh-full-expansion-f03-inventory' || github.head_ref == 'sinnoh-full-expansion-f04-cities' || github.head_ref == 'sinnoh-full-expansion-f05-routes' || github.head_ref == 'sinnoh-full-expansion-f06-natural-areas' || github.head_ref == 'sinnoh-full-expansion-f07-interiors' || github.head_ref == 'sinnoh-full-expansion-f08-connections' || github.head_ref == 'sinnoh-full-expansion-f08b-portals' || github.head_ref == 'sinnoh-full-expansion-f08c-exteriors' || github.head_ref == 'sinnoh-full-expansion-f09-encounters' || github.head_ref == 'sinnoh-full-expansion-f09b-original-encounters' || github.head_ref == 'sinnoh-full-expansion-f09c-relative-weights')
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar os dois ZIPs das fontes originais e validar cache (sem publicar)
        shell: pwsh
        run: |
          @'
          import sys
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "scripts" / "regions"))
          import sinnoh_source_download as src
          with tempfile.TemporaryDirectory(prefix="sinnoh-source-live-") as folder:
              project = Path(folder)
              paths = src.ensure_sources(project)
              assert set(paths) == set(src.PACKS)
              for kind, path in paths.items():
                  assert path.parent == project / ".blue-work" / "sinnoh-private-input"
                  assert path.stat().st_size == src.SIZES[kind]
                  with src.verified_archive(path, kind):
                      pass
                  print("SOURCE_VERIFIED", kind, flush=True)
              def reject_network(*args):
                  raise AssertionError("unexpected repeated download")
              assert src.ensure_sources(project, fetch=reject_network) == paths
              print("SINNOH_LIVE_DOWNLOADS_2_OF_2_AND_CACHE_OK", flush=True)
              if os.environ.get("GITHUB_HEAD_REF") in ("sinnoh-connected-maps-and-audio","sinnoh-lakefront-profile-story","sinnoh-profile-native-error-recovery","sinnoh-fresh-regional-state-bootstrap","sinnoh-lake-safe-movement","sinnoh-save-encounters-lab-progression","sinnoh-pilot-encounters-trainers-coverage","sinnoh-full-expansion-f01-teleport","sinnoh-full-expansion-f02-forest-edges","sinnoh-full-expansion-f03-inventory","sinnoh-full-expansion-f04-cities","sinnoh-full-expansion-f05-routes","sinnoh-full-expansion-f06-natural-areas","sinnoh-full-expansion-f07-interiors","sinnoh-full-expansion-f08-connections","sinnoh-full-expansion-f08b-portals","sinnoh-full-expansion-f08c-exteriors","sinnoh-full-expansion-f09-encounters","sinnoh-full-expansion-f09b-original-encounters","sinnoh-full-expansion-f09c-relative-weights"):
                  subprocess.run([sys.executable,"-m","unittest","discover","-s","tests","-p","test_sinnoh_j12e_experimental_installer.py","-k","test_live_private_continuity_and_audio","-v"],env={**os.environ,"BLUE_SINNOH_PRIVATE_SOURCE":str(paths["maps"])},check=True)
              if os.environ.get("GITHUB_HEAD_REF") == "sinnoh-full-expansion-f03-inventory":
                  import audit_sinnoh_expansion_f03 as f03
                  report=f03.inventory(paths)
                  assert len(report["destinations"])==133
                  assert len(report["f04_city_queue"])==14
                  assert sum(r["prepared_in_pilot"] for r in report["destinations"])==10
                  assert not report["installed_new_maps"] and not report["rights_approved"]
                  assert all(r["destination_map_id"] is None for r in report["destinations"])
                  print("SINNOH_F03_COUNTS",src.json.dumps(report["counts"]),flush=True)
                  print("SINNOH_F03_CATEGORIES",src.json.dumps(report["categories"],ensure_ascii=True),flush=True)
                  for row in report["f04_city_queue"]:
                      print("SINNOH_F03_CITY",src.json.dumps(row,ensure_ascii=True),flush=True)
                  for row in report["maps"]:
                      print("SINNOH_F03_MAP",src.json.dumps(row,ensure_ascii=True),flush=True)
                  for row in report["tilesets"]:
                      print("SINNOH_F03_TILESET",src.json.dumps(row,ensure_ascii=True),flush=True)
                  (Path(os.environ["RUNNER_TEMP"])/"sinnoh-f03-inventory.json").write_text(src.json.dumps(report,ensure_ascii=True,indent=2),"utf-8")
                  print("SINNOH_F03_FULL_PINNED_INVENTORY_OK",flush=True)
          assert not project.exists()
          '@ | python -
          if ($LASTEXITCODE -ne 0) {throw "Falha no download real de Sinnoh; nao autorizar merge"}
      - name: Publicar somente metadados do inventario F03
        if: github.head_ref == 'sinnoh-full-expansion-f03-inventory'
        uses: actions/upload-artifact@v4
        with:
          name: sinnoh-f03-inventory-metadata
          path: ${{ runner.temp }}/sinnoh-f03-inventory.json
          if-no-files-found: error
          retention-days: 14
