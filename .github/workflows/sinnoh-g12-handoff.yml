name: Sinnoh G12 - fechamento GitHub e handoff nativo pendente
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sinnoh-g12-handoff.yml'
      - 'scripts/regions/audit_sinnoh_g12_handoff.py'
      - 'tests/test_sinnoh_g12_handoff.py'
      - 'data/regions/sinnoh-g12-native-handoff.json'
      - 'data/regions/sinnoh-progress.json'
      - 'data/regions/sinnoh-twinleaf-events.json'
      - 'data/regions/sinnoh-b0*.json'
      - 'data/regions/sinnoh-b1*.json'
      - 'docs/SINNOH_G0*.md'
      - 'docs/SINNOH_G1*.md'
      - 'scripts/regions/audit_sinnoh_android_ch20.py'
      - 'scripts/regions/audit_sinnoh_g11_ci_chain.py'
  pull_request:
    paths:
      - '.github/workflows/sinnoh-g12-handoff.yml'
      - 'scripts/regions/audit_sinnoh_g12_handoff.py'
      - 'tests/test_sinnoh_g12_handoff.py'
      - 'data/regions/sinnoh-g12-native-handoff.json'
      - 'data/regions/sinnoh-progress.json'
      - 'data/regions/sinnoh-twinleaf-events.json'
      - 'data/regions/sinnoh-b0*.json'
      - 'data/regions/sinnoh-b1*.json'
      - 'docs/SINNOH_G0*.md'
      - 'docs/SINNOH_G1*.md'
      - 'scripts/regions/audit_sinnoh_android_ch20.py'
      - 'scripts/regions/audit_sinnoh_g11_ci_chain.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    name: G12 / 20 testes negativos e 44 casos em JSON seguro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar a matriz CH20 e o fechamento G01-G11
        run: python -m unittest discover -s tests -p 'test_sinnoh_g12_handoff.py' -v
      - name: Publicar somente metadados sanitizados do handoff G12
        run: |
          mkdir -p .blue-work/sinnoh-g12
          python scripts/regions/audit_sinnoh_g12_handoff.py > .blue-work/sinnoh-g12/public-handoff.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".blue-work/sinnoh-g12/public-handoff.json").read_text(encoding="utf-8"))
          assert r["stage"]=="G12" and r["github_stages_audited"]==11
          assert r["github_stages_with_versioned_handoff"]==12
          assert r["native_cases_total"]==44
          assert r["windows_cases"]==43 and r["android_cases"]==1
          assert r["completed_native_cases"]==0 and r["evidence_accepted_cases"]==0
          assert [g["id"] for g in r["local_gates"]]==["L01","L02","L03","L04","L05"]
          assert all(g["status"]=="pending" for g in r["local_gates"])
          assert all(c["status"]=="pending" and c["evidence"] is None for c in r["native_case_matrix"])
          assert not r["game_exe_tested"] and not r["joiplay_tested"]
          assert not r["may_launch_native_on_host"] and not r["can_install_live_game"]
          assert r["phase_b_approved"]==r["phase_c_approved"]==r["phase_d_approved"]==0
          text=Path(".blue-work/sinnoh-g12/public-handoff.json").read_text(encoding="utf8")
          for forbidden in ("C:\\Users", "Save01.rxdata", "private-baseline.json", "hmac_key", "source_zip_sha256"):
              assert forbidden not in text
          print("SINNOH_G12_44_NATIVE_CASES_PENDING_PUBLIC_HANDOFF_ONLY")
          PY
      - name: Conservar somente handoff publico; nunca saves ou arquivos nativos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sinnoh-g12-public-handoff-44-pending
          path: .blue-work/sinnoh-g12/public-handoff.json
          if-no-files-found: warn

  provenance:
    name: G12 / regressao CH20 G11 B10 B11 sem execucao nativa
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Revalidar auditor CH20 e 44 IDs com testes negativos
        run: |
          python -m unittest discover -s tests -p 'test_sinnoh_android_ch20.py' -v
          python -m unittest discover -s tests -p 'test_sinnoh_playtest_audit.py' -v
      - name: Reexecutar os 18 cenarios sinteticos G11
        run: python -m unittest discover -s tests -p 'test_sinnoh_g11_ci_chain.py' -v
      - name: Revalidar o isolamento B10 e auditoria B11
        run: |
          python -m unittest discover -s tests -p 'test_sinnoh_b10_save_isolation.py' -v
          python -m unittest discover -s tests -p 'test_sinnoh_b11_host_saves.py' -v
