name: Kanto K00 - Android published delta recovery
on:
  pull_request:
    paths:
      - 'tests/qa_k00_android_release.py'
      - '.github/workflows/kanto-k00-android-release-qa.yml'
      - 'scripts/android/update_client.py'
  push:
    branches: [main]
    paths:
      - 'tests/qa_k00_android_release.py'
      - '.github/workflows/kanto-k00-android-release-qa.yml'
      - 'scripts/android/update_client.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing updater regression tests
        run: python -m unittest discover -s tests -p test_android_updates.py -v
      - name: Verify actual released Android 74 ZIP and 75 delta, interrupt and resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/qa_k00_android_release.py
      - name: Preserve receipt only (no game files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-k00-android-release-proof
          path: .blue-work/k00-android-release-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
