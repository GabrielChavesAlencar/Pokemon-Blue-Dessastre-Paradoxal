name: Android updater - integrity and CRLF regression
on:
  pull_request:
    paths:
      - 'scripts/android/update_client.py'
      - 'scripts/android/publish_updates.py'
      - 'scripts/android/verify_kanto_cerulean.py'
      - 'tests/test_android_updates.py'
      - 'tests/fixtures/android_updater_launcher_20261117.py'
      - '.github/workflows/android-multiregion.yml'
      - '.github/workflows/android-updater-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/android/update_client.py'
      - 'scripts/android/publish_updates.py'
      - 'scripts/android/verify_kanto_cerulean.py'
      - 'tests/test_android_updates.py'
      - '.github/workflows/android-multiregion.yml'
      - '.github/workflows/android-updater-regression.yml'
permissions:
  contents: read
jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    name: Verify Android updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and signed-delta tests (including exact launcher SHA)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/android/update_client.py scripts/android/publish_updates.py scripts/android/verify_kanto_cerulean.py
          python -m unittest discover -s tests -p test_android_updates.py -v
