name: Sinnoh J05 - scoped starter transaction, Barry variants and QA save gates
on:
  pull_request:
    paths:
      - '.github/workflows/sinnoh-j05-atomic-story.yml'
      - 'scripts/regions/SinnohPilot.rb'
      - 'scripts/regions/compile_sinnoh_playable_j04.py'
      - 'tests/test_sinnoh_j04_owned_events.py'
      - 'tests/sinnoh_j05_atomic_runtime.rb'
      - 'data/regions/sinnoh-playable-progress.json'
      - 'site/public/data/sinnoh-playable-progress.json'
      - 'site/public/sinnoh-jogavel.html'
      - 'site/tests/sinnoh-playable-progress.test.mjs'
      - 'docs/SINNOH_J05_HANDLERS_SAVE_ATOMICO.md'
      - 'SINNOH_J05_TESTAR_HANDLERS.bat'
      - 'scripts/regions/prepare_sinnoh_playable_j06.py'
      - 'scripts/regions/prepare_sinnoh_pilot_bundle.py'
      - 'scripts/regions/install_sinnoh_qa_copy.py'
      - 'tests/test_sinnoh_j06_qa_windows.py'
      - '.github/workflows/sinnoh-j06-windows-qa.yml'
      - 'SINNOH_J06_QA_WINDOWS.bat'
      - 'scripts/regions/prepare_sinnoh_playable_j07.py'
      - 'tests/test_sinnoh_j07_windows_harness.py'
      - '.github/workflows/sinnoh-j07-windows-native-qa.yml'
      - 'SINNOH_J07_QA_WINDOWS.bat'
      - 'docs/SINNOH_J07_QA_WINDOWS_NATIVA.md'
      - 'scripts/regions/prepare_sinnoh_playable_j08.py'
      - 'tests/test_sinnoh_j08_android_private_delta.py'
      - '.github/workflows/sinnoh-j08-android-private-delta.yml'
      - 'SINNOH_J08_QA_ANDROID.bat'
      - 'docs/SINNOH_J08_DELTA_ANDROID_PRIVADO.md'
      - 'scripts/regions/audit_sinnoh_playable_j09.py'
      - 'tests/test_sinnoh_j09_physical_source_intake.py'
      - 'data/regions/sinnoh-j09-private-source-recheck.json'
      - '.github/workflows/sinnoh-j09-physical-source-intake.yml'
      - 'docs/SINNOH_J09_FONTE_REAL_MAPAS_R07_R08.md'
      - 'scripts/regions/author_sinnoh_playable_j10.py'
      - 'scripts/regions/serve_sinnoh_j10_editor.py'
      - 'tests/test_sinnoh_j10_original_authoring.py'
      - 'tests/test_sinnoh_j10_original_map_authoring.py'
      - '.github/workflows/sinnoh-j10-original-map-authoring.yml'
      - 'web/sinnoh-j10-map-editor.html'
      - 'site/public/sinnoh-j10-editor.html'
      - 'SINNOH_J10_EDITOR_MAPAS.bat'
      - 'docs/SINNOH_J10_AUTORIA_CINCO_MAPAS.md'
      - 'docs/SINNOH_J10_EDITOR_MAPAS_AUTORAIS.md'
      - 'site/public/assets/sinnoh-playable-progress.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sinnoh-j05-atomic-story.yml'
      - 'scripts/regions/SinnohPilot.rb'
      - 'scripts/regions/compile_sinnoh_playable_j04.py'
      - 'tests/test_sinnoh_j04_owned_events.py'
      - 'tests/sinnoh_j05_atomic_runtime.rb'
      - 'data/regions/sinnoh-playable-progress.json'
      - 'site/public/data/sinnoh-playable-progress.json'
      - 'site/public/sinnoh-jogavel.html'
      - 'site/tests/sinnoh-playable-progress.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  j05-authored-ruby-runtime:
    name: J05 / owned story, reentrant/failed grants, Barry, save/reload and dex
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ruby syntax, no native execution
        run: |
          ruby -c scripts/regions/SinnohPilot.rb
          ruby -c tests/sinnoh_j05_atomic_runtime.rb
      - name: J05 transaction and region-isolation negative tests
        run: ruby tests/sinnoh_j05_atomic_runtime.rb scripts/regions/SinnohPilot.rb
      - name: Prior BlueSinnohPilot and CH07 state/save regressions
        run: |
          ruby tests/sinnoh_pilot_runtime.rb scripts/regions/SinnohPilot.rb
          ruby tests/sinnoh_pilot_ch07_runtime.rb scripts/regions/SinnohPilot.rb
      - name: Previous G08 all three physical starters and Barry cases
        run: |
          ruby tests/sinnoh_g08_opening_runtime.rb scripts/regions/SinnohPilot.rb scripts/regions/SinnohIntroContracts.rb scripts/regions/SinnohStarterContracts.rb
          ruby tests/sinnoh_s14_starter_runtime.rb scripts/regions/SinnohPilot.rb scripts/regions/SinnohStarterContracts.rb data/regions/sinnoh-starters-s14.json
          ruby tests/sinnoh_barry_ch08_runtime.rb scripts/battle_polish/Campaign.rb scripts/regions/SinnohPilot.rb
  j05-starter-events-and-staging:
    name: J05 / J04 correct handler name and nine-map fail-closed compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile scripts/regions/compile_sinnoh_playable_j04.py
      - name: J04 original nine-map 24-event synthetic compiler negative tests
        run: python -m unittest discover -s tests -p 'test_sinnoh_j04_owned_events.py' -v
      - name: Regress J03 transactions and J02 MapID/source validators
        run: |
          python -m unittest discover -s tests -p 'test_sinnoh_j03_private_staging.py' -v
          python -m unittest discover -s tests -p 'test_sinnoh_j02_real_map_bindings.py' -v
      - name: Force no-source J04 fail closed
        run: |
          set +e
          python scripts/regions/compile_sinnoh_playable_j04.py > /tmp/j05-no-physical.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          with open('/tmp/j05-no-physical.json',encoding='utf8') as f: j=json.load(f)
          assert j["compiled_native_events"]==0
          assert j["native_playable"] is False
          assert j["can_install"] is False
          assert j["planned_warps"]==16
          assert j["planned_starter_balls"]==3
          print("SINNOH_J05_BLOCKED_NATIVE_UNVERIFIED")
          PY
          test ! -d .blue-work/sinnoh-stage
  j05-portal-next-stage:
    name: J05 / 5 of 8 code, zero native, next J06 and portal build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent bars and next-phase button
        working-directory: site
        run: node --test tests/sinnoh-playable-progress.test.mjs
      - name: Build entire site
        working-directory: site
        run: npm run build
      - name: Check static safe next action
        run: |
          test -s site/dist/sinnoh-jogavel.html
          test -s site/dist/data/sinnoh-playable-progress.json
          grep -q 'id="nextAction"' site/dist/sinnoh-jogavel.html
          grep -q '/sinnoh-jogavel.html' site/dist/index.html

  j06-guarded-qa-copy-linux:
    name: J06 / Linux 42 synthetic tests - rights, maps, isolation and rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J06 SHA rights reservations and rollback synthetic cases
        run: |
          python -m py_compile scripts/regions/prepare_sinnoh_playable_j06.py
          python -m unittest discover -s tests -p 'test_sinnoh_j06_qa_windows.py' -v
      - name: Confirm public checkout cannot install a game
        run: |
          set +e
          python scripts/regions/prepare_sinnoh_playable_j06.py >/tmp/j06-blocked 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'SINNOH_J06_BLOQUEADO' /tmp/j06-blocked
          test ! -e game/Game.exe
  j06-guarded-qa-copy-windows:
    name: J06 / Windows disposable - synthetic QA rollback, no Game.exe
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows QA synthetic and no executable release
        run: |
          python -m py_compile scripts/regions/prepare_sinnoh_playable_j06.py
          python -m unittest discover -s tests -p 'test_sinnoh_j06_qa_windows.py' -v
      - name: Assert no real user Game.exe or save files in public CI
        shell: pwsh
        run: |
          if (Test-Path "game/Game.exe") { throw "J06 private executable leaked to CI" }
          if (Test-Path ".blue-work/game-sinnoh-qa-abcdef123456") { throw "J06 QA fixture escaped temp directory" }

  j07-private-qa-linux:
    name: J07 / Linux 50 synthetic G12 cases: 43 Windows + 1 Android pending
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J07 native receipt harness syntax
        run: python -m py_compile scripts/regions/prepare_sinnoh_playable_j07.py
      - name: J07 50 synthetic test scenarios, no native Game.exe
        run: python -m unittest discover -s tests -p 'test_sinnoh_j07_windows_harness.py' -v
      - name: Public checkout must not start a native game
        run: |
          test ! -e game/Game.exe
          test ! -d .blue-work/sinnoh-j07-sessions
  j07-private-qa-windows:
    name: J07 / Windows disposable 50 synthetic session/evidence/save checks
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J07 private native QA G12 synthetic cases only
        run: |
          python -m py_compile scripts/regions/prepare_sinnoh_playable_j07.py
          python -m unittest discover -s tests -p 'test_sinnoh_j07_windows_harness.py' -v
      - name: Do not run Game.exe or copy saves
        shell: pwsh
        run: |
          if (Test-Path "game/Game.exe") { throw "Private source unexpectedly exposed" }
          if (Test-Path ".blue-work/sinnoh-j07-sessions") { throw "QA session outside temp fixture" }

  j08-private-android-linux:
    name: J08 / Linux 35 synthetic Android no-save delta/rights tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J08 syntax and local-only SHA/delta candidate fixtures
        run: |
          python -m py_compile scripts/regions/prepare_sinnoh_playable_j08.py
          python -m unittest discover -s tests -p 'test_sinnoh_j08_android_private_delta.py' -v
      - name: No real game or saves in public J08 workflow
        run: |
          test ! -e game/Game.exe
          test ! -d .blue-work/sinnoh-j08-candidates
  j08-private-android-windows:
    name: J08 / disposable Windows 35 synthetic Android profile/rollback checks
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J08 private delta fixtures only - no JoiPlay or Game.exe
        run: |
          python -m py_compile scripts/regions/prepare_sinnoh_playable_j08.py
          python -m unittest discover -s tests -p 'test_sinnoh_j08_android_private_delta.py' -v
      - name: Confirm QA data never escaped the temporary fixtures
        shell: pwsh
        run: |
          if (Test-Path "game/Game.exe") { throw "Private executable unexpectedly present" }
          if (Test-Path ".blue-work/sinnoh-j08-candidates") { throw "QA candidate leaked into checkout" }

  j09-real-source-intake-linux:
    name: J09 / Linux 35 inert source, five authored map, R07/R08 failclosed tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 35 synthetic J09 source intake cases
        run: |
          python -m py_compile scripts/regions/audit_sinnoh_playable_j09.py
          python -m unittest discover -s tests -p 'test_sinnoh_j09_physical_source_intake.py' -v
      - name: No private source or approved native execution in CI
        run: |
          test ! -e game/Game.exe
          test ! -d .blue-work/sinnoh-j09-authored
  j09-real-source-intake-windows:
    name: J09 / Windows disposable SHA/R07/R08 and save isolation fixtures
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 35 synthetic J09 map and rights regression gates
        run: |
          python -m py_compile scripts/regions/audit_sinnoh_playable_j09.py
          python -m unittest discover -s tests -p 'test_sinnoh_j09_physical_source_intake.py' -v
      - name: No real Game.exe or source ZIP released
        shell: pwsh
        run: |
          if (Test-Path "game/Game.exe") { throw "Private executable unexpectedly present" }
          if (Test-Path ".blue-work/sinnoh-j09-authored") { throw "Private maps escaped source workspace" }

  j10-private-authoring-linux:
    name: J10 / Linux 74 human-authored-map synthetic-only gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the J10 compiler and loopback editor Python syntax
        run: python -m py_compile scripts/regions/author_sinnoh_playable_j10.py scripts/regions/serve_sinnoh_j10_editor.py
      - name: J10 39 original-source fixture tests
        run: python -m unittest discover -s tests -p 'test_sinnoh_j10_original_authoring.py' -v
      - name: J10 35 atomic source and tileset test cases
        run: python -m unittest discover -s tests -p 'test_sinnoh_j10_original_map_authoring.py' -v
      - name: Do not find original maps or Game.exe in public source
        run: |
          test ! -e game/Game.exe
          test ! -d .blue-work/sinnoh-j09-authored
  j10-private-authoring-windows:
    name: J10 / Windows disposable 74 synthetic source and save checks
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: J10 private manual geometry conversion test cases
        run: |
          python -m py_compile scripts/regions/author_sinnoh_playable_j10.py scripts/regions/serve_sinnoh_j10_editor.py
          python -m unittest discover -s tests -p 'test_sinnoh_j10_original_authoring.py' -v
          python -m unittest discover -s tests -p 'test_sinnoh_j10_original_map_authoring.py' -v
      - name: All map outputs contained in temporary fixtures only
        shell: pwsh
        run: |
          if (Test-Path "game/Game.exe") { throw "Private executable leaked" }
          if (Test-Path ".blue-work/sinnoh-j09-authored") { throw "Test fixture escaped" }
