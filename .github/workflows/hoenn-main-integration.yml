name: Hoenn - integracao segura no Decades
on:
  push:
    branches: [main]
    paths:
      - 'scripts/regions/install_hoenn.py'
      - 'scripts/regions/pilot_hoenn.py'
      - 'scripts/regions/hoenn_stage10.py'
      - 'scripts/regions/auto_integrate_hoenn.py'
      - 'scripts/regions/ensure_hoenn_source.py'
      - 'scripts/regions/HoennPilot.rb'
      - 'scripts/battle_polish/RegionStart.rb'
      - 'scripts/battle_polish/RegionTravel.rb'
      - 'scripts/battle_polish/TitleKanto.rb'
      - 'scripts/install_game.py'
      - 'scripts/regions/hoenn_catalog.py'
      - 'data/regions/hoenn-map-catalog.json'
      - 'tests/test_hoenn_main_integration.py'
      - 'tests/test_hoenn_stage10.py'
      - 'tests/hoenn_main_gate_runtime.rb'
      - 'tests/hoenn_pilot_runtime.rb'
      - 'tests/hoenn_main_travel_runtime.rb'
      - '.github/workflows/hoenn-main-integration.yml'
      - 'scripts/regions/audit_hoenn_h00.py'
      - 'tests/test_hoenn_h00.py'
      - 'TESTAR_HOENN.bat'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/regions/HoennPilot.rb'
      - 'tests/hoenn_pilot_runtime.rb'
      - 'scripts/regions/install_hoenn.py'
      - 'scripts/regions/auto_integrate_hoenn.py'
      - 'scripts/regions/pilot_hoenn.py'
      - 'scripts/regions/HoennPilot.rb'
      - 'scripts/battle_polish/RegionStart.rb'
      - 'scripts/battle_polish/RegionTravel.rb'
      - 'tests/hoenn_main_gate_runtime.rb'
      - 'tests/hoenn_main_travel_runtime.rb'
      - 'scripts/regions/hoenn_stage10.py'
      - 'scripts/regions/hoenn_catalog.py'
      - 'data/regions/hoenn-map-catalog.json'
      - 'tests/test_hoenn_main_integration.py'
      - 'tests/test_hoenn_stage10.py'
      - 'scripts/regions/audit_hoenn_h00.py'
      - 'tests/test_hoenn_h00.py'
      - 'TESTAR_HOENN.bat'
      - '.github/workflows/hoenn-main-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hoenn-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntax check of native and installers
        run: |
          ruby -c scripts/regions/HoennPilot.rb
          ruby -c scripts/battle_polish/RegionStart.rb
          ruby -c scripts/battle_polish/RegionTravel.rb
          ruby -c scripts/battle_polish/TitleKanto.rb
          python -m py_compile scripts/regions/hoenn_catalog.py scripts/regions/install_hoenn.py scripts/regions/auto_integrate_hoenn.py scripts/regions/ensure_hoenn_source.py scripts/install_game.py
      - name: Hoenn integrated installer safety tests
        run: |
          python -m unittest discover -s tests -p 'test_hoenn_main_integration.py' -v
          python -m unittest discover -s tests -p 'test_hoenn_stage10.py' -v
      - name: Hoenn H00 inventory contracts
        run: python -m unittest discover -s tests -p 'test_hoenn_h00.py' -v
      - name: Hoenn opening profiles, starters and rescue
        run: ruby tests/hoenn_pilot_runtime.rb scripts/regions/HoennPilot.rb
      - name: Hoenn New Game release gate
        run: ruby tests/hoenn_main_gate_runtime.rb scripts/battle_polish/RegionStart.rb
      - name: Main Hoenn travel and Littleroot NPC
        run: ruby tests/hoenn_main_travel_runtime.rb scripts/battle_polish/RegionTravel.rb
      - name: Existing region and title regressions
        run: |
          ruby -I . tests/region_start_runtime.rb scripts/battle_polish/RegionStart.rb
          ruby -I . tests/title_kanto_runtime.rb scripts/battle_polish/TitleKanto.rb
          ruby -I . tests/region_travel_runtime.rb tests/regions_data_fixture.rb scripts/battle_polish/Regions.rb scripts/battle_polish/RegionTravel.rb
