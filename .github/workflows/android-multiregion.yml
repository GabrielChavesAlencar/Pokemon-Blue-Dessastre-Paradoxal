name: Android - Decades Kanto Hoenn integrado
on:
  workflow_dispatch:
  # Validate the actual shared JoiPlay ZIP before merging a Kanto item or
  # runtime change. PR jobs build/verify deltas but NEVER publish releases.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/battle_polish/items_blue_iv.txt'
      - 'scripts/regions/KantoPilot.rb'
      - 'scripts/regions/ensure_hoenn_source.py'
      - 'scripts/regions/hoenn_qa_phase1.py'
      - 'tests/test_hoenn_qa_phase1.py'
      - 'scripts/android/verify_kanto_cerulean.py'
      - 'scripts/android/update_client.py'
      - 'scripts/android/select_previous_multiregion_releases.py'
      - 'scripts/android/publish_updates.py'
      - 'tests/test_android_updates.py'
      - 'tests/test_multiregion_release_pagination.py'
      - 'data/regions/kanto-source.json'
      - 'data/kanto-music-rules.json'
      - 'scripts/regions/pilot.py'
      - 'scripts/regions/install_kanto.py'
      - 'scripts/battle_polish/RegionStart.rb'
      - '.github/workflows/android-multiregion.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/battle_polish/items_blue_iv.txt'
      - 'scripts/battle_polish/RegionStart.rb'
      - 'scripts/battle_polish/TitleKanto.rb'
      - 'tests/region_start_android_no_json_runtime.rb'
      - 'tests/test_android_multiregion.py'
      - 'tests/test_android_updates.py'
      - 'scripts/android/package.py'
      - 'scripts/android/package_kanto.py'
      - 'scripts/battle_lab/Mobile.rb'
      - 'tests/android_version_menu.rb'
      - 'scripts/android/build_manifest.py'
      - 'scripts/android/update_client.py'
      - 'scripts/android/publish_updates.py'
      - 'scripts/android/select_previous_multiregion_releases.py'
      - 'tests/test_multiregion_release_pagination.py'
      - 'scripts/regions/auto_integrate_kanto.py'
      - 'scripts/regions/pilot.py'
      - 'scripts/regions/KantoPilot.rb'
      - 'scripts/battle_polish/Journey.rb'
      - 'tests/kanto_journey_trainer_runtime.rb'
      - 'scripts/android/verify_kanto_cerulean.py'
      - 'tests/test_kanto_fossils.py'
      - 'scripts/regions/auto_integrate_hoenn.py'
      - 'scripts/regions/ensure_hoenn_source.py'
      - 'scripts/regions/hoenn_qa_phase1.py'
      - 'scripts/regions/install_hoenn.py'
      - 'scripts/regions/install_kanto.py'
      - 'data/regions/kanto-source.json'
      - 'data/regions/hoenn-source.json'
      - 'data/kanto-music-rules.json'
      - '.github/workflows/android-multiregion.yml'
permissions:
  contents: write
concurrency:
  group: android-multiregion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android-integrado:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_TERMINAL_PROMPT: '0'
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar atualizador Android no runner antes de empacotar
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_hoenn_qa_phase1.py -v
          if($LASTEXITCODE -ne 0){throw 'Falha no contrato da fonte fixada Hoenn.'}
          python -m py_compile scripts/android/update_client.py scripts/android/publish_updates.py
          if($LASTEXITCODE -ne 0){throw 'Erro de sintaxe no atualizador Android.'}
          python -m unittest discover -s tests -p test_android_updates.py -v
          if($LASTEXITCODE -ne 0){throw 'Falha de testes do atualizador Android; compilacao bloqueada.'}
          ruby -c scripts/battle_lab/Mobile.rb
          ruby tests/android_version_menu.rb scripts/battle_lab/Mobile.rb
          ruby tests/kanto_journey_trainer_runtime.rb scripts/battle_polish/Journey.rb
          if($LASTEXITCODE -ne 0){throw 'JoiPlay Luis and Diana trainer regression failed.'}
          if($LASTEXITCODE -ne 0){throw 'Falha nas atualizacoes Android ou na preservacao de saves.'}
      - name: Integrar Kanto e Hoenn na base principal
        shell: powershell
        run: |
          python scripts/install_game.py --apply
          if($LASTEXITCODE -ne 0){throw 'Falha ao instalar Blue.'}
          python scripts/regions/install_kanto.py --game game --verify-installed
          if($LASTEXITCODE -ne 0){throw 'Kanto nao possui instalacao completa.'}
          python scripts/regions/install_hoenn.py --game game --verify-installed
          if($LASTEXITCODE -ne 0){throw 'Hoenn nao possui todos os mapas da revisao aprovada do catalogo.'}
          if((Test-Path 'game/Kanto pilot.json') -or (Test-Path 'game/Hoenn pilot.json')){throw 'Perfil de piloto isolado em build compartilhada.'}
      - name: Solicitar compilacao do runtime Android
        shell: powershell
        run: |
          python scripts/android/package.py --game-dir game --request-compile
          if($LASTEXITCODE -ne 0){throw 'Falha ao solicitar compilacao mobile.'}
      - name: Instalar OpenGL de software para compilar Essentials
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          $hash=(Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower()
          if($hash -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa hash invalido.'}
          $dir=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $mesa "-o$dir" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Erro ao extrair Mesa.'}
          $drivers=@(Get-ChildItem -LiteralPath $dir -Recurse -File -Filter '*.dll' | Where-Object {$_.FullName -match '[\\/]x64[\\/]'})
          if(-not ($drivers | Where-Object {$_.Name -eq 'opengl32.dll'})){throw 'OpenGL x64 ausente.'}
          $drivers | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination game -Force }
      - name: Compilar PBS/Plugins no motor nativo
        shell: powershell
        run: |
          for($attempt=1;$attempt -le 3;$attempt++){
            $exe=Start-Process -FilePath "$pwd\game\Game.exe" -WorkingDirectory "$pwd\game" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$pwd\.blue-work\multiregion-stdout.txt" -RedirectStandardError "$pwd\.blue-work\multiregion-stderr.txt"
            $handle=$exe.Handle
            if(-not $exe.WaitForExit(300000)){Stop-Process -Id $exe.Id;throw 'Compilador do Game.exe expirou.'}
            if(Test-Path game/Data/blue-android-compiled.txt){break}
            if(Test-Path game/Data/blue-android-error.txt){break}
          }
          if(-not (Test-Path game/Data/blue-android-compiled.txt)){
            Get-Content .blue-work/multiregion-stdout.txt,.blue-work/multiregion-stderr.txt,game/Data/blue-android-error.txt,game/errorlog.txt -ErrorAction SilentlyContinue | Select-Object -Last 100
            throw 'Nao houve compilacao nativa; nao publicar ZIP.'}
      - name: Gerar e verificar ZIP Decades Kanto Hoenn
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/regions/install_kanto.py --game game --verify-installed
          if($LASTEXITCODE -ne 0){throw 'Kanto ausente apos compilacao.'}
          python scripts/regions/install_hoenn.py --game game --verify-installed
          if($LASTEXITCODE -ne 0){throw 'Hoenn ausente apos compilacao.'}
          python scripts/android/package.py --game-dir game --revision '${{ github.sha }}' --channel multiregion --output dist/Blue-Android-Decades-Kanto-Hoenn.zip
          if($LASTEXITCODE -ne 0){throw 'Pacote Android incompleto.'}
          python scripts/android/package.py --verify --revision '${{ github.sha }}' --channel multiregion --output dist/Blue-Android-Decades-Kanto-Hoenn.zip
          if($LASTEXITCODE -ne 0){throw 'Verificacao do ZIP falhou.'}
          # Generate separate hash-based patches for recent installations
          # AND the oldest combined release. No historical game ZIP download.
          # The latest multiregion release can be on page 2+ because this
          # repository publishes many unrelated Battle Hub releases. Scan all
          # pages before selecting verified channel-specific old manifests.
          $selected=@(python scripts/android/select_previous_multiregion_releases.py --fetch-github --require-known-baselines)
          if($LASTEXITCODE -ne 0 -or $selected.Count -eq 0){throw 'Historico de releases Android multirregionais incompleto; nenhum delta seguro sera publicado'}
          $args=@('--channel','multiregion','--full-zip','dist/Blue-Android-Decades-Kanto-Hoenn.zip')
          foreach($tag in $selected){
            $old=Join-Path 'dist/previous' $tag
            New-Item -ItemType Directory -Force -Path $old | Out-Null
            gh release download $tag --pattern 'Blue-Android-Decades-Kanto-Hoenn.update.json' --dir $old
            if($LASTEXITCODE -ne 0){throw "Manifesto Android anterior indisponivel: $tag"}
            $args+=@('--previous-manifest',(Join-Path $old 'Blue-Android-Decades-Kanto-Hoenn.update.json'))
          }
          # Required legacy manifests are selected exactly once by the Python
          # selector; selected entries are strings, not release objects.
          $knownBaselines=@{
            'android-multiregion-hotfix-2-5d0cc84'='5d0cc84fa309039699e625daec18766d52948c1e'
            'android-multiregion-hotfix-30-ba020a5'='ba020a57052e2952de308dbb4166aad760b1e72c'
            'android-multiregion-hotfix-31-e7200ef'='e7200ef8003c2d84eb1c6931b403c9faaa0d15b6'
            'android-multiregion-82-e23ff33'='e23ff33a67ed6cea6ca652f0d2150ae5d1de206d'
            'android-multiregion-208-20644ab'='20644ab2f7a0b4c56f54e761c4c3b3ecf878dc7c'
          }
          foreach($knownTag in $knownBaselines.Keys){
            if($selected -notcontains $knownTag){throw "Baseline obrigatoria ausente: $knownTag"}
            $knownPath=Join-Path (Join-Path 'dist/previous' $knownTag) 'Blue-Android-Decades-Kanto-Hoenn.update.json'
            $knownManifest=Get-Content $knownPath -Raw | ConvertFrom-Json
            if($knownManifest.channel -ne 'multiregion' -or $knownManifest.revision -ne $knownBaselines[$knownTag]){
              throw "Manifesto de baseline obrigatoria incorreto: $knownTag"
            }
          }
          # A previous opt-in performance preview is an actual installed
          # Android revision. It must be able to upgrade to this main build,
          # not be stranded after this later release supersedes the hotfix.
          $previewTag='android-map-perf-preview-02e8e5a'
          $previewDir=Join-Path 'dist/previous' $previewTag
          New-Item -ItemType Directory -Force -Path $previewDir | Out-Null
          gh release download $previewTag --pattern 'Blue-Android-Decades-Kanto-Hoenn.update.json' --dir $previewDir
          if($LASTEXITCODE -ne 0){throw 'Manifesto Android da preview nao disponivel'}
          $args+=@('--previous-manifest',(Join-Path $previewDir 'Blue-Android-Decades-Kanto-Hoenn.update.json'))
          # Fail closed: do not publish a newer release that reintroduces
          # the map-connection hitch or drops Cerulean/Route4 BGM.
          python scripts/android/verify_kanto_cerulean.py --channel multiregion --archive dist/Blue-Android-Decades-Kanto-Hoenn.zip
          if($LASTEXITCODE -ne 0){throw 'Rotas 24/25 ou Luis/Diana ausentes do ZIP Android integrado'}
          python scripts/android/publish_updates.py @args
          if($LASTEXITCODE -ne 0){throw 'Manifesto do canal multirregional falhou.'}
          # A release with no delta from the newest published install is NOT
          # an update for the player, even when the full ZIP is valid.
          $currentPrevious = Join-Path (Join-Path 'dist/previous' $selected[0]) 'Blue-Android-Decades-Kanto-Hoenn.update.json'
          $oldManifest = Get-Content $currentPrevious -Raw | ConvertFrom-Json
          $manifest = Get-Content 'dist/Blue-Android-Decades-Kanto-Hoenn.update.json' -Raw | ConvertFrom-Json
          $latestDelta = @($manifest.patches | Where-Object { $_.from_revision -eq $oldManifest.revision })
          if($latestDelta.Count -eq 0){throw "Delta incremental para a ultima versao multirregional nao foi publicado: $($selected[0])"}
          $delta = @($manifest.patches | Where-Object { $_.from_revision -eq '02e8e5addc7a7f2c4a9f71195fcae7f49631ed54' })
          if($delta.Count -eq 0){throw 'Delta da preview para a main nao gerado'}
          Write-Host 'PASS: preview-to-main incremental patch'
          foreach($knownTag in $knownBaselines.Keys){
            $knownRevision=$knownBaselines[$knownTag]
            $knownDelta=@($manifest.patches | Where-Object { $_.from_revision -eq $knownRevision })
            if($knownDelta.Count -ne 1){throw "Delta incremental obrigatorio ausente ou duplicado: $knownTag"}
            $deltaPath=Join-Path 'dist' $knownDelta[0].asset
            if(-not (Test-Path -LiteralPath $deltaPath -PathType Leaf)){throw "Arquivo de delta obrigatorio ausente: $knownTag"}
            if((Get-Item -LiteralPath $deltaPath).Length -ne $knownDelta[0].size -or (Get-FileHash -LiteralPath $deltaPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $knownDelta[0].sha256){throw "Integridade do delta obrigatorio falhou: $knownTag"}
            Write-Host "PASS: retained on-device multiregion baseline $knownTag"
          }

          if((Get-Item dist/Blue-Android-Decades-Kanto-Hoenn.zip).Length -gt 2147483648){throw 'Asset excede 2 GiB do GitHub.'}
      - name: Verificar a autorização de redistribuição de Hoenn
        id: hoenn_publication
        shell: pwsh
        run: |
          $allowed = $false
          try {
            $manifest = Get-Content -LiteralPath 'data/regions/hoenn-source.json' -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
            $approval = $manifest.source.public_redistribution_approved
            $allowed = $manifest.schema -eq 1 -and $manifest.region -ceq 'HOENN' -and $approval -is [bool] -and $approval
          } catch {
            Write-Output 'Não foi possível ler a autorização de Hoenn.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "allowed=$($allowed.ToString().ToLowerInvariant())" -Encoding utf8
          if (-not $allowed) {
            Write-Output '::notice title=ZIP multirregional de Hoenn::A publicação aguarda a autorização de redistribuição registrada no projeto.'
          }
      - name: Publicar release experimental apenas apos sucesso integral
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.hoenn_publication.outputs.allowed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # K05 and following phases must not redistribute the inherited
          # Hoenn assets merely because they compile in the shared game.
          # This is intentionally a scope check, not technical acceptance.
          $kanto = Get-Content 'data/regions/kanto-source.json' -Raw | ConvertFrom-Json
          if($kanto.maps.'93' -eq 'LAVENDER_TOWN'){
            $hoenn = (Get-Content 'data/regions/hoenn-source.json' -Raw | ConvertFrom-Json).source
            if($hoenn.public_redistribution_approved -ne $true -or $hoenn.credits_status -ne 'VERIFIED_PER_ASSET'){
              Write-Host 'ANDROID_PUBLICATION_WITHHELD: public Hoenn redistribution scope is not verified. Compilation is not publication.'
              exit 0
            }
          }
          $tag="android-multiregion-${{ github.run_number }}-"+'${{ github.sha }}'.Substring(0,7)
          @'
          ZIP para JoiPlay + RPG Maker Plugin (nao APK), com Decades, Kanto e Hoenn.
          Build integrado em uma instalacao e perfil de saves; compile e provas verificadas.
          Nao instalar por cima de outro canal; fazer backup dos saves antes da migracao.
          Compatibilidade em dispositivo Android real ainda requer teste manual.
          '@ | Set-Content -Path dist/android-multiregion-notes.txt -Encoding utf8
          $assets=@('dist/Blue-Android-Decades-Kanto-Hoenn.zip',
            'dist/Blue-Android-Decades-Kanto-Hoenn.zip.sha256',
            'dist/Blue-Android-Decades-Kanto-Hoenn.update.json')
          $assets+=@(Get-ChildItem dist -File -Filter 'Blue-Android-Decades-Kanto-Hoenn*.patch.zip' | ForEach-Object { $_.FullName })
          gh release create $tag $assets --target '${{ github.sha }}' --title 'Pokemon Blue - Decades + Kanto + Hoenn (Android experimental)' --notes-file dist/android-multiregion-notes.txt --prerelease
          if($LASTEXITCODE -ne 0){throw 'Falha ao publicar pacote multirregional no GitHub.'}
          # Retain the affected release manifest/assets for migration, but mark
          # the bad download visibly after the verified replacement is online.
          gh release edit android-multiregion-hotfix-31-e7200ef --title 'RETIRADO DE USO - Android hotfix 31 (142 mapas, use a release integrada mais recente)' --notes "Pacote legado incorreto com 142 mapas; NAO INSTALAR. Mantido apenas para gerar patches de recuperacao. Atualize para $tag pela via incremental."
          if($LASTEXITCODE -ne 0){throw 'Nao foi possivel marcar o hotfix legado como retirado de uso.'}
