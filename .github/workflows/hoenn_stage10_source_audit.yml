name: Hoenn Stage 10 - auditoria read-only doador
on:
  push:
    branches: [main]
    paths:
      - scripts/regions/inspect_hoenn_stage10_donor.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar MapInfos e eventos originais sem persistir RXDATA
        run: python scripts/regions/inspect_hoenn_stage10_donor.py
