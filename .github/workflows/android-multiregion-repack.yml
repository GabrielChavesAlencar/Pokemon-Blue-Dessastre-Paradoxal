name: Android - regressao do repack legado (sem publicacao)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/android/repack_multiregion_hotfix.py'
      - 'scripts/battle_polish/RegionTravel.rb'
      - 'tests/region_map_transition_perf_runtime.rb'
      - 'tests/test_region_map_transition_android.py'
      - 'data/kanto-music-rules.json'
      - 'data/kanto-music.json'
      - 'tests/test_kanto_cerulean_route4_android.py'
      - 'tests/test_kanto_music_phase1.py'
      - 'tests/test_kanto_music_phase2.py'
      - 'tests/test_kanto_music_phase3.py'
      - 'tests/test_kanto_music_phase4.py'
      - 'tests/test_kanto_music_phase5.py'
      - 'scripts/android/update_client.py'
      - 'scripts/battle_lab/Mobile.rb'
      - 'scripts/android/package.py'
      - 'tests/android_version_menu.rb'
      - 'scripts/android/publish_updates.py'
      - '.github/workflows/android-multiregion-repack.yml'
permissions:
  contents: read
concurrency:
  group: android-multiregion-hotfix
  cancel-in-progress: false
jobs:
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir compilador do ZIP e correcao de Kanto
        run: |
          python -m py_compile scripts/android/repack_multiregion_hotfix.py scripts/android/update_client.py
          ruby -c scripts/battle_polish/RegionStart.rb
          ruby -c scripts/battle_polish/RegionTravel.rb
          ruby tests/region_map_transition_perf_runtime.rb scripts/battle_polish/RegionTravel.rb
          ruby -I. tests/region_travel_runtime.rb tests/regions_data_fixture.rb scripts/battle_polish/Regions.rb scripts/battle_polish/RegionTravel.rb
          python -m unittest discover -s tests -p test_region_map_transition_android.py -v
          ruby -c scripts/battle_lab/Mobile.rb
          ruby tests/android_version_menu.rb scripts/battle_lab/Mobile.rb
          ruby tests/region_start_android_no_json_runtime.rb scripts/battle_polish/RegionStart.rb
          python -m unittest discover -s tests -p test_android_updates.py -v
          python -m unittest discover -s tests -p test_kanto_music_phase2.py -v
          python -m unittest discover -s tests -p test_kanto_music_phase3.py -v
          python -m unittest discover -s tests -p test_kanto_music_phase4.py -v
          python -m unittest discover -s tests -p test_kanto_music_phase5.py -v
          python -m unittest discover -s tests -p test_kanto_cerulean_route4_android.py -v
      - name: Baixar ZIP ORIGINAL auditado e hashes da release integrada
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/base
          gh release download android-multiregion-15-125155e \
            --pattern 'Blue-Android-Decades-Kanto-Hoenn.zip*' --dir dist/base
          gh release download android-multiregion-15-125155e \
            --pattern 'Blue-Android-Decades-Kanto-Hoenn.update.json' --dir dist/base
          cd dist/base
          sha256sum -c Blue-Android-Decades-Kanto-Hoenn.zip.sha256
      - name: Reempacotar arquivos reais e gerar deltas para versoes anteriores
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/android/repack_multiregion_hotfix.py \
            --source dist/base/Blue-Android-Decades-Kanto-Hoenn.zip \
            --output dist/Blue-Android-Decades-Kanto-Hoenn.zip \
            --revision "$GITHUB_SHA"
          args=(--channel multiregion --full-zip dist/Blue-Android-Decades-Kanto-Hoenn.zip
            --previous-manifest dist/base/Blue-Android-Decades-Kanto-Hoenn.update.json)
          while read -r tag; do
            [[ -z "$tag" || "$tag" == "android-multiregion-15-125155e" ]] && continue
            mkdir -p "dist/previous/$tag"
            gh release download "$tag" --pattern 'Blue-Android-Decades-Kanto-Hoenn.update.json' --dir "dist/previous/$tag"
            args+=(--previous-manifest "dist/previous/$tag/Blue-Android-Decades-Kanto-Hoenn.update.json")
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            .[] | select(.draft == false and (.tag_name | startswith("android-multiregion-"))) |
            select([.assets[].name] | index("Blue-Android-Decades-Kanto-Hoenn.update.json")) |
            .tag_name' | awk '!seen[$0]++' | head -n 4)
          # Always support the exact user-installed revisions explicitly:
          # 5d0cc84 (old launcher) and 8e6e527 (working no-backup updater).
          # Even if the GitHub release catalogue spans more than 100 items,
          # preserve a small direct patch instead of silently requiring 1.4 GB.
          # Explicitly allow players who installed our opt-in map preview to
          # return to the stable updater via a validated small delta.
          for prior in "android-multiregion-hotfix-2-5d0cc84" "android-multiregion-hotfix-22-8e6e527" "android-map-perf-preview-02e8e5a"; do
            mkdir -p "dist/previous/$prior"
            gh release download "$prior" --pattern 'Blue-Android-Decades-Kanto-Hoenn.update.json' --dir "dist/previous/$prior" --clobber
            args+=(--previous-manifest "dist/previous/$prior/Blue-Android-Decades-Kanto-Hoenn.update.json")
          done
          python scripts/android/publish_updates.py "${args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("dist/Blue-Android-Decades-Kanto-Hoenn.update.json").read_text())
          revisions={entry["from_revision"] for entry in manifest.get("patches", [])}
          assert "02e8e5addc7a7f2c4a9f71195fcae7f49631ed54" in revisions, (
              "Android map-performance preview cannot migrate to the stable release")
          print("PASS: verified incremental transition from preview to stable")
          PY
          cd dist
          sha256sum Blue-Android-Decades-Kanto-Hoenn.zip > Blue-Android-Decades-Kanto-Hoenn.zip.sha256
          test "$(stat -c %s Blue-Android-Decades-Kanto-Hoenn.zip)" -lt 2147483648
      # Historical 142-map input is for regression only. The full integrated
      # build is the sole publisher; do not offer the historical ZIP or deltas.
      - name: Registrar diagnostico legado sem distribuir jogo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-repack-diagnostic-only
          path: dist/Blue-Android-Decades-Kanto-Hoenn.zip.sha256
          if-no-files-found: error
