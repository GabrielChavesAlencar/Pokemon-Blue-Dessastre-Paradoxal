      - name: Compilar a missao integrada de Sinnoh somente na copia privada
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'sinnoh-f12d-integrated-gameplay'
        timeout-minutes: 22
        shell: pwsh
        run: |
          # The base is the installed Blue from this job; no synthetic catalogue.
          # Reuse the pinned Mesa driver already verified for Kanto.
          $ErrorActionPreference = 'Stop'
          $env:PYTHONIOENCODING = 'utf-8'
          @'
          import sys,json,hashlib
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/"scripts"/"regions"))
          import install_sinnoh_experimental_windows as install
          import sinnoh_source_download as source
          base=root/"game"
          tracked=("Data/Scripts.rxdata","Data/MapInfos.rxdata","Data/Tilesets.rxdata","Data/System.rxdata","PBS/items.txt","Game.ini","mkxp.json")
          def snapshot():
              return {p:hashlib.sha256((base/p).read_bytes()).hexdigest() for p in tracked}
          before=snapshot()
          source.ensure_sources(root)
          outputs,report=install.build_files(base,root)
          integrated=report["f12d_integrated"]
          print("SINNOH_F12D_ACTUAL_INSTALLER_RESULT "+json.dumps({
              "maps_prepared":report["maps_prepared"],"status":integrated["status"],
              "regional_catalogue":report.get("private_regional_catalogue",{}),
              "roark":report.get("f11a_gym",{}),
              "engine_profile":integrated.get("engine_profile"),"reason":integrated.get("reason"),
              "candidate_ready":integrated.get("candidate_ready"),"native_verified":False,
              "runtime_install_enabled":integrated["runtime_install_enabled"],
              "pre_chase_graph_checks":integrated.get("pre_chase_graph_checks",[]),
              "lake_payloads":integrated.get("lake_payloads",[]),
              "lake_original_seam_recovery":integrated.get("lake_original_seam_recovery",{}),
              "lake_original_entries":integrated.get("lake_original_entries",{}),
              "lake_independent_legs":integrated.get("lake_independent_legs",{}),
              "lake_surf_geometry":integrated.get("lake_surf_geometry",{}),
              "surf_pickup":integrated.get("surf_pickup",{}),
              "item":integrated.get("item_catalogue",{})},sort_keys=True),flush=True)
          assert report["maps_prepared"]==144, "actual installed Blue did not prepare all 144 maps"
          assert integrated["runtime_install_enabled"] and integrated["status"]=="F12D_INTEGRATED_PRIVATE_COPY_PREPARED", "actual private candidate not staged"
          assert integrated["native_verified"] is False and integrated["normal_launch_allowed"] is False
          assert len(integrated["pre_chase_graph_checks"])==3
          assert integrated["geometry_delta_count"]==71
          pickup=integrated.get("surf_pickup",{})
          surf_rows=[row for row in integrated.get("lake_surf_geometry",{}).get("maps",{}).values()
                     if row.get("surf_candidate") and row.get("water_steps",0)>0]
          surf_maps=sorted(row["map_id"] for row in surf_rows)
          surf_expected={str(row["map_id"]):{"steps":2*row["steps"],"shore":len(row["transitions"])} for row in surf_rows}
          assert pickup.get("prepared") is True, "regional HM03 pickup not prepared"
          assert len(surf_maps)==len(set(surf_maps))==2 and pickup.get("runtime_route_count")==len(surf_maps), "expected two original aquatic route witnesses"
          assert not report["main_game_modified"] and not report["personal_saves_copied"]
          dest=install.install_copy(base,outputs,report,root)
          assert snapshot()==before,"source game changed"
          (root/".blue-work"/"sinnoh-f12d-ci-copy.json").write_text(json.dumps({
              "directory":str(dest),"compile_token":report["compile_token"],"base_before":before,
              "surf_maps":surf_maps,"surf_expected":surf_expected}),"utf-8")
          print("SINNOH_F12D_ACTUAL_PRIVATE_COPY_PREPARED_OK",flush=True)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Sinnoh actual private copy preparation failed'}
          $receipt=Get-Content .blue-work/sinnoh-f12d-ci-copy.json -Raw | ConvertFrom-Json
          $qa=$receipt.directory
          if(-not (Test-Path "$qa/Data/sinnoh-experimental-compile-request.txt")){throw 'Sinnoh compile-only request missing'}
          if(Test-Path "$qa/Data/sinnoh-experimental-compiled.txt"){throw 'Stale native compile receipt'}
          foreach($foreign in @('blue-verify-request.txt','blue-battle-lab-request.txt','blue-reference-export-request.txt')){
            if(Test-Path -LiteralPath "$qa/Data/$foreign"){throw "Foreign diagnostic request inherited: $foreign"}
          }
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $qa }
          if(-not (Test-Path "$qa/opengl32.dll")){throw 'Sinnoh x64 OpenGL driver missing'}
          $process=Start-Process -FilePath "$qa/Game.exe" -WorkingDirectory $qa -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/sinnoh-f12d-compile-out.txt" -RedirectStandardError ".blue-work/sinnoh-f12d-compile-err.txt"
          $handle=$process.Handle
          if(-not $process.WaitForExit(240000)){
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            Get-Content ".blue-work/sinnoh-f12d-compile-out.txt",".blue-work/sinnoh-f12d-compile-err.txt","$qa/Data/sinnoh-experimental-compile-error.txt" -ErrorAction SilentlyContinue | Select-Object -Last 80
            throw 'Sinnoh private compile-only process timed out'
          }
          $nativeOut = Get-Content ".blue-work/sinnoh-f12d-compile-out.txt" -Raw -ErrorAction SilentlyContinue
          $nativeErr = Get-Content ".blue-work/sinnoh-f12d-compile-err.txt" -Raw -ErrorAction SilentlyContinue
          $nativeStages = @($nativeOut,$nativeErr) -join "`n"
          $nativeStages -split "`n" | Where-Object { $_ -match 'SINNOH_F12D_NATIVE_' } | Write-Host
          $compileError = Test-Path -LiteralPath "$qa/Data/sinnoh-experimental-compile-error.txt"
          $compileReceipt = Test-Path -LiteralPath "$qa/Data/sinnoh-experimental-compiled.txt"
          $compileRequest = Test-Path -LiteralPath "$qa/Data/sinnoh-experimental-compile-request.txt"
          Write-Host "SINNOH_F12D_NATIVE_RECEIPT_STATE exit=$($process.ExitCode) error=$compileError receipt=$compileReceipt request=$compileRequest"
          if($compileError){
            Write-Host 'SINNOH_F12D_NATIVE_ERROR_FILE_BEGIN'
            Get-Content -LiteralPath "$qa/Data/sinnoh-experimental-compile-error.txt" | Write-Host
            Write-Host 'SINNOH_F12D_NATIVE_ERROR_FILE_END'
          }
          if($process.ExitCode -ne 0 -or $compileError -or (-not $compileReceipt) -or $compileRequest){
            Get-Content ".blue-work/sinnoh-f12d-compile-out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content ".blue-work/sinnoh-f12d-compile-err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw 'Sinnoh native compilation/collision/transaction proof missing'
          }
          foreach($marker in @('SINNOH_F12D_NATIVE_STAGE FOREIGN_REQUESTS_ISOLATED','SINNOH_F12D_NATIVE_STAGE CORE_COMPILED_AND_RESTORED','SINNOH_F12D_NATIVE_STAGE COMPILER_RETURNED','SINNOH_F12D_NATIVE_ITEM_COMPILED_OK','SINNOH_F12D_NATIVE_MOVEMENT_PROBE_OK','SINNOH_F12D_NATIVE_TRANSACTION_PROBE_OK','SINNOH_F12D_NATIVE_SURF_PICKUP_TRANSACTION_OK','SINNOH_F12D_NATIVE_LAKE_SURF_TERRAIN_REFERENCE_OK','SINNOH_F12D_NATIVE_SURF_MAP_COLLISION_OK','SINNOH_F12D_NATIVE_STAGE ALL_VERIFIERS_PASSED')){
            if($nativeStages -notmatch [regex]::Escape($marker)){throw "Missing native stage: $marker"}
          }
          foreach($mid in $receipt.surf_maps){
            $collision=[regex]::Matches($nativeStages, "(?m)^SINNOH_F12D_NATIVE_SURF_MAP_COLLISION_MAP $mid ([1-9][0-9]*)\s*$")
            $shore=[regex]::Matches($nativeStages, "(?m)^SINNOH_F12D_NATIVE_SURF_SHORE_JUMP_MAP $mid ([1-9][0-9]*) ([1-9][0-9]*)\s*$")
            if($collision.Count -ne 1 -or $shore.Count -ne 1){throw "Missing or duplicate native Surf map receipt: $mid"}
            $expected=$receipt.surf_expected.PSObject.Properties[[string]$mid].Value
            $full=[regex]::Matches($nativeStages, "(?m)^SINNOH_F12D_NATIVE_SURF_FULL_ROUTE_MAP $mid ([1-9][0-9]*) ([0-9]+)\s*$")
            if($null -eq $expected -or $full.Count -ne 1){throw "Missing full route proof: $mid"}
            if([int]$shore[0].Groups[1].Value -ne $expected.shore -or [int]$shore[0].Groups[2].Value -ne $expected.shore -or $expected.shore -lt 2){throw "Incomplete bidirectional shoreline jumps: $mid"}
            if([int]$full[0].Groups[1].Value -ne $expected.steps -or ([int]$full[0].Groups[2].Value + [int]$collision[0].Groups[1].Value) -ne $expected.steps){throw "Incomplete native route steps: $mid"}
          }
          if((Get-Content "$qa/Data/sinnoh-experimental-compiled.txt" -Raw).Trim() -ne $receipt.compile_token){throw 'Sinnoh compile token mismatch'}
          if(-not (Test-Path "$qa/Data/items.dat")){throw 'Sinnoh compiled item catalogue missing'}
          foreach($entry in $receipt.base_before.PSObject.Properties){
            if((Get-FileHash -LiteralPath (Join-Path 'game' $entry.Name) -Algorithm SHA256).Hash.ToLower() -ne $entry.Value){throw 'Source Blue changed during Sinnoh compile'}
          }
          Write-Host 'SINNOH_F12D_NATIVE_PRIVATE_COMPILE_COLLISION_TRANSACTION_OK'
          Write-Host 'Native compile-only process ended. No player save or gameplay QA executed; no source files published.'
      - name: Verificar abertura real da janela (diagnostico, sem jogar)
        if: success()
        continue-on-error: true
        shell: powershell
        run: |
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Copy-Item .blue-work/kanto-clean-main.rxdata "$pilot/Data/Scripts.rxdata" -Force
          Remove-Item "$pilot/Data/blue-kanto-proof.rb" -ErrorAction SilentlyContinue
          python scripts/regions/gui_diagnostics.py --output .blue-work/kanto-pilot --no-build --probe --seconds 25
          if($LASTEXITCODE -ne 0){throw 'O ambiente de CI nao confirmou janela visivel; usar o diagnostico local no Windows'}
      - name: Auditar e importar Kanto no Blue descartavel da CI
        shell: powershell
        run: |
          $originalSystem=(Get-FileHash 'game/Data/System.rxdata' -Algorithm SHA256).Hash
          $originalIni=(Get-FileHash 'game/Game.ini' -Algorithm SHA256).Hash
          $originalConfig=(Get-FileHash 'game/mkxp.json' -Algorithm SHA256).Hash
          python scripts/regions/install_kanto.py --game game --pilot .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto import dry-run failed'}
          # This must be the SAME automatic entry point called by the site's
          # Blue-Story.exe, never a hand-executed BAT or a special CI shortcut.
          python scripts/regions/auto_integrate_kanto.py
          if($LASTEXITCODE -ne 0){throw 'Blue-Story automatic Kanto integration failed'}
          $status=Get-Content '.blue-work/kanto-install-status.json' -Raw | ConvertFrom-Json
          if($status.status -ne 'integrated' -or -not $status.ready){throw 'Automatic installation falsely reported Kanto ready'}
          python scripts/regions/install_kanto.py --verify-installed --game game
          if($LASTEXITCODE -ne 0){throw 'Kanto files not verifiable after auto installer'}
          if(-not (Test-Path 'game/Data/blue-kanto-music.txt')){throw 'Regional music manifest missing from integrated Kanto'}
          python scripts/music/compile_kanto_music.py --game game
          if($LASTEXITCODE -ne 0){throw 'Installed Kanto music MapIDs failed to compile'}
          $integrated='game/Data/blue-kanto-music.txt'
          if(@(Get-Content $integrated | Where-Object { $_ -match '^MAP[\t]' }).Count -ne 84){throw '84 Kanto environment bindings lost in integrated game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^TRANSPORT[\t]' }).Count -ne 2){throw 'Bicycle/Surf bindings lost in integrated game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^BATTLE[\t]' }).Count -ne 8){throw 'Kanto 8 battle/victory themes missing from installed game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^BASEPOOL[\t]' }).Count -ne 3){throw 'Decades baseline pool fingerprints missing'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^ME[\t]' }).Count -ne 6){throw 'Installed game lost six proven Kanto ME bindings'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^SCENE[\t]' }).Count -ne 5){throw 'Installed game lost the five confirmed Kanto scenes'}
          if(@(Get-ChildItem 'game/Audio/BGM/Kanto' -Filter '*.mp3' -File).Count -ne 32){throw 'Installed game must contain exactly 32 approved Kanto BGM files'}
          if(@(Get-ChildItem 'game/Audio/ME/Kanto' -Filter '*.mp3' -File).Count -ne 6){throw 'Kanto ME import must install exactly six proven files'}
          python scripts/music/install_kanto_music.py --game game --approved
          if($LASTEXITCODE -ne 0){throw 'Integrated game phase2 BGM integrity failed'}
          if(-not (Test-Path 'game/Data/blue-kanto-start.txt')){throw 'Kanto marker missing'}
          foreach($kind in @('RIVAL','BUGCATCHER','CAMPER','LEADER','LASS','YOUNGSTER','SUPERNERD','HIKER','ROCKET','SWIMMER','PICNICKER','LEADER_MISTY')){
            $portrait="game/Graphics/Trainers/BLUE_KANTO_$kind.png"
