name: Piloto de Kanto - verificação nativa
on:
  push:
    branches: [main]
    paths: ['scripts/regions/**', 'data/regions/kanto-source.json', '.github/workflows/kanto-pilot-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Blue e a fonte editável de Kanto
        shell: powershell
        run: |
          python scripts/install_game.py --apply
          if($LASTEXITCODE -ne 0){throw 'Blue installation failed'}
          $ProgressPreference='SilentlyContinue'
          $source=New-Item -ItemType Directory -Force '.blue-work/frlg-source'
          $archive=Join-Path $source.FullName 'FRLG.rar'
          $url='https://drive.usercontent.google.com/download?id=1dsqD8lEJCz-lioEruRqQycWJLCUVxVtI&export=download&confirm=t'
          Invoke-WebRequest -UseBasicParsing $url -OutFile $archive
          $manifest=Get-Content data/regions/kanto-source.json -Raw | ConvertFrom-Json
          if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $manifest.sha256){throw 'FRLG archive hash differs'}
          $list=Join-Path $source.FullName 'files.txt'
          $entries=@(tar -tf $archive | Where-Object { $_ -match '^Essentials FRLG/(Data/(Map[0-9]+|MapInfos|Tilesets|System)\.rxdata|PBS/(encounters|trainers|map_connections|map_metadata)\.txt|Graphics/(Characters|Tilesets|Autotiles)/[^/]+\.png)$' })
          if($LASTEXITCODE -ne 0 -or $entries.Count -lt 200){throw 'FRLG archive listing failed'}
          [IO.File]::WriteAllLines($list,[string[]]$entries,(New-Object System.Text.UTF8Encoding($false)))
          tar -xf $archive -C $source.FullName -T $list
          if($LASTEXITCODE -ne 0){throw 'FRLG extraction failed'}
          python scripts/regions/audit_next_segment.py
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 07 source audit failed'}
          python scripts/regions/pilot.py
          if($LASTEXITCODE -ne 0){throw 'Pilot build failed'}
          python scripts/regions/verify_pilot.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto structural verification failed'}
          python scripts/regions/export_kanto.py --preview .blue-work/kanto-pilot --output .blue-work/kanto-site-preview.json --print-preview-chunks
          if($LASTEXITCODE -ne 0){throw 'Kanto portal export proof failed'}
          Copy-Item .blue-work/kanto-pilot/Data/Scripts.rxdata .blue-work/kanto-clean-main.rxdata
          python scripts/regions/native_check.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Native check preparation failed'}
      - name: Compilar e testar Kanto na engine
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          if((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa checksum failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $mesa "-o$mesaFolder" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Mesa extraction failed'}
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $pilot }
          if(-not (Test-Path "$pilot/opengl32.dll")){throw 'x64 OpenGL driver missing'}
          for($attempt=1;$attempt -le 3;$attempt++){
            $process=Start-Process -FilePath "$pilot/Game.exe" -WorkingDirectory $pilot -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-native-out.txt" -RedirectStandardError ".blue-work/kanto-native-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(150000)){Stop-Process -Id $process.Id;throw 'Kanto native test timed out'}
            if(Test-Path "$pilot/Data/blue-kanto-proof.txt"){Get-Content "$pilot/Data/blue-kanto-proof.txt";exit 0}
            if(Test-Path "$pilot/Data/blue-kanto-error.txt"){break}
            if($process.ExitCode -ne 0 -and -not (Select-String -Path .blue-work/kanto-native-out.txt -Pattern 'Successfully compiled all game data' -Quiet)){break}
          }
          Get-Content .blue-work/kanto-native-out.txt,.blue-work/kanto-native-err.txt,"$pilot/Data/blue-kanto-error.txt","$pilot/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
          throw 'Kanto native proof missing'
      - name: Verificar abertura real da janela (diagnostico, sem jogar)
        if: success()
        continue-on-error: true
        shell: powershell
        run: |
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Copy-Item .blue-work/kanto-clean-main.rxdata "$pilot/Data/Scripts.rxdata" -Force
          Remove-Item "$pilot/Data/blue-kanto-proof.rb" -ErrorAction SilentlyContinue
          python scripts/regions/gui_diagnostics.py --output .blue-work/kanto-pilot --no-build --probe --seconds 25
          if($LASTEXITCODE -ne 0){throw 'O ambiente de CI nao confirmou janela visivel; usar o diagnostico local no Windows'}
      - name: Auditar e importar Kanto no Blue descartavel da CI
        shell: powershell
        run: |
          $originalSystem=(Get-FileHash 'game/Data/System.rxdata' -Algorithm SHA256).Hash
          $originalIni=(Get-FileHash 'game/Game.ini' -Algorithm SHA256).Hash
          $originalConfig=(Get-FileHash 'game/mkxp.json' -Algorithm SHA256).Hash
          python scripts/regions/install_kanto.py --game game --pilot .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto import dry-run failed'}
          python scripts/regions/install_kanto.py --apply --game game --pilot .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto transaction failed'}
          if(-not (Test-Path 'game/Data/blue-kanto-start.txt')){throw 'Kanto marker missing'}
          foreach($kind in @('RIVAL','BUGCATCHER','CAMPER','LEADER')){
            $portrait="game/Graphics/Trainers/BLUE_KANTO_$kind.png"
            if(-not (Test-Path $portrait)){throw "Kanto portrait missing: $portrait"}
            if((Get-Item $portrait).Length -lt 8){throw "Kanto portrait empty: $portrait"}
          }
          Write-Host 'Four Kanto trainer portraits are present in the integrated game.'
          if((Get-FileHash 'game/Data/System.rxdata' -Algorithm SHA256).Hash -ne $originalSystem){throw 'Native start was overwritten'}
          if((Get-FileHash 'game/Game.ini' -Algorithm SHA256).Hash -ne $originalIni){throw 'Native game title was overwritten'}
          if((Get-FileHash 'game/mkxp.json' -Algorithm SHA256).Hash -ne $originalConfig){throw 'Native save directory was changed'}
          python scripts/regions/install_kanto.py --apply --game game
          if($LASTEXITCODE -ne 0){throw 'Idempotent install check failed'}
      - name: Verificar origem Kanto e preservacao do ponto inicial Decades
        shell: powershell
        run: |
          # The Mesa OpenGL shim depends on additional x64 DLLs; copying only
          # opengl32.dll causes a misleading window-creation timeout.
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination 'game' -Force }
          if(-not (Test-Path 'game/opengl32.dll')){throw 'CI Mesa x64 OpenGL runtime missing'}
          python scripts/regions/native_check.py game --integrated
          if($LASTEXITCODE -ne 0){throw 'Kanto integrated proof preparation failed'}
          $game=(Resolve-Path game).Path
          for($attempt=1;$attempt -le 2;$attempt++){
            $process=Start-Process -FilePath "$game/Game.exe" -WorkingDirectory $game -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-main-out.txt" -RedirectStandardError ".blue-work/kanto-main-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(110000)){
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt","$game/Data/blue-kanto-integrated-proof.txt" -ErrorAction SilentlyContinue | Select-Object -Last 160
              Get-ChildItem "$game/Data" -Filter "blue-kanto-*" -ErrorAction SilentlyContinue | Select-Object Name,Length
              throw 'Integrated Kanto proof timed out; diagnostics above'
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-proof.txt"){
              Get-Content "$game/Data/blue-kanto-integrated-proof.txt"
              exit 0
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-error.txt"){break}
          }
          Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
          throw 'Integrated Kanto new game/save proof missing'
