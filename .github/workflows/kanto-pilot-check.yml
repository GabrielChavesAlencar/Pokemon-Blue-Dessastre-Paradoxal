name: Piloto de Kanto - verificação nativa
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['scripts/regions/**', 'tests/qa_k03a_daycare_source.py', 'scripts/music/**', 'scripts/battle_polish/Title.rb', 'data/kanto-music-rules.json', 'data/regions/kanto-source.json', '.github/workflows/kanto-pilot-check.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Blue e a fonte editável de Kanto
        shell: powershell
        run: |
          python scripts/install_game.py --apply --skip-kanto
          if($LASTEXITCODE -ne 0){throw 'Blue installation failed'}
          if($env:GITHUB_HEAD_REF -eq 'sinnoh-f12d-integrated-gameplay'){
            # The actual Blue base has just been installed in this runner.
            # Read only local script fingerprints and catalogue metadata,
            # without executing or publishing Sinnoh's private source data.
            python -c "import sys; sys.path.insert(0,'scripts/regions'); import install_sinnoh_experimental_windows; import sinnoh_f12d_integrated as i; from pathlib import Path; import json; base=Path('game'); print('SINNOH_F12D_LOCAL_ENGINE_REFERENCE_REPORT '+json.dumps(i.local_engine(base),sort_keys=True)); print('SINNOH_F12D_LOCAL_ITEM_CATALOGUE_REPORT '+json.dumps(i.item_catalogue.audit(base),sort_keys=True))"
            if($LASTEXITCODE -ne 0){throw 'Sinnoh local reference preflight failed'}
          }
          python scripts/regions/ensure_source.py
          if($LASTEXITCODE -ne 0){throw 'Pinned FRLG source preparation failed'}
          python scripts/regions/audit_k04_rock_tunnel.py
          if($LASTEXITCODE -ne 0){throw 'K04 Rock Tunnel source inventory failed'}
          # Prove the default release build first, using all inputs from this SHA.
          python scripts/regions/pilot.py --output .blue-work/kanto-release-pilot
          if($LASTEXITCODE -ne 0){throw 'Active Kanto pilot build failed'}
          python scripts/regions/release_gate.py --pilot .blue-work/kanto-release-pilot
          if($LASTEXITCODE -ne 0){throw 'Active Kanto release gate failed'}
          python scripts/regions/export_kanto.py --preview .blue-work/kanto-release-pilot --output .blue-work/kanto-release-site.json
          if($LASTEXITCODE -ne 0){throw 'Active Kanto portal export failed'}
          python -c "import json; from pathlib import Path; a,b=(json.loads(Path(p).read_text(encoding='utf-8')) for p in ('site/public/data/kanto.json','.blue-work/kanto-release-site.json')); assert a['source']==b['source'] and all(sorted(a[k],key=lambda r:r['id'])==sorted(b[k],key=lambda r:r['id']) for k in ('locations','trainers')); print('KANTO_K03E_ACTIVE_PORTAL_MATCH_OK')"
          if($LASTEXITCODE -ne 0){throw 'Committed game guide differs from active compiled sources'}
          Copy-Item .blue-work/kanto-release-pilot/Data/Scripts.rxdata .blue-work/kanto-release-clean-main.rxdata
          # Keep native regression coverage against the exact historical 156-map
          # inputs. Restore the current revision before entering any package path.
          $baseline='e7c8f8d5d42ebe225cf88a4f900b0e0f8102b1bb'
          git fetch --no-tags --depth=1 origin $baseline
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch pinned K03-D regression inputs'}
          git restore --source=$baseline -- data/regions/kanto-source.json data/kanto-music-rules.json site/public/data/kanto.json
          if($LASTEXITCODE -ne 0){throw 'Cannot prepare pinned K03-D regression inputs'}
          python scripts/regions/audit_kanto_coverage.py > .blue-work/kanto-map-coverage.json
          if($LASTEXITCODE -ne 0){throw 'Kanto source/catalog coverage audit failed'}
          python scripts/regions/audit_next_segment.py
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 07 source audit failed'}
          ruby tests/kanto_journey_trainer_runtime.rb scripts/battle_polish/Journey.rb
          if($LASTEXITCODE -ne 0){throw 'JoiPlay Cerulean trainer identity regression failed'}
          python tests/test_kanto_cerulean_north.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Cerulean north source/MapID audit failed'}
          python tests/test_kanto_installer.py
          if($LASTEXITCODE -ne 0){throw 'K02-C migration ownership contract failed'}
          python tests/test_kanto_auto_integrate.py
          if($LASTEXITCODE -ne 0){throw 'K02-C automatic migration contract failed'}
          python tests/test_kanto_release_pagination.py
          if($LASTEXITCODE -ne 0){throw 'Kanto release selector regression tests failed'}
          python scripts/regions/audit_vermilion.py --output .blue-work/kanto-phase-08-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 08 source audit failed'}
          python scripts/regions/vermilion_interiors.py
          if($LASTEXITCODE -ne 0){throw 'K03-B original source identity/reward audit failed'}
          python tests/qa_k03a_daycare_source.py
          if($LASTEXITCODE -ne 0){throw 'K03-A Day Care source identity/transfer audit failed'}
          python scripts/regions/audit_celadon.py --output .blue-work/kanto-phase-09-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 09 source audit failed'}
          python scripts/regions/audit_celadon_core.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Celadon core event audit failed'}
          python scripts/regions/audit_fuchsia.py --output .blue-work/kanto-phase-10-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 10 source audit failed'}
          python scripts/regions/audit_fuchsia_core.py
          if($LASTEXITCODE -ne 0){throw 'Fuchsia core event and team audit failed'}
          python scripts/regions/audit_league.py --output .blue-work/kanto-phase-14-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 14 source audit failed'}
          python scripts/regions/audit_viridian_gym.py --output .blue-work/kanto-phase-13-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 13 source audit failed'}
          python scripts/regions/audit_cinnabar.py --output .blue-work/kanto-phase-12-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 12 source audit failed'}
          python scripts/regions/audit_saffron.py --output .blue-work/kanto-phase-11-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 11 source audit failed'}
          python scripts/regions/audit_pallet_home.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Pallet home source audit failed'}
          python scripts/regions/audit_saffron_core.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Saffron core source audit failed'}
          python scripts/regions/audit_trainer_interactions.py
          if($LASTEXITCODE -ne 0){throw 'Kanto trainer interaction audit failed'}
          python scripts/regions/audit_early_interiors.py
          if($LASTEXITCODE -ne 0){throw 'Kanto early interior audit failed'}
          python scripts/regions/audit_source_encounters.py --output .blue-work/kanto-phase-15-source-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 15 source PBS inventory failed'}
          python scripts/regions/pilot.py
          if($LASTEXITCODE -ne 0){throw 'Pilot build failed'}
          python scripts/regions/audit_cerulean_interiors.py
          if($LASTEXITCODE -ne 0){throw 'K02-C isolated source geometry migration failed'}
          python scripts/regions/audit_k03e_diglett.py
          if($LASTEXITCODE -ne 0){throw 'K03-E isolated source and geometry candidate failed'}
          $scope='.blue-work/kanto-pilot/Data/blue-kanto-music.txt'
          if(-not (Test-Path $scope)){throw 'Missing regional Kanto music scope'}
          $scopeRows=@(Get-Content $scope | Where-Object { $_ -match '^SCOPE[\t]' })
          if($scopeRows.Count -ne 156){throw "Expected 156 real MapIDs; got $($scopeRows.Count)"}
          python scripts/music/compile_kanto_music.py --game .blue-work/kanto-pilot --apply
          if($LASTEXITCODE -ne 0){throw 'Kanto regional music compiler failed'}
          $mapRows=@(Get-Content $scope | Where-Object { $_ -match '^MAP[\t]' })
          $vehicleRows=@(Get-Content $scope | Where-Object { $_ -match '^TRANSPORT[\t]' })
          if($mapRows.Count -ne 84){throw "Fase 2: expected 84 verified map BGMs, got $($mapRows.Count)"}
          if($vehicleRows.Count -ne 2){throw "Fase 2: expected bicycle and surf, got $($vehicleRows.Count)"}
          if(@(Get-Content $scope | Where-Object { $_ -match '^BATTLE[\t]' }).Count -ne 8){throw 'Fase 3: expected 8 regional battle/victory bindings'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^ME[\t]' }).Count -ne 6){throw 'Fase 4: expected 6 confirmed ME bindings'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^SCENE[\t]' }).Count -ne 5){throw 'Fase 5: exactly five verified scene BGMs expected'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^SCENE[\t](credits|opening_movie|epilogue)[\t]' }).Count -ne 0){throw 'Unverified cinematic/credits must stay disabled'}
          $actualTracks=@(Get-ChildItem '.blue-work/kanto-pilot/Audio/BGM/Kanto' -Filter '*.mp3' -File)
          if($actualTracks.Count -ne 32){throw 'Fase 5: exactly 32 approved BGM MP3s expected'}
          $meTracks=@(Get-ChildItem '.blue-work/kanto-pilot/Audio/ME/Kanto' -Filter '*.mp3' -File)
          if($meTracks.Count -ne 6){throw 'Fase 4: exactly 6 proven ME tracks are expected; unverified ME must remain absent'}
          python scripts/music/install_kanto_music.py --game .blue-work/kanto-pilot --approved
          if($LASTEXITCODE -ne 0){throw 'Fase 2 MP3 integrity failed'}
          Write-Host 'Kanto F5: 84 maps, 2 vehicles, 8 battle, 6 ME, 5 scene BGM, 8 scene pending; 32 BGM + 6 ME installed.'
          python scripts/regions/audit_canonical.py --output .blue-work/kanto-phase-15-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 15 canonical PBS audit failed'}
          python scripts/regions/verify_pilot.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto structural verification failed'}
          python scripts/regions/export_kanto.py --preview .blue-work/kanto-pilot --output .blue-work/kanto-site-preview.json --print-preview-chunks
          if($LASTEXITCODE -ne 0){throw 'Kanto portal export proof failed'}
          Copy-Item .blue-work/kanto-pilot/Data/Scripts.rxdata .blue-work/kanto-clean-main.rxdata
          python scripts/regions/native_check.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Native check preparation failed'}
      - name: Guardar inventário K04 Rock Tunnel (sem arquivos do jogo)
        if: always() && hashFiles('.blue-work/kanto-k04-source.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kanto-k04-source-inventory
          path: .blue-work/kanto-k04-source.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Preservar recibo K02-C da fonte e migracao isolada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-k02c-source-and-geometry
          path: .blue-work/kanto-k02c-source.json
          if-no-files-found: error
      - name: Preservar cobertura completa dos mapas de Kanto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-map-coverage
          path: .blue-work/kanto-map-coverage.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preservar inventario da fonte FRLG fase 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-15-fonte
          path: .blue-work/kanto-phase-15-source-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preservar auditoria FRLG fase 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-15-auditoria
          path: .blue-work/kanto-phase-15-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preservar inventario da fase 08
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-08-auditoria
          path: .blue-work/kanto-phase-08-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar inventario K03-A Day Care
        if: always() && hashFiles('.blue-work/kanto-k03a-daycare-source.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kanto-k03a-daycare-source
          path: .blue-work/kanto-k03a-daycare-source.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publicar inventario de Celadon sem eventos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-09-auditoria
          path: .blue-work/kanto-phase-09-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar inventario Fuchsia fase 10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-10-auditoria
          path: .blue-work/kanto-phase-10-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar inventario Liga fase 14
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-14-auditoria
          path: .blue-work/kanto-phase-14-audit.json
          if-no-files-found: ignore
      - name: Preservar inventario Viridian fase 13
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-13-auditoria
          path: .blue-work/kanto-phase-13-audit.json
          if-no-files-found: ignore
      - name: Publicar inventario Cinnabar fase 12
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanto-fase-12-auditoria
          path: .blue-work/kanto-phase-12-audit.json
          if-no-files-found: ignore
      - name: Publicar inventario Saffron fase 11
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-11-auditoria
          path: .blue-work/kanto-phase-11-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compilar e testar Kanto na engine
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          if((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa checksum failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $mesa "-o$mesaFolder" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Mesa extraction failed'}
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $pilot }
          if(-not (Test-Path "$pilot/opengl32.dll")){throw 'x64 OpenGL driver missing'}
          for($attempt=1;$attempt -le 3;$attempt++){
            $process=Start-Process -FilePath "$pilot/Game.exe" -WorkingDirectory $pilot -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-native-out.txt" -RedirectStandardError ".blue-work/kanto-native-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(150000)){
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              Get-Content ".blue-work/kanto-native-out.txt",".blue-work/kanto-native-err.txt","$pilot/Data/blue-kanto-error.txt","$pilot/errorlog.txt","$pilot/Data/blue-kanto-stage.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
              Get-ChildItem "$pilot/Data" -Filter "blue-kanto-*" -ErrorAction SilentlyContinue | Select-Object Name,Length
              throw 'Kanto native test timed out; see diagnostics above'
            }
            if(Test-Path "$pilot/Data/blue-kanto-proof.txt"){
              $nativeAudio="$pilot/Data/blue-kanto-music-native-pilot.txt"
              if(-not (Test-Path $nativeAudio)){throw "Native Kanto F6 AudioFile probe missing"}
              if(-not ((Get-Content $nativeAudio -Raw) -match "PASS_NATIVE_AUDIOFILE_DISPATCH_NOT_AUDIBLE")){throw "Kanto music F6 native probe did not pass"}
              Get-Content $nativeAudio
              $scaleProof="$pilot/Data/blue-kanto-gary-scale-proof.txt"
              if(-not (Test-Path $scaleProof)){throw 'Gary native sprite scale proof missing'}
              $scaleText=Get-Content $scaleProof -Raw
              if($scaleText -notmatch 'KANTO_GARY_VISIBLE_PLAYER_SCALE_REPORT:' -or $scaleText -notmatch 'KANTO_GARY_VISIBLE_PLAYER_SCALE_OK'){throw 'Gary native sprite scale proof invalid'}
              Get-Content $scaleProof
              $northProof="$pilot/Data/blue-kanto-k00-cerulean-proof.txt"
              if(-not (Test-Path $northProof)){throw 'K00-C native Cerulean proof missing'}
              Get-Content $northProof
              $openingProof="$pilot/Data/blue-kanto-k01a-starter-proof.txt"
              if(-not (Test-Path $openingProof)){throw 'K01-A native starter proof missing'}
              $openingTrace="$pilot/Data/blue-kanto-k01a-state-trace.txt"
              if(-not (Test-Path $openingTrace)){throw 'K01-A save-state trace missing'}
              Get-Content $openingTrace | ForEach-Object { Write-Host "KANTO_K01A_SAVE_STATE:$_" }
              Write-Host ("KANTO_K01A_NATIVE_STARTER_REPORT:" + (Get-Content $openingProof -Raw).Trim())
              Write-Host 'KANTO_K01A_THREE_STARTERS_SAVE_RELOAD_OK'
              $parcelTrace="$pilot/Data/blue-kanto-k01b-route-trace.txt"
              if(-not (Test-Path $parcelTrace)){throw 'K01-B native route trace missing'}
              Get-Content $parcelTrace
              $parcelProof="$pilot/Data/blue-kanto-k01b-parcel-proof.txt"
              if(-not (Test-Path $parcelProof)){throw 'K01-B native Pallet/Oak proof missing'}
              Write-Host ("KANTO_K01B_NATIVE_PALLET_OAK_REPORT:" + (Get-Content $parcelProof -Raw).Trim())
              Write-Host 'KANTO_K01B_PALLET_OAK_PARCEL_SAVE_RELOAD_OK'
              $route2Trace="$pilot/Data/blue-kanto-k01c-route2-trace.txt"
              $route2Proof="$pilot/Data/blue-kanto-k01c-route2-proof.txt"
              if(-not (Test-Path $route2Trace) -or -not (Test-Path $route2Proof)){throw 'K01-C native Route2 proof missing'}
              Get-Content $route2Trace | ForEach-Object { Write-Host "KANTO_K01C_ROUTE2_GATE_STATE:$_" }
              Write-Host ("KANTO_K01C_NATIVE_ROUTE2_REPORT:" + (Get-Content $route2Proof -Raw).Trim())
              Write-Host 'KANTO_K01C_ROUTE2_GATE_SAVE_RELOAD_OK'
              $forestTrace="$pilot/Data/blue-kanto-k01d-forest-trace.txt"
              $forestProof="$pilot/Data/blue-kanto-k01d-forest-proof.txt"
              if(-not (Test-Path $forestTrace) -or -not (Test-Path $forestProof)){throw 'K01-D native Forest proof missing'}
              Get-Content $forestTrace
              Write-Host ("KANTO_K01D_NATIVE_FOREST_REPORT:" + (Get-Content $forestProof -Raw).Trim())
              Write-Host 'KANTO_K01D_FOREST_CORRIDOR_TRAINERS_SAVE_RELOAD_OK'
              $pewterTrace="$pilot/Data/blue-kanto-k01e-pewter-trace.txt"
              $pewterProof="$pilot/Data/blue-kanto-k01e-pewter-proof.txt"
              if(-not (Test-Path $pewterTrace) -or -not (Test-Path $pewterProof)){throw 'K01-E native Pewter proof missing'}
              Get-Content $pewterTrace
              Write-Host ("KANTO_K01E_NATIVE_PEWTER_REPORT:" + (Get-Content $pewterProof -Raw).Trim())
              Write-Host 'KANTO_K01E_BROCK_ROUTE3_SHOES_SAVE_RELOAD_OK'
              $moonTrace="$pilot/Data/blue-kanto-k02a-moon-trace.txt"
              $moonProof="$pilot/Data/blue-kanto-k02a-moon-proof.txt"
              if(-not (Test-Path $moonTrace) -or -not (Test-Path $moonProof)){throw 'K02-A native Moon proof missing'}
              Get-Content $moonTrace
              Write-Host ("KANTO_K02A_NATIVE_MOON_REPORT:" + (Get-Content $moonProof -Raw).Trim())
              Write-Host 'KANTO_K02A_MOON_FOSSILS_REVIVAL_SAVE_RELOAD_OK'
              $interiorProof="$pilot/Data/blue-kanto-k02c-native-proof.txt"
              if(-not (Test-Path $interiorProof)){throw 'K02-C native interior proof missing'}
              Write-Host ("KANTO_K02C_NATIVE_INTERIORS_REPORT:" + (Get-Content $interiorProof -Raw).Trim())
              $ceruleanRegression="$pilot/Data/blue-kanto-cerulean-regression.txt"
              if(-not (Test-Path $ceruleanRegression)){throw 'Cerulean police/roundtrip native receipt missing'}
              $ceruleanMarkers=Get-Content $ceruleanRegression
              foreach($marker in @('KANTO_CERULEAN_POLICE_BEFORE_AFTER_BILL_OK','KANTO_CERULEAN_NATIVE_ROUNDTRIP_OK','KANTO_CERULEAN_POLICE_PACKAGED_NATIVE_AND_CACHE_REFRESH_OK','KANTO_CERULEAN_PHYSICAL_LEGACY_DIALOGUE_AND_DOOR_RECOVERY_OK','KANTO_CERULEAN_REAL_TICKET_AND_STANDING_DOOR_OK','KANTO_CERULEAN_ROCKET_REAR_EXIT_NATIVE_DIG_ONCE_OK')){
                if($ceruleanMarkers -notcontains $marker){throw "Missing native marker: $marker"}
              }
              $ceruleanMarkers | Write-Host
              Write-Host 'KANTO_K02C_INTERIORS_BIKE_ROCKET_SAVE_RELOAD_OK'
              $ceruleanTrace="$pilot/Data/blue-kanto-k02d-trace.txt"
              $ceruleanProof="$pilot/Data/blue-kanto-k02d-proof.txt"
              if(-not (Test-Path $ceruleanTrace) -or -not (Test-Path $ceruleanProof)){throw 'K02-D native Cerulean proof missing'}
              Get-Content $ceruleanTrace
              Write-Host ("KANTO_K02D_NATIVE_CERULEAN_REPORT:" + (Get-Content $ceruleanProof -Raw).Trim())
              Write-Host 'KANTO_K02D_GARY_BILL_MISTY_SAVE_RELOAD_OK'
              $vermilionProof="$pilot/Data/blue-kanto-k03b-proof.txt"
              if(-not (Test-Path $vermilionProof)){throw 'K03-B native Vermilion proof missing'}
              Write-Host ("KANTO_K03B_NATIVE_VERMILION_REPORT:" + (Get-Content $vermilionProof -Raw).Trim())
              Write-Host 'KANTO_K03B_NATIVE_VERMILION_SAVE_RELOAD_OK'
              $anneProof="$pilot/Data/blue-kanto-k03c-proof.txt"
              if(-not (Test-Path $anneProof)){throw 'K03-C native S.S. Anne proof missing'}
              Write-Host ("KANTO_K03C_NATIVE_SS_ANNE_REPORT:" + (Get-Content $anneProof -Raw).Trim())
              Write-Host 'KANTO_K03C_BOARDING_CAPTAIN_CUT_SAVE_RELOAD_OK'
              $surgeProof="$pilot/Data/blue-kanto-k03d-proof.txt"
              if(-not (Test-Path $surgeProof)){throw 'K03-D native Surge proof missing'}
              $surgeReceipt=(Get-Content $surgeProof -Raw).Trim()
              if($surgeReceipt -notmatch '"cut_access"=>\{' -or $surgeReceipt -notmatch '"native_interpreter"=>true' -or $surgeReceipt -notmatch '"after"=>true'){throw 'K03-D physical Cut receipt incomplete'}
              Write-Host ("KANTO_K03D_NATIVE_SURGE_REPORT:" + $surgeReceipt)
              Write-Host 'KANTO_K03D_NATIVE_CUT_ACCESS_OK'
              Write-Host 'KANTO_K03D_SURGE_THUNDER_SAVE_RELOAD_OK'
              $corridorTrace="$pilot/Data/blue-kanto-k03a-trace.txt"
              $corridorProof="$pilot/Data/blue-kanto-k03a-proof.txt"
              if(-not (Test-Path $corridorTrace) -or -not (Test-Path $corridorProof)){throw 'K03-A native corridor proof missing'}
              Get-Content $corridorTrace
              Write-Host ("KANTO_K03A_NATIVE_CORRIDOR_REPORT:" + (Get-Content $corridorProof -Raw).Trim())
              Write-Host 'KANTO_K03A_ROUTE5_ROUTE6_TRAINERS_SAVE_RELOAD_OK'
              $daycareProof="$pilot/Data/blue-kanto-k03a-daycare-proof.txt"
              if(-not (Test-Path $daycareProof)){throw 'K03-A native Day Care transaction proof missing'}
              Write-Host ("KANTO_K03A_NATIVE_DAYCARE_REPORT:" + (Get-Content $daycareProof -Raw).Trim())
              Write-Host 'KANTO_K03A_DAYCARE_DEPOSIT_WITHDRAW_SAVE_RELOAD_OK'
              Get-Content "$pilot/Data/blue-kanto-proof.txt"
              exit 0
            }
            if(Test-Path "$pilot/Data/blue-kanto-error.txt"){break}
            if($process.ExitCode -ne 0 -and -not (Select-String -Path .blue-work/kanto-native-out.txt -Pattern 'Successfully compiled all game data' -Quiet)){break}
