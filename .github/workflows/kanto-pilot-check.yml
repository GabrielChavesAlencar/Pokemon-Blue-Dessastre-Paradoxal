      - name: Publicar release experimental Kanto (se compilado e conferido)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-kanto-release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(echo "$GITHUB_SHA" | cut -c 1-7)
          tag="kanto-android-$GITHUB_RUN_NUMBER-$short"
          assets=(dist/Blue-Android-Kanto-Piloto.zip dist/Blue-Android-Kanto-Piloto.zip.sha256 dist/Blue-Android-Kanto-Piloto.update.json)
          shopt -s nullglob
          for file in dist/Blue-Android-Kanto-Piloto*.patch.zip; do assets+=("$file"); done
          gh release create "kanto-windows-$GITHUB_RUN_NUMBER-$short" dist/Blue-Windows-Kanto-Piloto.zip dist/Blue-Windows-Kanto-Piloto.zip.sha256 --target "$GITHUB_SHA" --title "Pokémon Blue — Kanto Windows experimental ($GITHUB_RUN_NUMBER)" --notes-file docs/INSTALACAO.md --prerelease --latest=false
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "Pokémon Blue — Kanto Android experimental ($GITHUB_RUN_NUMBER)" --notes-file docs/ANDROID_PILOTOS_KANTO_JOHTO.md --prerelease --latest=false
      - name: Preservar diagnóstico de falha nativa Kanto
        if: failure()
