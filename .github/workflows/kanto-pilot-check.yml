name: Piloto de Kanto - verificação nativa
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['scripts/regions/**', 'scripts/music/**', 'scripts/battle_polish/Title.rb', 'data/kanto-music-rules.json', 'data/regions/kanto-source.json', '.github/workflows/kanto-pilot-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GALLIUM_DRIVER: llvmpipe
      ALSOFT_DRIVERS: 'null'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar Blue e a fonte editável de Kanto
        shell: powershell
        run: |
          python scripts/install_game.py --apply
          if($LASTEXITCODE -ne 0){throw 'Blue installation failed'}
          python scripts/regions/ensure_source.py
          if($LASTEXITCODE -ne 0){throw 'Pinned FRLG source preparation failed'}
          python scripts/regions/audit_next_segment.py
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 07 source audit failed'}
          python scripts/regions/audit_vermilion.py --output .blue-work/kanto-phase-08-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 08 source audit failed'}
          python scripts/regions/audit_celadon.py --output .blue-work/kanto-phase-09-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 09 source audit failed'}
          python scripts/regions/audit_celadon_core.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Celadon core event audit failed'}
          python scripts/regions/audit_fuchsia.py --output .blue-work/kanto-phase-10-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 10 source audit failed'}
          python scripts/regions/audit_fuchsia_core.py
          if($LASTEXITCODE -ne 0){throw 'Fuchsia core event and team audit failed'}
          python scripts/regions/audit_league.py --output .blue-work/kanto-phase-14-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 14 source audit failed'}
          python scripts/regions/audit_viridian_gym.py --output .blue-work/kanto-phase-13-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 13 source audit failed'}
          python scripts/regions/audit_cinnabar.py --output .blue-work/kanto-phase-12-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 12 source audit failed'}
          python scripts/regions/audit_saffron.py --output .blue-work/kanto-phase-11-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 11 source audit failed'}
          python scripts/regions/audit_pallet_home.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Pallet home source audit failed'}
          python scripts/regions/audit_saffron_core.py
          if($LASTEXITCODE -ne 0){throw 'Kanto Saffron core source audit failed'}
          python scripts/regions/audit_trainer_interactions.py
          if($LASTEXITCODE -ne 0){throw 'Kanto trainer interaction audit failed'}
          python scripts/regions/audit_early_interiors.py
          if($LASTEXITCODE -ne 0){throw 'Kanto early interior audit failed'}
          python scripts/regions/audit_source_encounters.py --output .blue-work/kanto-phase-15-source-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 15 source PBS inventory failed'}
          python scripts/regions/pilot.py
          if($LASTEXITCODE -ne 0){throw 'Pilot build failed'}
          $scope='.blue-work/kanto-pilot/Data/blue-kanto-music.txt'
          if(-not (Test-Path $scope)){throw 'Missing regional Kanto music scope'}
          $scopeRows=@(Get-Content $scope | Where-Object { $_ -match '^SCOPE[\t]' })
          if($scopeRows.Count -ne 142){throw "Expected 142 real MapIDs; got $($scopeRows.Count)"}
          python scripts/music/compile_kanto_music.py --game .blue-work/kanto-pilot --apply
          if($LASTEXITCODE -ne 0){throw 'Kanto regional music compiler failed'}
          $mapRows=@(Get-Content $scope | Where-Object { $_ -match '^MAP[\t]' })
          $vehicleRows=@(Get-Content $scope | Where-Object { $_ -match '^TRANSPORT[\t]' })
          if($mapRows.Count -ne 49){throw "Fase 2: expected 49 verified map BGMs, got $($mapRows.Count)"}
          if($vehicleRows.Count -ne 2){throw "Fase 2: expected bicycle and surf, got $($vehicleRows.Count)"}
          if(@(Get-Content $scope | Where-Object { $_ -match '^BATTLE[\t]' }).Count -ne 8){throw 'Fase 3: expected 8 regional battle/victory bindings'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^ME[\t]' }).Count -ne 6){throw 'Fase 4: expected 6 confirmed ME bindings'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^SCENE[\t]' }).Count -ne 5){throw 'Fase 5: exactly five verified scene BGMs expected'}
          if(@(Get-Content $scope | Where-Object { $_ -match '^SCENE[\t](credits|opening_movie|epilogue)[\t]' }).Count -ne 0){throw 'Unverified cinematic/credits must stay disabled'}
          $actualTracks=@(Get-ChildItem '.blue-work/kanto-pilot/Audio/BGM/Kanto' -Filter '*.mp3' -File)
          if($actualTracks.Count -ne 30){throw 'Fase 5: exactly 30 approved BGM MP3s expected'}
          $meTracks=@(Get-ChildItem '.blue-work/kanto-pilot/Audio/ME/Kanto' -Filter '*.mp3' -File)
          if($meTracks.Count -ne 6){throw 'Fase 4: exactly 6 proven ME tracks are expected; unverified ME must remain absent'}
          python scripts/music/install_kanto_music.py --game .blue-work/kanto-pilot --approved
          if($LASTEXITCODE -ne 0){throw 'Fase 2 MP3 integrity failed'}
          Write-Host 'Kanto F5: 49 maps, 2 vehicles, 8 battle, 6 ME, 5 scene BGM, 8 scene pending; 30 BGM + 6 ME installed.'
          python scripts/regions/audit_canonical.py --output .blue-work/kanto-phase-15-audit.json
          if($LASTEXITCODE -ne 0){throw 'Kanto phase 15 canonical PBS audit failed'}
          python scripts/regions/verify_pilot.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto structural verification failed'}
          python scripts/regions/export_kanto.py --preview .blue-work/kanto-pilot --output .blue-work/kanto-site-preview.json --print-preview-chunks
          if($LASTEXITCODE -ne 0){throw 'Kanto portal export proof failed'}
          Copy-Item .blue-work/kanto-pilot/Data/Scripts.rxdata .blue-work/kanto-clean-main.rxdata
          python scripts/regions/native_check.py .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Native check preparation failed'}
      - name: Preservar inventario da fonte FRLG fase 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-15-fonte
          path: .blue-work/kanto-phase-15-source-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preservar auditoria FRLG fase 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-15-auditoria
          path: .blue-work/kanto-phase-15-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preservar inventario da fase 08
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-08-auditoria
          path: .blue-work/kanto-phase-08-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publicar inventario de Celadon sem eventos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-09-auditoria
          path: .blue-work/kanto-phase-09-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar inventario Fuchsia fase 10
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-10-auditoria
          path: .blue-work/kanto-phase-10-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preservar inventario Liga fase 14
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-14-auditoria
          path: .blue-work/kanto-phase-14-audit.json
          if-no-files-found: ignore
      - name: Preservar inventario Viridian fase 13
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-13-auditoria
          path: .blue-work/kanto-phase-13-audit.json
          if-no-files-found: ignore
      - name: Publicar inventario Cinnabar fase 12
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanto-fase-12-auditoria
          path: .blue-work/kanto-phase-12-audit.json
          if-no-files-found: ignore
      - name: Publicar inventario Saffron fase 11
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanto-fase-11-auditoria
          path: .blue-work/kanto-phase-11-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compilar e testar Kanto na engine
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          if((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa checksum failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $mesa "-o$mesaFolder" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Mesa extraction failed'}
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $pilot }
          if(-not (Test-Path "$pilot/opengl32.dll")){throw 'x64 OpenGL driver missing'}
          for($attempt=1;$attempt -le 3;$attempt++){
            $process=Start-Process -FilePath "$pilot/Game.exe" -WorkingDirectory $pilot -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-native-out.txt" -RedirectStandardError ".blue-work/kanto-native-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(150000)){Stop-Process -Id $process.Id;throw 'Kanto native test timed out'}
            if(Test-Path "$pilot/Data/blue-kanto-proof.txt"){
              $nativeAudio="$pilot/Data/blue-kanto-music-native-pilot.txt"
              if(-not (Test-Path $nativeAudio)){throw "Native Kanto F6 AudioFile probe missing"}
              if(-not ((Get-Content $nativeAudio -Raw) -match "PASS_NATIVE_AUDIOFILE_DISPATCH_NOT_AUDIBLE")){throw "Kanto music F6 native probe did not pass"}
              Get-Content $nativeAudio
              Get-Content "$pilot/Data/blue-kanto-proof.txt"
              exit 0
            }
            if(Test-Path "$pilot/Data/blue-kanto-error.txt"){break}
            if($process.ExitCode -ne 0 -and -not (Select-String -Path .blue-work/kanto-native-out.txt -Pattern 'Successfully compiled all game data' -Quiet)){break}
          }
          Get-Content .blue-work/kanto-native-out.txt,.blue-work/kanto-native-err.txt,"$pilot/Data/blue-kanto-error.txt","$pilot/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
          throw 'Kanto native proof missing'
      - name: Verificar abertura real da janela (diagnostico, sem jogar)
        if: success()
        continue-on-error: true
        shell: powershell
        run: |
          $pilot=(Resolve-Path .blue-work/kanto-pilot).Path
          Copy-Item .blue-work/kanto-clean-main.rxdata "$pilot/Data/Scripts.rxdata" -Force
          Remove-Item "$pilot/Data/blue-kanto-proof.rb" -ErrorAction SilentlyContinue
          python scripts/regions/gui_diagnostics.py --output .blue-work/kanto-pilot --no-build --probe --seconds 25
          if($LASTEXITCODE -ne 0){throw 'O ambiente de CI nao confirmou janela visivel; usar o diagnostico local no Windows'}
      - name: Auditar e importar Kanto no Blue descartavel da CI
        shell: powershell
        run: |
          $originalSystem=(Get-FileHash 'game/Data/System.rxdata' -Algorithm SHA256).Hash
          $originalIni=(Get-FileHash 'game/Game.ini' -Algorithm SHA256).Hash
          $originalConfig=(Get-FileHash 'game/mkxp.json' -Algorithm SHA256).Hash
          python scripts/regions/install_kanto.py --game game --pilot .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto import dry-run failed'}
          python scripts/regions/install_kanto.py --apply --game game --pilot .blue-work/kanto-pilot
          if($LASTEXITCODE -ne 0){throw 'Kanto transaction failed'}
          if(-not (Test-Path 'game/Data/blue-kanto-music.txt')){throw 'Regional music manifest missing from integrated Kanto'}
          python scripts/music/compile_kanto_music.py --game game
          if($LASTEXITCODE -ne 0){throw 'Installed Kanto music MapIDs failed to compile'}
          $integrated='game/Data/blue-kanto-music.txt'
          if(@(Get-Content $integrated | Where-Object { $_ -match '^MAP[\t]' }).Count -ne 49){throw '49 Kanto environment bindings lost in integrated game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^TRANSPORT[\t]' }).Count -ne 2){throw 'Bicycle/Surf bindings lost in integrated game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^BATTLE[\t]' }).Count -ne 8){throw 'Kanto 8 battle/victory themes missing from installed game'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^BASEPOOL[\t]' }).Count -ne 3){throw 'Decades baseline pool fingerprints missing'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^ME[\t]' }).Count -ne 6){throw 'Installed game lost six proven Kanto ME bindings'}
          if(@(Get-Content $integrated | Where-Object { $_ -match '^SCENE[\t]' }).Count -ne 5){throw 'Installed game lost the five confirmed Kanto scenes'}
          if(@(Get-ChildItem 'game/Audio/BGM/Kanto' -Filter '*.mp3' -File).Count -ne 30){throw 'Installed game must contain exactly 30 approved Kanto BGM files'}
          if(@(Get-ChildItem 'game/Audio/ME/Kanto' -Filter '*.mp3' -File).Count -ne 6){throw 'Kanto ME import must install exactly six proven files'}
          python scripts/music/install_kanto_music.py --game game --approved
          if($LASTEXITCODE -ne 0){throw 'Integrated game phase2 BGM integrity failed'}
          if(-not (Test-Path 'game/Data/blue-kanto-start.txt')){throw 'Kanto marker missing'}
          foreach($kind in @('RIVAL','BUGCATCHER','CAMPER','LEADER','LASS','YOUNGSTER','SUPERNERD','HIKER','ROCKET','SWIMMER','PICNICKER','LEADER_MISTY')){
            $portrait="game/Graphics/Trainers/BLUE_KANTO_$kind.png"
            if(-not (Test-Path $portrait)){throw "Kanto portrait missing: $portrait"}
            if((Get-Item $portrait).Length -lt 8){throw "Kanto portrait empty: $portrait"}
          }
          Write-Host 'All twelve regional trainer portraits are present in the integrated game.'
          if((Get-FileHash 'game/Data/System.rxdata' -Algorithm SHA256).Hash -ne $originalSystem){throw 'Native start was overwritten'}
          if((Get-FileHash 'game/Game.ini' -Algorithm SHA256).Hash -ne $originalIni){throw 'Native game title was overwritten'}
          if((Get-FileHash 'game/mkxp.json' -Algorithm SHA256).Hash -ne $originalConfig){throw 'Native save directory was changed'}
          python scripts/regions/install_kanto.py --apply --game game
          if($LASTEXITCODE -ne 0){throw 'Idempotent install check failed'}
      - name: Verificar origem Kanto e preservacao do ponto inicial Decades
        shell: powershell
        run: |
          # The Mesa OpenGL shim depends on additional x64 DLLs; copying only
          # opengl32.dll causes a misleading window-creation timeout.
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination 'game' -Force }
          if(-not (Test-Path 'game/opengl32.dll')){throw 'CI Mesa x64 OpenGL runtime missing'}
          python scripts/regions/native_check.py game --integrated
          if($LASTEXITCODE -ne 0){throw 'Kanto integrated proof preparation failed'}
          $game=(Resolve-Path game).Path
          for($attempt=1;$attempt -le 2;$attempt++){
            $process=Start-Process -FilePath "$game/Game.exe" -WorkingDirectory $game -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-main-out.txt" -RedirectStandardError ".blue-work/kanto-main-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(110000)){
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt","$game/Data/blue-kanto-integrated-proof.txt" -ErrorAction SilentlyContinue | Select-Object -Last 160
              Get-ChildItem "$game/Data" -Filter "blue-kanto-*" -ErrorAction SilentlyContinue | Select-Object Name,Length
              throw 'Integrated Kanto proof timed out; diagnostics above'
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-proof.txt"){
              $nativeAudio="$game/Data/blue-kanto-music-native-integrated.txt"
              if(-not (Test-Path $nativeAudio)){throw "Integrated Kanto F6 native AudioFile probe missing"}
              if(-not ((Get-Content $nativeAudio -Raw) -match "PASS_NATIVE_AUDIOFILE_DISPATCH_NOT_AUDIBLE")){throw "Integrated F6 BGM/ME engine dispatch failed"}
              Get-Content $nativeAudio
              Get-Content "$game/Data/blue-kanto-integrated-proof.txt"
              exit 0
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-error.txt"){break}
          }
          Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
          throw 'Integrated Kanto new game/save proof missing'
