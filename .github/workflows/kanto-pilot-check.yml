      - name: Verificar origem Kanto e preservacao do ponto inicial Decades
        shell: powershell
        run: |
          # The Mesa OpenGL shim depends on additional x64 DLLs; copying only
          # opengl32.dll causes a misleading window-creation timeout.
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination 'game' -Force }
          if(-not (Test-Path 'game/opengl32.dll')){throw 'CI Mesa x64 OpenGL runtime missing'}
          python scripts/regions/native_check.py game --integrated
          if($LASTEXITCODE -ne 0){throw 'Kanto integrated proof preparation failed'}
          $game=(Resolve-Path game).Path
          for($attempt=1;$attempt -le 2;$attempt++){
            $process=Start-Process -FilePath "$game/Game.exe" -WorkingDirectory $game -WindowStyle Hidden -PassThru -RedirectStandardOutput ".blue-work/kanto-main-out.txt" -RedirectStandardError ".blue-work/kanto-main-err.txt"
            $handle=$process.Handle
            if(-not $process.WaitForExit(110000)){
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt","$game/Data/blue-kanto-integrated-proof.txt" -ErrorAction SilentlyContinue | Select-Object -Last 160
              Get-ChildItem "$game/Data" -Filter "blue-kanto-*" -ErrorAction SilentlyContinue | Select-Object Name,Length
              throw 'Integrated Kanto proof timed out; diagnostics above'
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-proof.txt"){
              $nativeAudio="$game/Data/blue-kanto-music-native-integrated.txt"
              if(-not (Test-Path $nativeAudio)){throw "Integrated Kanto F6 native AudioFile probe missing"}
              if(-not ((Get-Content $nativeAudio -Raw) -match "PASS_NATIVE_AUDIOFILE_DISPATCH_NOT_AUDIBLE")){throw "Integrated F6 BGM/ME engine dispatch failed"}
              Get-Content $nativeAudio
              $integratedScale="$game/Data/blue-kanto-gary-scale-integrated.txt"
              if(-not (Test-Path $integratedScale)){throw 'Integrated Gary/player actual sprite proof missing'}
              $scaleText=Get-Content $integratedScale -Raw
              if($scaleText -notmatch 'KANTO_GARY_VISIBLE_PLAYER_SCALE_INTEGRATED_OK:new_game' -or $scaleText -notmatch 'KANTO_GARY_VISIBLE_PLAYER_SCALE_INTEGRATED_OK:save_reload'){throw 'Integrated player scale new game/save reload proof missing'}
              Get-Content $integratedScale
              Get-Content "$game/Data/blue-kanto-integrated-proof.txt"
              exit 0
            }
            if(Test-Path "$game/Data/blue-kanto-integrated-error.txt"){break}
          }
          Get-Content ".blue-work/kanto-main-out.txt",".blue-work/kanto-main-err.txt","$game/Data/blue-kanto-integrated-error.txt","$game/Data/blue-kanto-integrated-stage.txt","$game/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
          throw 'Integrated Kanto new game/save proof missing'

      # The Kanto ZIP is a separate compiled game. It cannot be the Decades ZIP.
      - name: Compilar versão mobile do piloto de Kanto
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-kanto-release]')
        shell: powershell
        run: |
          $pilot=(Resolve-Path '.blue-work/kanto-pilot').Path
          Copy-Item '.blue-work/kanto-clean-main.rxdata' "$pilot/Data/Scripts.rxdata" -Force
          Remove-Item "$pilot/Data/blue-kanto-proof.rb","$pilot/Data/blue-kanto-walk-check.rb" -ErrorAction SilentlyContinue
          python scripts/android/package_kanto.py --windows --game-dir $pilot --output dist/Blue-Windows-Kanto-Piloto.zip --revision '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Kanto Windows archive verification failed'}
          python scripts/android/package_kanto.py --game-dir $pilot --request-compile
          if($LASTEXITCODE -ne 0){throw 'Kanto JoiPlay native compiler request failed'}
          for($attempt=1;$attempt -le 3;$attempt++){
            $process=Start-Process -FilePath "$pilot/Game.exe" -WorkingDirectory $pilot -WindowStyle Hidden -PassThru -RedirectStandardOutput '.blue-work/kanto-mobile-out.txt' -RedirectStandardError '.blue-work/kanto-mobile-err.txt'
            $null=$process.Handle
            if(-not $process.WaitForExit(180000)){
              Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
              Get-Content '.blue-work/kanto-mobile-out.txt','.blue-work/kanto-mobile-err.txt',"$pilot/Data/blue-android-stage.txt","$pilot/Data/blue-android-error.txt","$pilot/errorlog.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
              throw 'Kanto JoiPlay compiler timed out; no ZIP will be published'
            }
            if(Test-Path "$pilot/Data/blue-android-compiled.txt"){break}
            if(Test-Path "$pilot/Data/blue-android-error.txt"){break}
          }
          if(-not (Test-Path "$pilot/Data/blue-android-compiled.txt")){
            Get-Content '.blue-work/kanto-mobile-out.txt','.blue-work/kanto-mobile-err.txt',"$pilot/Data/blue-android-stage.txt","$pilot/Data/blue-android-error.txt" -ErrorAction SilentlyContinue | Select-Object -Last 100
            throw 'Kanto native compilation did not complete; publish blocked'
          }
          python scripts/android/package_kanto.py --game-dir $pilot --revision '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Kanto mobile archive build failed'}
          python scripts/android/package_kanto.py --verify --revision '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Kanto mobile archive verification failed'}
          python scripts/android/verify_kanto_cerulean.py --channel kanto --archive dist/Blue-Android-Kanto-Piloto.zip
          if($LASTEXITCODE -ne 0){throw 'Rotas 24/25 ou Luis/Diana nao chegaram ao Android Kanto'}
      - name: Gerar manifesto e atualização incremental de Kanto
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-kanto-release]')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Windows PowerShell 5.1 can pass empty native stdout between
          # gh.exe and python.exe. Read every page directly with Python HTTPS
          # so an empty or partial API response aborts before publishing.
          $selected=@(python scripts/android/select_previous_kanto_releases.py --fetch-github)
          if($LASTEXITCODE -ne 0 -or $selected.Count -eq 0){throw 'Cannot select verified previous Kanto releases; refusing full-only release'}
          $args=@('--channel','kanto','--full-zip','dist/Blue-Android-Kanto-Piloto.zip')
          foreach($tag in $selected){
            $old=Join-Path '.blue-work/previous-kanto' $tag
            New-Item -ItemType Directory -Force -Path $old | Out-Null
            gh release download $tag --pattern 'Blue-Android-Kanto-Piloto.update.json' --dir $old
            if($LASTEXITCODE -ne 0){throw "Cannot retrieve previous Kanto manifest: $tag"}
            $args+=@('--previous-manifest',(Join-Path $old 'Blue-Android-Kanto-Piloto.update.json'))
          }
          python scripts/android/publish_updates.py @args
          if($LASTEXITCODE -ne 0){throw 'Kanto update manifest validation failed'}
          # The current Kanto release has compatible historical manifests and
          # must deliver at least one actual delta, not just a full ZIP.
          $patches=@(Get-ChildItem dist -File -Filter 'Blue-Android-Kanto-Piloto*.patch.zip')
          if($patches.Count -eq 0){throw 'No incremental Kanto patch generated; publication blocked'}

      - name: Guardar ZIP de testes de Kanto
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-kanto-release]')
