name: Sinnoh L10 - indice publico de bloqueios sem QA nativa
on:
  pull_request:
    paths:
      - '.github/workflows/sinnoh-l10-public-index.yml'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'site/public/sinnoh-l10-bloqueios.html'
      - 'site/public/assets/sinnoh-l10-blocker-index.js'
      - 'site/src/index.html'
      - 'site/tests/sinnoh-l10-blocker-index.test.mjs'
      - 'scripts/regions/audit_sinnoh_l10_public_index.py'
      - 'tests/test_sinnoh_l10_public_index.py'
      - 'docs/SINNOH_L10_INDICE_PUBLICO_BLOQUEIOS.md'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sinnoh-l10-public-index.yml'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'site/public/sinnoh-l10-bloqueios.html'
      - 'site/public/assets/sinnoh-l10-blocker-index.js'
      - 'site/src/index.html'
      - 'site/tests/sinnoh-l10-blocker-index.test.mjs'
      - 'scripts/regions/audit_sinnoh_l10_public_index.py'
      - 'tests/test_sinnoh_l10_public_index.py'
      - 'docs/SINNOH_L10_INDICE_PUBLICO_BLOQUEIOS.md'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l10-index:
    name: L10 / 44 casos, 20 criterios, 125 testes negativos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes sintéticos L10 e integridade do índice
        run: python -m unittest discover -s tests -p 'test_sinnoh_l10_public_index.py' -v
      - name: Validar objetos Git publicos e gates sempre bloqueados
        run: |
          python scripts/regions/audit_sinnoh_l10_public_index.py > /tmp/sinnoh-l10-public.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/sinnoh-l10-public.json')
          d=json.loads(p.read_text('utf8'))
          assert d['stage']=='L10' and d['status']=='PUBLIC_INDEX_VALID_NATIVE_PENDING'
          assert d['baseline_commits']=={
              'L07':'d98033b362dac82347e0d97cb5606870eaa70b22',
              'L08':'8617ef47ea6745920cb6fe4be251982380d7628d',
              'L09':'39e51de92aafdab3f5aea3f929f57f5c0bb72b2d'}
          assert (d['cases_total'],d['windows_cases'],d['android_cases'],d['criteria_total'])==(44,43,1,20)
          assert (d['criteria_human_approved'],d['native_completed'],d['native_approved'],d['local_reports'])==(0,0,0,0)
          assert d['counts']['phase_bcd_completed']==0 and d['counts']['phase_bcd_total']==13
          assert d['blocker_ids']==['B09','B10','B11','R07','R08','R09']
          assert (d['cases_pending'],d['criteria_unreviewed'])==(44,20)
          assert all(d[k] for k in ('r07_pending','r08_pending','r09_pending','global_r09_pending','windows_android_review_independent'))
          assert not any(d[k] for k in ('b11_global_isolation_proven','mapids_reserved','asset_rights_approved',
                'can_run_game_exe','can_run_windows_sandbox','can_run_joiplay','can_install_live_game','sinnoh_playable'))
          for forbidden in ('Save01.rxdata','private-baseline.json','watch_id','hmac_key'):
              assert forbidden not in p.read_text('utf8')
          print('SINNOH_L10_44_CASES_20_CRITERIA_R09_GLOBAL_ALL_PENDING')
          PY
      - name: Impedir artefatos privados no workflow
        run: |
          test ! -e .blue-work/sinnoh-l00-input/public-reports.json
          test ! -e .blue-work/sinnoh-l01-source
          echo 'SINNOH_L10_PUBLIC_ONLY_NO_NATIVE_EXECUTION'

  l10-regressions:
    name: L10 / L09 L08 L07 L06 L05 L04 L03 L02 L01 L00 G12
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L09 reviewer handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_l09_public_handoff.py' -v
      - name: L08 pinned snapshot
        run: python -m unittest discover -s tests -p 'test_sinnoh_l08_pinned_snapshot.py' -v
      - name: L07 public triage
        run: python -m unittest discover -s tests -p 'test_sinnoh_l07_public_triage.py' -v
      - name: L06 review queues
        run: python -m unittest discover -s tests -p 'test_sinnoh_l06_human_evidence.py' -v
      - name: L05 dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l05_native_dependencies.py' -v
      - name: L04 human checklist
        run: python -m unittest discover -s tests -p 'test_sinnoh_l04_human_review.py' -v
      - name: L03 evidence matrix
        run: python -m unittest discover -s tests -p 'test_sinnoh_l03_matrix.py' -v
      - name: L02 sanitizer
        run: python -m unittest discover -s tests -p 'test_sinnoh_l02_evidence.py' -v
      - name: L01 report export
        run: python -m unittest discover -s tests -p 'test_sinnoh_l01_exporter.py' -v
      - name: L00 readiness
        run: python -m unittest discover -s tests -p 'test_sinnoh_l00_readiness.py' -v
      - name: G12 handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_g12_handoff.py' -v

  l10-portal:
    name: L10 / indice navegavel e build completo do site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JS de filtros
        run: node --check site/public/assets/sinnoh-l10-blocker-index.js
      - name: Testes de integridade dos painéis L10 e L07
        working-directory: site
        run: node --test tests/sinnoh-l10-blocker-index.test.mjs tests/sinnoh-l07-triage.test.mjs
      - name: Build completo do portal
        working-directory: site
        run: npm run build
      - name: Confirmar índices somente leitura publicados
        run: |
          test -s site/dist/sinnoh-l10-bloqueios.html
          test -s site/dist/data/sinnoh-l10-public-blocker-index.json
          test -s site/dist/assets/sinnoh-l10-blocker-index.js
          grep -q 'sinnoh-l10-bloqueios.html' site/dist/index.html
          echo 'SINNOH_L10_READONLY_INDEX_NO_NATIVE_QA'
