  workflow_dispatch:

permissions:
  contents: read

jobs:
  l19-consolidation:
    name: L19 / 88 PENDING gaps and synthetic negatives
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L19 own negative and invariant checks
        run: python -m unittest discover -s tests -p 'test_sinnoh_l19_consolidation.py' -v
      - name: Audit Git-public ancestry and no real approvals
        run: |
          python scripts/regions/audit_sinnoh_l19_consolidation.py > /tmp/sinnoh-l19-public.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/sinnoh-l19-public.json').read_text('utf8')
          d=json.loads(raw)
          assert d['stage']=='L19'
          assert d['status']=='PUBLIC_GAP_CONSOLIDATION_AUDITED_ALL_BLOCKED'
          assert d['baseline_commits']=={
           'L07':'d98033b362dac82347e0d97cb5606870eaa70b22',
           'L08':'8617ef47ea6745920cb6fe4be251982380d7628d',
           'L09':'39e51de92aafdab3f5aea3f929f57f5c0bb72b2d',
           'L10':'7fd821007e63fe9cf0d0c4bf14d153a23cda2b6a',
           'L11':'9d901a0cf21aa2742f731ee387a51f945bac8a5d',
           'L12':'58b7f2fec9f66dee06d95676eec66fb2ded6a1de',
           'L13':'1f12bcc86c10dcc934b024a0562cdadb65d5e2c2',
           'L14':'11eda18f7225e16b13007c1eb955ccc3d7667b66',
           'L15':'0192075fb02587c9f3d9db6b170500cba365251c',
           'L16':'709776022679dc5831748ea4ed2254c6ced1da84',
           'L17':'eb1333953d02d319e9b44a96c23fe2e071bd2a2e',
           'L18':'38ff6e635287f84464e1371160f3a06ae8dba953'}
          assert d['public_sources'][-1]=={
           'stage':'L18','path':'data/regions/sinnoh-l18-public-review-gaps.json',
           'git_blob_sha1':'649e85b2daef7635d00e19201ad5f39cc43c5c90'}
          assert (d['requests'],d['pending'],d['blocked'],d['gaps_open'],d['gaps_closed'])==(88,88,88,88,0)
          assert (d['human_reviews'],d['exit_criteria_met'],d['links'])==(0,0,1084)
          assert (d['case_to_criterion_links'],d['case_to_blocker_links'],d['criterion_to_blocker_links'])==(846,218,20)
          assert (d['anonymous_slots'],d['windows_native_pending'],d['android_native_pending'])==(18,43,1)
          assert (d['human_approved'],d['native_executed'],d['native_approved'],
                  d['local_reports_received'],d['phase_bcd_approved'])==(0,0,0,0,0)
          assert d['phase_bcd_total']==13
          assert d['r07_pending'] and d['r08_pending'] and d['r09_pending'] and d['r09_global_only']
          assert d['no_native_authorization'] and d['no_private_uploads']
          assert d['sinnoh_playable'] is False
          for secret in ('Save01.rxdata','private-baseline.json','hmac_key','watch_id'):
           assert secret not in raw
          print('SINNOH_L19_88_PUBLIC_GAPS_1084_LINKS_0_NATIVE_QA')
          PY
      - name: No private reports or local installations
        run: |
          test ! -e .blue-work/sinnoh-l00-input/public-reports.json
          test ! -e .blue-work/sinnoh-l01-source
          echo 'SINNOH_L19_PUBLIC_GIT_ONLY'

  l19-regressions:
    name: L19 / L18 through L00 and G12 regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L18 review gaps
        run: python -m unittest discover -s tests -p 'test_sinnoh_l18_review_gaps.py' -v
      - name: L17 independent guidance
        run: python -m unittest discover -s tests -p 'test_sinnoh_l17_public_review.py' -v
      - name: L16 exit gates
        run: python -m unittest discover -s tests -p 'test_sinnoh_l16_exit_gates.py' -v
      - name: L15 consistency
        run: python -m unittest discover -s tests -p 'test_sinnoh_l15_consistency_diff.py' -v
      - name: L14 dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l14_readiness.py' -v
      - name: L13 public request queue
        run: python -m unittest discover -s tests -p 'test_sinnoh_l13_public_queue.py' -v
      - name: L12 evidence gaps
        run: python -m unittest discover -s tests -p 'test_sinnoh_l12_coverage_gaps.py' -v
      - name: L11 traceability
        run: python -m unittest discover -s tests -p 'test_sinnoh_l11_traceability.py' -v
      - name: L10 blocker index
        run: python -m unittest discover -s tests -p 'test_sinnoh_l10_public_index.py' -v
      - name: L09 public handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_l09_public_handoff.py' -v
      - name: L08 source snapshots
        run: python -m unittest discover -s tests -p 'test_sinnoh_l08_pinned_snapshot.py' -v
      - name: L07 public triage
        run: python -m unittest discover -s tests -p 'test_sinnoh_l07_public_triage.py' -v
      - name: L06 evidence routing
        run: python -m unittest discover -s tests -p 'test_sinnoh_l06_human_evidence.py' -v
      - name: L05 dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l05_native_dependencies.py' -v
      - name: L04 human checklist
        run: python -m unittest discover -s tests -p 'test_sinnoh_l04_human_review.py' -v
      - name: L03 matrix
        run: python -m unittest discover -s tests -p 'test_sinnoh_l03_matrix.py' -v
      - name: L02 evidence sanitizer
        run: python -m unittest discover -s tests -p 'test_sinnoh_l02_evidence.py' -v
      - name: L01 exporter
        run: python -m unittest discover -s tests -p 'test_sinnoh_l01_exporter.py' -v
      - name: L00 readiness
        run: python -m unittest discover -s tests -p 'test_sinnoh_l00_readiness.py' -v
      - name: G12 native handoff fixture
        run: python -m unittest discover -s tests -p 'test_sinnoh_g12_handoff.py' -v

  l19-portal:
    name: L19 / read-only portal Node regression and full build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax check
        run: node --check site/public/assets/sinnoh-l19-consolidation.js
      - name: Node tests L19 L18 L17 L16 L15 L14 L13 L12 L11 L10 L07
        working-directory: site
        run: node --test tests/sinnoh-l19-consolidation.test.mjs tests/sinnoh-l18-review-gaps.test.mjs tests/sinnoh-l17-public-review.test.mjs tests/sinnoh-l16-public-exit-gates.test.mjs tests/sinnoh-l15-public-diff.test.mjs tests/sinnoh-l14-public-readiness.test.mjs tests/sinnoh-l13-public-queue.test.mjs tests/sinnoh-l12-coverage-gaps.test.mjs tests/sinnoh-l11-traceability.test.mjs tests/sinnoh-l10-blocker-index.test.mjs tests/sinnoh-l07-triage.test.mjs
      - name: Full portal build
        working-directory: site
        run: npm run build
      - name: Verify dist outputs and footer
        run: |
          test -s site/dist/sinnoh-l19-consolidacao.html
          test -s site/dist/data/sinnoh-l19-public-gap-consolidation.json
          test -s site/dist/assets/sinnoh-l19-consolidation.js
          grep -q 'sinnoh-l19-consolidacao.html' site/dist/index.html
          echo 'SINNOH_L19_STATIC_PUBLIC_ONLY_NO_NATIVE_QA'
