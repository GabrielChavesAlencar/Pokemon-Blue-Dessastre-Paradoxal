name: Online experimental - protocolo isolado
on:
  push:
    branches: [main]
    paths:
      - 'scripts/online/**'
      - 'tests/test_online*.py'
      - '.github/workflows/online-tests.yml'
  pull_request:
    paths:
      - 'scripts/online/**'
      - 'tests/test_online*.py'
      - '.github/workflows/online-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rooms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Salas, timeout, versoes e dois clientes HTTP reais
        run: python -m unittest discover -s tests -p "test_online*.py" -v
