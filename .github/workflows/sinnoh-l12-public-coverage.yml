name: Sinnoh L12 - cobertura documental vs lacunas fisicas (sem QA)
on:
  pull_request:
    paths:
      - '.github/workflows/sinnoh-l12-public-coverage.yml'
      - 'data/regions/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/data/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/sinnoh-l12-lacunas.html'
      - 'site/public/assets/sinnoh-l12-coverage-gaps.js'
      - 'site/tests/sinnoh-l12-coverage-gaps.test.mjs'
      - 'site/src/index.html'
      - 'scripts/regions/audit_sinnoh_l12_coverage_gaps.py'
      - 'tests/test_sinnoh_l12_coverage_gaps.py'
      - 'docs/SINNOH_L12_COBERTURA_E_LACUNAS_PUBLICAS.md'
      - 'data/regions/sinnoh-l11-public-traceability.json'
      - 'site/public/data/sinnoh-l11-public-traceability.json'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sinnoh-l12-public-coverage.yml'
      - 'data/regions/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/data/sinnoh-l12-public-coverage-gaps.json'
      - 'site/public/sinnoh-l12-lacunas.html'
      - 'site/public/assets/sinnoh-l12-coverage-gaps.js'
      - 'site/tests/sinnoh-l12-coverage-gaps.test.mjs'
      - 'site/src/index.html'
      - 'scripts/regions/audit_sinnoh_l12_coverage_gaps.py'
      - 'tests/test_sinnoh_l12_coverage_gaps.py'
      - 'docs/SINNOH_L12_COBERTURA_E_LACUNAS_PUBLICAS.md'
      - 'data/regions/sinnoh-l11-public-traceability.json'
      - 'site/public/data/sinnoh-l11-public-traceability.json'
      - 'data/regions/sinnoh-l10-public-blocker-index.json'
      - 'site/public/data/sinnoh-l10-public-blocker-index.json'
      - 'data/regions/sinnoh-l09-independent-public-handoff.json'
      - 'data/regions/sinnoh-l08-pinned-snapshot.json'
      - 'data/regions/sinnoh-l08-semantic-diff.json'
      - 'data/regions/sinnoh-l07-public-triage.json'
      - 'data/regions/sinnoh-l06-human-evidence-routing.json'
      - 'data/regions/sinnoh-l05-native-case-dependencies.json'
      - 'data/regions/sinnoh-l04-independent-review-checklist.json'
      - 'data/regions/sinnoh-g12-native-handoff.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l12-gaps:
    name: L12 / 1084 links, 20 humanos e 44 nativos ausentes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar as falsas aprovacoes e todas as lacunas
        run: python -m unittest discover -s tests -p 'test_sinnoh_l12_coverage_gaps.py' -v
      - name: Auditoria L12 fail-closed, somente JSON publico
        run: |
          python scripts/regions/audit_sinnoh_l12_coverage_gaps.py > /tmp/sinnoh-l12-public.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/sinnoh-l12-public.json')
          r=json.loads(p.read_text('utf8'))
          assert r['stage']=='L12' and r['status']=='PUBLIC_COVERAGE_AUDITED_REAL_EVIDENCE_MISSING'
          assert r['baseline_commits']=={
           'L07':'d98033b362dac82347e0d97cb5606870eaa70b22',
           'L08':'8617ef47ea6745920cb6fe4be251982380d7628d',
           'L09':'39e51de92aafdab3f5aea3f929f57f5c0bb72b2d',
           'L10':'7fd821007e63fe9cf0d0c4bf14d153a23cda2b6a',
           'L11':'9d901a0cf21aa2742f731ee387a51f945bac8a5d'}
          assert r['source_l11_git_blob']=='c39f81867568fb95c65ca8113431e1db05919168'
          assert r['public_documentary']=={
           'case_ids_checked':44,'criteria_ids_checked':20,
           'edges_checked':1084,'missing_public_edges':0}
          assert r['missing_evidence']=={
           'local_reports':5,'human_signoffs':20,'windows_native_qa':43,
           'android_native_qa':1,'native_qa_total':44,'bcd_approvals':13}
          assert (r['cases_total'],r['criteria_total'],r['windows_cases'],r['android_cases'])==(44,20,43,1)
          assert (r['human_approved'],r['native_approved'],r['local_reports_received'],r['phase_bcd_approved'])==(0,0,0,0)
          assert r['blocker_ids']==['B09','B10','B11','R07','R08','R09']
          assert r['r09_global_only'] and not r['sinnoh_playable']
          assert not r['human_qa_authorized'] and not r['native_qa_authorized']
          assert [r['gates'][x] for x in ('r07','r08','r09')]==['PENDING']*3
          assert r['guardrails']['watch_unchanged_not_global_save_isolation']
          assert r['guardrails']['mapids_not_reserved'] and r['guardrails']['asset_rights_not_approved']
          assert r['guardrails']['no_game_exe_execution'] and r['guardrails']['no_joiplay_execution']
          assert r['guardrails']['no_local_save_access'] and r['guardrails']['no_upload']
          for sensitive in ('Save01.rxdata','private-baseline.json','hmac_key','watch_id'):
              assert sensitive not in p.read_text('utf8')
          print('SINNOH_L12_PUBLIC_LINKS_1084_COMPLETE_HUMAN_0_20_NATIVE_0_44')
          PY
      - name: Nao aceitar relatorios locais, saves nem instaladores
        run: |
          test ! -e .blue-work/sinnoh-l00-input/public-reports.json
          test ! -e .blue-work/sinnoh-l01-source
          echo 'SINNOH_L12_PUBLIC_ONLY_NO_NATIVE_QA'

  l12-regressions:
    name: L12 / L11 L10 L09 L08 L07 L06 L05 L04 L03 L02 L01 L00 G12
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: L11 traceability
        run: python -m unittest discover -s tests -p 'test_sinnoh_l11_traceability.py' -v
      - name: L10 blocker index
        run: python -m unittest discover -s tests -p 'test_sinnoh_l10_public_index.py' -v
      - name: L09 review handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_l09_public_handoff.py' -v
      - name: L08 pinned snapshot
        run: python -m unittest discover -s tests -p 'test_sinnoh_l08_pinned_snapshot.py' -v
      - name: L07 triage
        run: python -m unittest discover -s tests -p 'test_sinnoh_l07_public_triage.py' -v
      - name: L06 human evidence
        run: python -m unittest discover -s tests -p 'test_sinnoh_l06_human_evidence.py' -v
      - name: L05 dependencies
        run: python -m unittest discover -s tests -p 'test_sinnoh_l05_native_dependencies.py' -v
      - name: L04 checklist
        run: python -m unittest discover -s tests -p 'test_sinnoh_l04_human_review.py' -v
      - name: L03 matrix
        run: python -m unittest discover -s tests -p 'test_sinnoh_l03_matrix.py' -v
      - name: L02 sanitization
        run: python -m unittest discover -s tests -p 'test_sinnoh_l02_evidence.py' -v
      - name: L01 exporter
        run: python -m unittest discover -s tests -p 'test_sinnoh_l01_exporter.py' -v
      - name: L00 readiness
        run: python -m unittest discover -s tests -p 'test_sinnoh_l00_readiness.py' -v
      - name: G12 native handoff
        run: python -m unittest discover -s tests -p 'test_sinnoh_g12_handoff.py' -v

  l12-portal:
    name: L12 / public handoff read-only and full portal build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript seguro da página L12
        run: node --check site/public/assets/sinnoh-l12-coverage-gaps.js
      - name: Testes Node L12/L11/L10/L07
        working-directory: site
        run: node --test tests/sinnoh-l12-coverage-gaps.test.mjs tests/sinnoh-l11-traceability.test.mjs tests/sinnoh-l10-blocker-index.test.mjs tests/sinnoh-l07-triage.test.mjs
      - name: Compilar portal completo
        working-directory: site
        run: npm run build
      - name: Confirmar artefatos públicos de cobertura
        run: |
          test -s site/dist/sinnoh-l12-lacunas.html
          test -s site/dist/data/sinnoh-l12-public-coverage-gaps.json
          test -s site/dist/assets/sinnoh-l12-coverage-gaps.js
          grep -q 'sinnoh-l12-lacunas.html' site/dist/index.html
          echo 'SINNOH_L12_NO_REAL_EVIDENCE_NO_QA_AUTHORIZATION'
