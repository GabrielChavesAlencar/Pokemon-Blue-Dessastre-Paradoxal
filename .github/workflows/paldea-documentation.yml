name: Paldea - pesquisa e planejamento

on:
  pull_request:
    paths:
      - 'docs/PALDEA_*.md'
      - '.github/workflows/paldea-documentation.yml'

permissions:
  contents: read

concurrency:
  group: paldea-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validar PD00 a PD05, sem fontes externas ou jogo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          def read(name):
              return Path("docs", name).read_text(encoding="utf-8")

          def keys(text, prefix):
              return re.findall(rf"^\| ({prefix}\d{{2}}) \|", text, re.M)

          def ordered(prefix, count):
              return [f"{prefix}{i:02}" for i in range(1, count + 1)]

          base = os.environ["BASE_SHA"]
          assert re.fullmatch(r"[a-f0-9]{40}", base)
          paths = git("diff", "--name-only", f"{base}...HEAD").splitlines()
          assert paths and all(
              re.fullmatch(r"docs/PALDEA_[A-Z0-9_]+\.md", path)
              or path == ".github/workflows/paldea-documentation.yml"
              for path in paths
          ), paths
          plan_name = "PALDEA_PESQUISA_E_PLANEJAMENTO.md"
          files = {
              "PD01": "PALDEA_PD01_FONTES_E_DIREITOS.md",
              "PD02": "PALDEA_PD02_INVENTARIO_E_PROGRESSAO.md",
              "PD03": "PALDEA_PD03_DESENHO_E_PRIMEIRO_RECORTE.md",
              "PD04": "PALDEA_PD04_VALIDACAO_E_HANDOFF.md",
              "PD05": "PALDEA_PD05_ATLAS_VISUAL_E_TILES_KANTO.md",
          }
          roadmap_name = "PALDEA_ROADMAP_CODEX_100_JOGAVEL_WINDOWS_ANDROID.md"
          plan = read(plan_name)
          roadmap = read(roadmap_name)
          assert all(f"| {stage} |" in plan and name in plan for stage, name in files.items())
          assert keys(roadmap, "PL") == ["PL00", *ordered("PL", 9)]
          for name in (plan_name, roadmap_name, *files.values()):
              doc = Path("docs", name)
              for link in re.findall(r"\]\(([^ )]+)\)", read(name)):
                  target = link.partition("#")[0]
                  if not target or target.startswith(("https://", "http://")):
                      continue
                  assert (doc.parent / target).is_file(), (name, link)

          rev = "59afa3a7c73f9aea53b8eb592ebea3315965d92e"
          assert git("rev-parse", f"{rev}^{{tree}}").strip() == "d24dbc9b4909b46e8dab28bf548b3fff304ee27a"
          assert len(git("ls-tree", "-r", "--name-only", rev).splitlines()) == 2307
          paldea = json.loads(Path("site/public/data/regions.json").read_text())["regions"]["PALDEA"]
          assert paldea["status"] == "planned" and paldea["base"] == "Scarlet / Violet"
          assert paldea["versions"] == ["Scarlet", "Violet", "The Teal Mask", "The Indigo Disk"]
          assert paldea["milestones"] == ["CORTONDO", "ARTAZON", "LEVINCIA", "CASCARRAFA", "MEDALI", "MONTENEVERA", "ALFORNADA", "GLASEADO"]
          assert list(paldea["field"]) == ["DASH", "SURF", "HIGH_JUMP", "GLIDE", "CLIMB"]
          print("PALDEA_PD00_BASELINE_DOCUMENTAL_OK")

          sources = read(files["PD01"])
          for word in ("RPG Maker XP", "Fire Ash", "Scarlet", "SHA-256"):
              assert word.casefold() in sources.casefold(), word
          print("PALDEA_PD01_FONTES_DOCUMENTAL_OK")

          inv = read(files["PD02"])
          assert keys(inv, "C") == ordered("C", 12)
          assert keys(inv, "P") == ordered("P", 15)
          assert not keys(inv, "R"), "Paldea não tem rotas clássicas numeradas."
          for prefix, count in (("G", 8), ("L", 5), ("S", 5), ("T", 2), ("B", 2)):
              assert keys(inv, prefix) == ordered(prefix, count), prefix
          for key in paldea["milestones"]:
              assert re.search(rf"\b{key}\b", inv), key
          print("PALDEA_PD02_INVENTARIO_PROGRESSAO_DOCUMENTAL_OK")

          design = read(files["PD03"])
          assert keys(design, "D") == ordered("D", 3)
          for word in ("Cabo Poco", "Mesagoza", "Katy", "NOT_RUN"):
              assert word in design, word
          print("PALDEA_PD03_DESENHO_DOCUMENTAL_OK")

          handoff = read(files["PD04"])
          assert keys(handoff, "T") == ordered("T", 8)
          for word in ("Blue-Story.exe", "SHA-256", "BLOCKED_RELEASE", "BLOCKED_ENV", "NOT_RUN"):
              assert word in handoff, word
          print("PALDEA_PD04_HANDOFF_DOCUMENTAL_OK")

          atlas = read(files["PD05"])
          for prefix in ("C", "P", "T", "B"):
              assert keys(atlas, prefix) == keys(inv, prefix), prefix
              for key in keys(inv, prefix):
                  row = re.search(rf"^\| {key} \|.+$", atlas, re.M).group()
                  assert row.count("https://") >= 2, key
          assert "Kanto" in atlas and not re.search(r"!\[[^]]*\]\(", atlas)
          assert files["PD05"] in roadmap and files["PD05"] in design
          print("PALDEA_PD05_ATLAS_VISUAL_TILES_KANTO_DOCUMENTAL_OK")
          PY
