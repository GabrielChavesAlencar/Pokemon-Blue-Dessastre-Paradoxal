name: Blue Studio - testes e regressao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-contract:
    name: PBS + contratos UI + syntax JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes unitarios e API (sem ROM)
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe JavaScript
        run: |
          node --check web/app.js
          node --check web/sprites.js
          node --check web/pokemon.js
          node --check web/moves-editor.js
          node --check web/navigation.js
          node --check web/music-editor.js
          node --check tests/browser_music_smoke.cjs
          node --check tests/browser_smoke.cjs
  smoke-browser:
    name: Navegacao real + salvamento PBS (Chromium)
    needs: python-and-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright de testes (nao modifica o jogo)
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar regressao ponta a ponta com dados temporarios
        run: |
          node tests/browser_smoke.cjs
          node tests/browser_music_smoke.cjs
      # Capturas ficam locais ao runner. O upload de artefatos foi removido
      # porque a conta GitHub atingiu sua cota de storage.
  windows-runner:
    name: RUN.bat - migra branch antiga e atualiza (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testar correcao da branch fora de main
        shell: pwsh
        run: |
          git switch -c branch-antiga-regressao
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar branch simulada" }
          $env:BLUE_STUDIO_NO_SERVER = "1"
          cmd /c "call RUN.bat"
          if ($LASTEXITCODE -ne 0) { throw "RUN.bat falhou na migracao" }
          if ((git branch --show-current).Trim() -ne "main") { throw "RUN.bat nao voltou para main" }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Falha ao buscar origin/main" }
          if ((git rev-parse HEAD).Trim() -ne (git rev-parse origin/main).Trim()) { throw "main nao esta atualizada" }
          cmd /c "call RUN.bat"
          if ($LASTEXITCODE -ne 0) { throw "RUN.bat falhou na segunda execucao" }
      - name: Testar descoberta de Python no atalho do laboratorio
        shell: pwsh
        run: |
          cmd /d /c "call TESTAR_BATALHA.bat --help"
          if ($LASTEXITCODE -ne 0) { throw "TESTAR_BATALHA.bat nao encontrou Python ou falhou ao iniciar o launcher" }
