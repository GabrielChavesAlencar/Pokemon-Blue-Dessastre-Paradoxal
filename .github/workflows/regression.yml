name: Blue Studio - testes e regressao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-contract:
    name: PBS + contratos UI + syntax JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes unitarios e API (sem ROM)
        run: python -m unittest discover -s tests -v
      - name: Auditar contrato Hoenn sem instalar mapas
        run: |
          python scripts/regions/audit_hoenn_pilot_contract.py --strict
          ruby -c scripts/regions/HoennPilot.rb
          ruby tests/hoenn_pilot_runtime.rb scripts/regions/HoennPilot.rb
      - name: Auditar contratos de Sinnoh sem instalar mapas
        run: python scripts/regions/audit_sinnoh_source.py
      - name: Validar historia isolada de Sinnoh no Ruby (sem game)
        run: |
          ruby -c scripts/regions/SinnohPilot.rb
          ruby tests/sinnoh_pilot_runtime.rb scripts/regions/SinnohPilot.rb
      - name: Validar integridade dos 64 MP3 de Kanto
        run: python scripts/music/install_kanto_music.py --audit
      - name: Fase 6 - decodificar as 64 musicas MP3 completas sem reproduzir audio
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python scripts/music/audit_kanto_phase6.py --decoder required --output .blue-work/kanto-music-phase6-audio.json
      - name: Gerar baseline fase 0 Kanto (sem alterar game ou saves)
        run: python scripts/music/audit_kanto_phase0.py
      - name: Validar escopo regional de Kanto na engine Ruby (sem tocar MP3)
        run: |
          ruby -c scripts/music/BlueMusic.rb
          ruby tests/kanto_music_runtime.rb
          ruby tests/kanto_music_battles.rb
          ruby tests/kanto_music_me.rb
          ruby tests/kanto_music_scenes.rb
          ruby -c scripts/regions/KantoPilot.rb
          ruby tests/kanto_npc_runtime.rb scripts/regions/KantoPilot.rb scripts/battle_polish/Locale.rb
          ruby -c scripts/battle_polish/Story.rb
          ruby -c scripts/regions/KantoPilot.rb
          ruby tests/regional_boss_balance_runtime.rb scripts/battle_polish/Story.rb scripts/battle_polish/Balance.rb
      - name: Validar sintaxe JavaScript
        run: |
          node --check web/app.js
          node --check web/sprites.js
          node --check web/pokemon.js
          node --check web/moves-editor.js
          node --check web/navigation.js
          node --check web/music-editor.js
          node --check tests/browser_music_smoke.cjs
          node --check tests/browser_smoke.cjs
  sinnoh-offline:
    name: Sinnoh - contratos isolados (sem ROM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar somente Sinnoh em fixtures locais
        run: python -m unittest discover -s tests -p 'test_sinnoh_*.py' -v
      - name: Testar Ruby dos eventos autorais de Sinnoh
        run: |
          ruby -c scripts/regions/SinnohPilot.rb
          ruby tests/sinnoh_pilot_runtime.rb scripts/regions/SinnohPilot.rb
      - name: Validar probe Ruby nativa de Barry sem iniciar Game.exe
        run: |
          ruby -c scripts/regions/SinnohBarryNativeProbe.rb
          ruby tests/sinnoh_barry_native_probe_runtime.rb scripts/regions/SinnohBarryNativeProbe.rb
      - name: Validar perfil de saves e inicializacao Ruby isolada de Sinnoh
        run: |
          ruby -c scripts/regions/SinnohQAStart.rb
          ruby tests/sinnoh_qa_start_runtime.rb scripts/regions/SinnohQAStart.rb
      - name: Validar mapa, eventos, iniciais e Barry na sondagem Ruby (fixture)
        run: |
          ruby -c scripts/regions/SinnohQAProbe.rb
          ruby tests/sinnoh_qa_engine_probe_runtime.rb scripts/regions/SinnohQAProbe.rb data/regions/sinnoh-twinleaf-events.json
  smoke-browser:
    name: Navegacao real + salvamento PBS (Chromium)
    needs: python-and-contract
    # Playwright 1.56 cannot install Chromium dependencies on ubuntu-26.04.
    # Pin a supported runner instead of following ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright de testes (nao modifica o jogo)
        run: npm install --no-save --no-package-lock playwright@1.56.0
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar regressao ponta a ponta com dados temporarios
        run: |
          node tests/browser_smoke.cjs
          node tests/browser_music_smoke.cjs
      # Capturas ficam locais ao runner. O upload de artefatos foi removido
      # porque a conta GitHub atingiu sua cota de storage.
  windows-runner:
    name: RUN.bat - migra branch antiga e atualiza (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testar correcao da branch fora de main
        shell: pwsh
        run: |
          git switch -c branch-antiga-regressao
          if ($LASTEXITCODE -ne 0) { throw "Falha ao criar branch simulada" }
          $env:BLUE_STUDIO_NO_SERVER = "1"
          cmd /c "call RUN.bat"
          if ($LASTEXITCODE -ne 0) { throw "RUN.bat falhou na migracao" }
          if ((git branch --show-current).Trim() -ne "main") { throw "RUN.bat nao voltou para main" }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Falha ao buscar origin/main" }
          if ((git rev-parse HEAD).Trim() -ne (git rev-parse origin/main).Trim()) { throw "main nao esta atualizada" }
          cmd /c "call RUN.bat"
          if ($LASTEXITCODE -ne 0) { throw "RUN.bat falhou na segunda execucao" }
      - name: Testar descoberta de Python no atalho do laboratorio
        shell: pwsh
        run: |
          cmd /d /c "call TESTAR_BATALHA.bat --help"
          if ($LASTEXITCODE -ne 0) { throw "TESTAR_BATALHA.bat nao encontrou Python ou falhou ao iniciar o launcher" }
