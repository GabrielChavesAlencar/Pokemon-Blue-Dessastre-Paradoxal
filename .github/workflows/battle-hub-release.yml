name: Hub de Batalha - download separado
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'server/prepare_game.py', 'server/music_editor.py', 'server/ruby_marshal.py', 'data/**', 'assets/music/**', 'site/assets/**', 'site/public/data/story-trainers.json', 'docs/**', '.github/workflows/battle-hub-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battle-hub-release
  cancel-in-progress: false
jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/battle_hub/package.py --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: dist/Blue-Battle-Hub.zip*
          compression-level: 0
  windows-android:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar os dois EXEs e verificar protecao dos saves
        run: python scripts/windows/build.py
      - name: Provar dependencias privadas sem Python ou Git no PATH
        shell: powershell
        run: |
          $savedPath=$env:PATH
          $env:PATH="$env:WINDIR\System32;$env:WINDIR"
          $runtime=Start-Process -FilePath "$pwd\dist\Blue-Story.exe" -ArgumentList @('--runtime-test',"`"$pwd\.blue-work\runtime-proof.json`"",'--root',"`"$pwd`"") -WindowStyle Hidden -PassThru -Wait
          $env:PATH=$savedPath
          if($runtime.ExitCode -ne 0){Get-Content .blue-work/launcher.log;throw 'Portable runtime proof failed'}
          $proof=Get-Content .blue-work/runtime-proof.json | ConvertFrom-Json
          if(-not $proof.ok){throw 'Runtime proof missing'}
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path $proof.git)
          "BLUE_PRIVATE_PYTHON=$($proof.python)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Instalar a base limpa com o Python privado
        shell: powershell
        run: |
          & $env:BLUE_PRIVATE_PYTHON scripts/install_game.py --apply
          if($LASTEXITCODE -ne 0){throw 'Fresh install failed'}
          & $env:BLUE_PRIVATE_PYTHON scripts/android/package.py --request-compile
          if($LASTEXITCODE -ne 0){throw 'Compilation request failed'}
      - name: Preparar OpenGL por software para o compilador nativo
        shell: powershell
        run: |
          $ProgressPreference='SilentlyContinue'
          $mesa=Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesa
          if((Get-FileHash -LiteralPath $mesa -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'){throw 'Mesa checksum failed'}
          $mesaFolder=Join-Path $env:RUNNER_TEMP 'blue-mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" x $mesa "-o$mesaFolder" -y | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Mesa extraction failed'}
          $drivers=@(Get-ChildItem -LiteralPath $mesaFolder -Recurse -File -Filter '*.dll' | Where-Object { $_.FullName -match '[\\/]x64[\\/]' })
          if(-not ($drivers | Where-Object { $_.Name -eq 'opengl32.dll' })){throw 'x64 OpenGL driver missing'}
          $drivers | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination game -Force }
      - name: Compilar dados e empacotar o Android experimental
        shell: powershell
        env:
          GALLIUM_DRIVER: llvmpipe
          ALSOFT_DRIVERS: 'null'
        run: |
          $compiler=Start-Process -FilePath "$pwd\game\Game.exe" -WorkingDirectory "$pwd\game" -WindowStyle Hidden -PassThru -RedirectStandardOutput "$pwd\.blue-work\native-stdout.txt" -RedirectStandardError "$pwd\.blue-work\native-stderr.txt"
          if(-not $compiler.WaitForExit(300000)){Stop-Process -Id $compiler.Id;throw 'Native compiler timed out'}
          if($compiler.ExitCode -ne 0 -or -not (Test-Path game/Data/blue-android-compiled.txt)){
            Get-Content .blue-work/native-stdout.txt,.blue-work/native-stderr.txt,game/Data/blue-android-stage.txt,game/Data/blue-android-error.txt,game/errorlog.txt -ErrorAction SilentlyContinue | Select-Object -Last 100
            throw 'Native compiler failed to produce its completion marker'
          }
          & $env:BLUE_PRIVATE_PYTHON scripts/android/package.py --revision '${{ github.sha }}'
          if($LASTEXITCODE -ne 0){throw 'Android bundle verification failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-android
          path: |
            dist/Blue-Story.exe
            dist/Blue-Battle-Hub.exe
            dist/Blue-Android-JoiPlay.zip*
          compression-level: 0
  release:
    needs: [source-package, windows-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-android
          path: dist
      - name: Publicar downloads verificados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="battle-hub-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$tag" dist/Blue-Story.exe dist/Blue-Battle-Hub.exe dist/Blue-Battle-Hub.zip dist/Blue-Battle-Hub.zip.sha256 dist/Blue-Android-JoiPlay.zip dist/Blue-Android-JoiPlay.zip.sha256 --target "$GITHUB_SHA" --title "Pokémon Blue - build ${GITHUB_RUN_NUMBER}" --notes-file docs/INSTALACAO.md --latest
